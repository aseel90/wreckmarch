name: WS15 roadmap one-shot sync

on:
  push:
    branches: [ws15-enemy-role-baseline]
    paths:
      - '.github/workflows/ws15-roadmap-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws15-enemy-role-baseline
          fetch-depth: 0
      - name: Patch roadmap and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('COMBAT_BUILD_BALANCE_ROADMAP.md')
          text = path.read_text()

          old_row = '| 15 | Enemy role/range matchup safety | ⚪ PENDING BASELINE | Verify Rat/Hound/Sawbug remain meaningful against both long-range and future short-range characters |'
          new_row = '| 15 | Enemy role/range matchup safety | 🟡 WS15-A RUNNER BASELINE IN PROGRESS / SHORT-RANGE CHECK DEFERRED | Canonicalize enemy-role ownership without changing validated live behavior; freeze Runner role/range regression gates now, repeat short-range matchup only after WS14-E activation |'
          if old_row not in text and new_row not in text:
              raise SystemExit('WS15 register row anchor not found')
          text = text.replace(old_row, new_row)

          section = '''### Workstream 15 staged delivery — Enemy role / range safety

- **WS15-A — Runner baseline (current):** audit Scrap Rat / Rust Hound / Sawbug roles, remove duplicated runtime combat tuning, add deterministic role/range safety coverage, and validate the exact deployed SHA.
- **WS15-B — Short-range matchup (deferred):** repeat the matchup review only after the Shotgun character is actually activated in WS14-E. This deferred check does **not** block WS16.
- Canonical ownership rule: enemy definitions own enemy combat/movement behavior numbers; Run Balance owns wave timing, spawn weights and threat budgeting.
- No HP/damage/spawn-pressure rebalance is approved merely by opening WS15. See `WS15_ENEMY_ROLE_BASELINE.md`.

'''
          anchor = '### Workstream 14 staged delivery — Shotgun character\n'
          if section not in text:
              if anchor not in text:
                  raise SystemExit('WS14 section anchor not found')
              text = text.replace(anchor, section + anchor, 1)

          old_next = '- **Next:** WS13 Canonical Weapon Registry / signature-weapon resolution.'
          new_next = '- **Checkpoint next at the time:** WS13 Canonical Weapon Registry / signature-weapon resolution — now complete; the current active balance track is WS15-A.'
          text = text.replace(old_next, new_next)

          path.write_text(text)
          Path('.github/workflows/ws15-roadmap-sync.yml').unlink()
      - name: Commit roadmap-only result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add COMBAT_BUILD_BALANCE_ROADMAP.md .github/workflows/ws15-roadmap-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "Sync WS15 active roadmap and remove one-shot updater"
          git push origin HEAD:ws15-enemy-role-baseline
