name: Apply U4 initial Hunter pool once

on:
  push:
    branches: [u4-finalize-hunter-initial-pool]
    paths:
      - '.github/workflows/u4-initial-pool-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded U4 patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f src/upgrades/upgrade-offer-pool.js ]; then
            echo "U4 offer-pool owner already exists; nothing to apply."
            exit 0
          fi
          printf '%s' '' | base64 -d | gzip -d > /tmp/u4.patch
          git apply --check /tmp/u4.patch
          git apply --whitespace=error-all /tmp/u4.patch
          mkdir -p src/upgrades tests/unit
          printf '%s' '' | base64 -d | gzip -d > src/upgrades/upgrade-offer-pool.js
          printf '%s' '' | base64 -d | gzip -d > tests/unit/upgrade-offer-pool.test.ts
          git diff --check
          node --check src/upgrades/upgrade-offer-pool.js
          node --check src/phase-c-runtime.js
          node --check src/phase-c1-runtime.js
      - name: Commit U4 pool ownership
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -f src/upgrades/upgrade-offer-pool.js ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/upgrades/upgrade-offer-pool.js tests/unit/upgrade-offer-pool.test.ts src/phase-c-runtime.js src/phase-c1-runtime.js index.html .github/workflows/pages.yml tests/unit/weapon-projectile-integration.test.ts tests/unit/telemetry-bridge.test.ts tests/unit/upgrade-roadmap-integrity.test.ts UPGRADE_SYSTEM_2_ROADMAP.md
          git commit -m "U4: finalize canonical 12-card Hunter pool"
          git push
