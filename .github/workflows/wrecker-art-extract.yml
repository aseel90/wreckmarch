name: Wrecker Art Extract

on:
  push:
    branches:
      - shotgun/wrecker-production-art

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip-wrecker-extract]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy opencv-python-headless
      - name: Extract production frames from approved source sheets
        run: python scripts/extract-wrecker-frames.py
      - name: Promote approved frames to canonical PNG paths
        run: |
          cp assets/hero/shotgun/generated-wrecker/idle-0.png assets/hero/shotgun/idle-0.png
          cp assets/hero/shotgun/generated-wrecker/idle-1.png assets/hero/shotgun/idle-1.png
          cp assets/hero/shotgun/generated-wrecker/run-0.png assets/hero/shotgun/run-0.png
          cp assets/hero/shotgun/generated-wrecker/run-1.png assets/hero/shotgun/run-1.png
          cp assets/hero/shotgun/generated-wrecker/run-2.png assets/hero/shotgun/run-2.png
          cp assets/hero/shotgun/generated-wrecker/run-3.png assets/hero/shotgun/run-3.png
          cp assets/hero/shotgun/generated-wrecker/run-4.png assets/hero/shotgun/run-4.png
      - name: Commit generated frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero/shotgun/generated-wrecker assets/hero/shotgun/idle-0.png assets/hero/shotgun/idle-1.png assets/hero/shotgun/run-0.png assets/hero/shotgun/run-1.png assets/hero/shotgun/run-2.png assets/hero/shotgun/run-3.png assets/hero/shotgun/run-4.png
          git diff --cached --quiet && exit 0
          git commit -m "Promote Wrecker production frames [skip-wrecker-extract]"
          git push
