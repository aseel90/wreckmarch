name: Repair Deferred Character Roadmap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-deferred-character-roadmap.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last good docs and mark character work deferred
        shell: bash
        run: |
          set -euo pipefail
          git checkout d6861e45e4e1862f11bbc737882c7a5166fe56dc -- COMBAT_BUILD_BALANCE_ROADMAP.md WS14_C_CHARACTER_ART_GATE.md
          python3 - <<'PY'
          from pathlib import Path

          road = Path('COMBAT_BUILD_BALANCE_ROADMAP.md')
          text = road.read_text()
          text = text.replace(
              '| 14 | Shotgun Character combat identity | ✅ WS14-B WEAPON FOUNDATION COMPLETE / CHARACTER ACTIVATION LATER |',
              '| 14 | Shotgun Character combat identity | ✅ WS14-B WEAPON FOUNDATION COMPLETE / WS14-C–F CHARACTER WORK DEFERRED |',
          )
          text = text.replace(
              'The Shotgun is deliberately **not selectable/live yet**; character art, animations, start-screen selection and live activation belong to WS14-C/D/E.',
              'The Shotgun is deliberately **not selectable/live yet**. By project decision on 2026-09-02, all remaining character work is parked for later: identity/art (WS14-C), character definition + selection (WS14-D), full activation/validation (WS14-E), and post-activation character-specific expansion (WS14-F).',
          )
          text = text.replace(
              'Workstream 14 is split into explicit delivery gates. **All remaining character work below is intentionally deferred; it is recorded here so we can return to it later without starting it now.**',
              'Workstream 14 is split into explicit delivery gates. **Decision 2026-09-02: all remaining character work below is intentionally deferred; it is recorded here in full so we can return to it later without starting it now.**',
          )
          road.write_text(text)

          gate = Path('WS14_C_CHARACTER_ART_GATE.md')
          text = gate.read_text()
          text = text.replace(
              'Status: 🟡 ACTIVE DESIGN GATE — ART NOT GENERATED YET',
              'Status: ⚪ FUTURE / DEFERRED — ART NOT GENERATED; DO NOT START UNTIL THIS WORKSTREAM IS EXPLICITLY REOPENED',
          )
          text = text.replace(
              'WS14-C now owns the **dedicated visual identity and minimal production animation set** for the future Shotgun character.',
              'WS14-C will later own the **dedicated visual identity and minimal production animation set** for the future Shotgun character. The workstream is currently parked; this document preserves the production contract for when the project returns to character work.',
          )
          gate.write_text(text)
          PY

      - name: Commit repaired docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMBAT_BUILD_BALANCE_ROADMAP.md WS14_C_CHARACTER_ART_GATE.md
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'Restore and defer remaining Shotgun character roadmap work'
          git push origin HEAD:main
