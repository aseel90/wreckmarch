name: Temporary Sawbug PR84 Diagnostic

on:
  push:
    branches: [stabilize-sawbug-self-test]

permissions:
  contents: read
  issues: write

concurrency:
  group: sawbug-pr84-diagnostic
  cancel-in-progress: true

jobs:
  sawbug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Sawbug E2E only
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec playwright test tests/e2e/sawbug.spec.ts --workers=1 2>&1 | tee sawbug-pr84.log
      - name: Publish diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          TITLE='[TEMP Sawbug PR84] E2E diagnostic'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[TEMP Sawbug PR84] E2E diagnostic") | .number' | head -n1)"
          {
            printf 'Sawbug-only diagnostic on `%s`: **%s**\n\n' "$SHA" "$OUTCOME"
            if [ -f sawbug-pr84.log ]; then
              printf '```text\n'
              tail -c 18000 sawbug-pr84.log
              printf '\n```\n'
            fi
          } > /tmp/sawbug-pr84.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/sawbug-pr84.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/sawbug-pr84.md
          fi
