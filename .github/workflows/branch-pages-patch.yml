name: Branch Pages Patch

on:
  push:
    branches: [fix/wrecker-left-facing-weapon-origin]

permissions:
  contents: write

concurrency:
  group: branch-pages-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pages-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wrecker-left-facing-weapon-origin
      - name: Apply narrow live-smoke patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pages.yml')
          text = path.read_text()
          replacements = [
              ('character-runtime-presentation.js?v=6&wrecker=7', 'character-runtime-presentation.js?v=7&wrecker=8'),
              ('shotgun-production-presentation.js?v=6&wrecker=7', 'shotgun-production-presentation.js?v=7&wrecker=8'),
              ('shotgun-runtime-presentation.js?v=6', 'shotgun-runtime-presentation.js?v=7'),
              ('./src/phase-c5-runtime.js?v=10&u7=1&wrecker=7', './src/phase-c5-runtime.js?v=10&u7=1&wrecker=8'),
              ('./src/phase-d1-runtime.js?v=29&u5=3&wrecker=7', './src/phase-d1-runtime.js?v=29&u5=3&wrecker=8'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected live-smoke contract: {old}')
              text = text.replace(old, new)
          needle = '          grep -F "supportFromGrip" wm-live-shotgun-runtime-presentation.js\n'
          extra = (
              '          grep -F "getShotgunWeaponOriginForFacing" wm-live-shotgun-runtime-presentation.js\n'
              '          grep -F "facing === \'left\' ? 1 - origin.x : origin.x" wm-live-shotgun-runtime-presentation.js\n'
              '          grep -F ".setOrigin(pose.weaponOrigin.x, pose.weaponOrigin.y)" wm-live-shotgun-production-presentation.js\n'
          )
          if extra not in text:
              if needle not in text:
                  raise SystemExit('missing supportFromGrip insertion point')
              text = text.replace(needle, needle + extra, 1)
          path.write_text(text)
          PY
      - name: Commit patched workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align live smoke with mirrored Wrecker origin [pages-patched]"
          git push origin HEAD:fix/wrecker-left-facing-weapon-origin
