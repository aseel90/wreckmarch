name: WS15 roadmap close one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ws15-close-roadmap-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close WS15-A in canonical roadmap and self-remove
        shell: python
        run: |
          from pathlib import Path

          p = Path('COMBAT_BUILD_BALANCE_ROADMAP.md')
          s = p.read_text()

          old_row = '| 15 | Enemy role/range matchup safety | ⚪ PENDING BASELINE | Verify Rat/Hound/Sawbug remain meaningful against both long-range and future short-range characters |'
          new_row = '| 15 | Enemy role/range matchup safety | ✅ WS15-A RUNNER BASELINE COMPLETE / WS15-B SHORT-RANGE CHECK DEFERRED | PR #205 / main `7de3941f0b56c85cc8c210fca837d932097fc7ad` canonicalized enemy-role ownership without changing validated live behavior. Final head `69ec80db3fe0234070344ed69454c748cb296b07` passed Quality, Smoke, all 3 Chromium shards and aggregate E2E; exact merge SHA passed Pages/live verification. Future short-range-character matchup remains deferred until WS14-E and does not block WS16. |'
          if old_row not in s and new_row not in s:
              raise SystemExit('WS15 roadmap row anchor missing')
          s = s.replace(old_row, new_row, 1)

          section = '''### Workstream 15 staged delivery — Enemy role / range safety

          - **WS15-A — Runner baseline — ✅ COMPLETE / MERGED + PROD DEPLOYED:** PR #205 merged as `7de3941f0b56c85cc8c210fca837d932097fc7ad`. Enemy definitions/behaviors now own enemy movement/combat behavior numbers; Run Balance owns wave timing, spawn weights and threat budgeting; Run Director assigns run role/threat without carrying a second Hound movement identity.
          - Deterministic Runner gates preserve the intended roster roles without an unsupported rebalance: Scrap Rat = swarm pressure, Rust Hound = readable hunter with slower chase + faster committed slide, Sawbug = ranged anti-camp pressure.
          - Final PR head `69ec80db3fe0234070344ed69454c748cb296b07` passed Quality, Smoke, E2E shards 1/3–3/3 and aggregate E2E. The merged SHA passed GitHub Pages deployment/recovery and live verification.
          - **WS15-B — future short-range matchup — ⚪ DEFERRED / NOT NOW:** repeat the matchup review only after the Shotgun character is activated in WS14-E. This deferred gate does **not** block WS16.
          - Stop rule remains: do not alter enemy HP, damage, spawn weights, wave pressure or attack coefficients under WS15 without repeatable deterministic or production evidence. WS16 owns wave/difficulty scaling.
          - **Next active balance workstream: WS16 — Wave/difficulty scaling vs player power.**

          '''.replace('          ', '')
          anchor = '### Workstream 14 staged delivery — Shotgun character\n'
          if section not in s:
              if anchor not in s:
                  raise SystemExit('WS14 staged section anchor missing')
              s = s.replace(anchor, section + anchor, 1)

          old_next = '- **Next:** WS13 Canonical Weapon Registry / signature-weapon resolution.'
          new_next = '- **Historical checkpoint:** WS13 Canonical Weapon Registry / signature-weapon resolution is complete; the current next active balance workstream is **WS16 — Wave/difficulty scaling vs player power**.'
          s = s.replace(old_next, new_next, 1)

          old_exec = '- Workstreams **1–9 and 11–13 are complete** under their required gates. Workstream **10 — Triple Riveter / advanced multishot** is implemented and deployed but remains intentionally open for one natural Twin L2 → Triple Production/D1 gameplay validation run; failure to roll it naturally is not treated as a defect and does not block later work. **Workstream 14 foundation is parked after WS14-B:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. WS14-C/D/E/F are explicitly **deferred future character scope** recorded above; do not start art generation, make the Shotgun character selectable, reuse Runner art as a shipping placeholder, or patch a start screen until we intentionally return to this workstream.'
          new_exec = '- Workstreams **1–9, 11–13 and WS15-A are complete** under their required gates. Workstream **10 — Triple Riveter / advanced multishot** is implemented and deployed but remains intentionally open for one natural Twin L2 → Triple Production/D1 gameplay validation run; failure to roll it naturally is not treated as a defect and does not block later work. **Workstream 14 foundation is parked after WS14-B:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. WS14-C/D/E/F and WS15-B are explicitly **deferred future character scope**; do not start art generation, make the Shotgun character selectable, reuse Runner art as a shipping placeholder, patch a start screen, or run the short-range matchup gate until we intentionally return to that track. **Current active balance work continues with WS16 — Wave/difficulty scaling vs player power.**'
          if old_exec not in s and new_exec not in s:
              raise SystemExit('execution-rule anchor missing')
          s = s.replace(old_exec, new_exec, 1)

          p.write_text(s)
          Path('.github/workflows/ws15-close-roadmap-once.yml').unlink()
      - name: Commit final roadmap state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add COMBAT_BUILD_BALANCE_ROADMAP.md .github/workflows/ws15-close-roadmap-once.yml
          git commit -m "Close WS15-A in combat balance roadmap"
          git push
