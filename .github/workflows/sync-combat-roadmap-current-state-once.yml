name: Sync combat roadmap current state once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-combat-roadmap-current-state-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize stale roadmap status
        shell: python
        run: |
          from pathlib import Path
          p = Path('COMBAT_BUILD_BALANCE_ROADMAP.md')
          s = p.read_text()
          replacements = {
            '| 10 | Triple Riveter / advanced multishot | 🟡 IMPLEMENTED / GAMEPLAY VALIDATION PENDING | Implemented in PR #188 / main `501f5f3387f90667636bd096e3a884fee17385be`: Twin L2 prerequisite, 3-projectile 1.60x total volley budget, center-only Explosive Rivet arming and full CI/Production deploy passed. Manual Production play did not naturally roll Triple yet, so this workstream stays open only for a future natural Twin L2 → Triple gameplay/D1 validation run. |': '| 10 | Triple Riveter / advanced multishot | ✅ COMPLETE / PROD D1 VALIDATED | Natural Production validation completed from D1 report `wm-1e3b7683-8eae-4517-9de6-cb8f27ebb979`; the Twin L2 → Triple path occurred without forcing or biasing RNG. Implementation, CI, deploy and gameplay evidence are all closed. |',
            '| 17 | Rarity identity + power scaling | ⚪ PENDING BASELINE / U7 | Resolve same-card rarity identity and prevent rarity from magnifying already-multiplicative stats excessively |': '| 17 | Rarity identity + power scaling | ✅ COMPLETE / VALIDATED | Current rarity model was validated against PB1 and RUN-0026; deterministic power-budget gates passed without gameplay-value changes. |',
            '| 18 | Rig/support damage ownership | ⚪ PENDING | Decouple support balance from ambiguous `primaryWeapon.damage` semantics and future shotgun pellet damage |': '| 18 | Rig/support damage ownership | ✅ COMPLETE / LIVE VALIDATED | Fortress Rig support damage owns its canonical 13.92 / 920 ms baseline independently of primary-weapon semantics; regression coverage and exact-SHA live validation passed. |',
            '| 19 | Armor/stat combat semantics + survivability utility | 🟡 FOUNDATION PROD-VALIDATED / BROADER SEMANTICS PENDING | RUN-0026 verified Field Repair + Impact Shield telemetry; canonical armor-mitigation semantics remain future work |': '| 19 | Armor/stat combat semantics + survivability utility | ✅ COMPLETE / PROD VALIDATED | Canonical bounded diminishing-returns Armor mitigation is wired through PlayerDamageSystem; Runner remains unchanged at 0 Armor and exact-SHA Production validation passed. |',
            '| 20 | Build identities + anti-mandatory-card validation | ⚪ PENDING BASELINE | Validate multiple viable builds; no Twin/Heavy/Overclock-style automatic pick should dominate unrelated builds |': '| 20 | Build identities + anti-mandatory-card validation | ✅ COMPLETE / 3-OF-3 PROD VALIDATED | Three distinct Production-valid archetypes passed the RNG-tolerant classifier and PB1 one-card ≤35% direct-power attribution gate; random weak/off-build choices remain allowed. |',
            '| 21 | Mobile projectile/effect performance budget | ⚪ PENDING BASELINE | Set hard ceilings from measured active projectiles, fragments, long frames and late-wave pressure |': '| 21 | Mobile projectile/effect performance budget | ✅ COMPLETE / PROD VALIDATED | Projectile spawn-rate/active-projectile telemetry plus the deterministic evaluator are in place; D1 report `wm-1e3b7683-8eae-4517-9de6-cb8f27ebb979` closed the Production performance gate without a gameplay nerf. |',
            '| 22 | Deterministic interaction matrix / regression scenarios | ⚪ PENDING | Lock reproducible no-upgrade, single-card, pair-synergy and max-power scenarios for before/after comparisons |': '| 22 | Deterministic interaction matrix / regression scenarios | ✅ COMPLETE / CI VALIDATED | High-risk combat mechanic combinations are locked against the canonical 1.50 shared secondary-damage budget; Quality, Smoke, all Chromium shards and aggregate E2E passed. |',
            '| 23 | U4 balance gate + master-roadmap reintegration | ⚪ PENDING | After workstreams 1–22: validate three viable builds, final interaction/performance gate, then merge approved decisions back into `UPGRADE_SYSTEM_2_ROADMAP.md` without deleting protected scope |': '| 23 | U4 balance gate + master-roadmap reintegration | ✅ COMPLETE / VALIDATED | All five final U4 gates passed on PR #246; Quality, Smoke, all E2E shards and aggregate E2E were green. The Combat & Build Balance phase is closed on the protected baseline. |',
            '- **Next active balance workstream: WS17 — Rarity identity + power scaling.**': '- **Historical handoff:** WS17–WS23 are now complete. The Combat & Build Balance phase is closed; the next development must be chosen from the still-open master Upgrade System 2.0 roadmap rather than from this completed register.',
            '- **WS10 Triple Riveter:** implementation is live; keep OPEN only for natural Production gameplay/D1 validation after Twin Riveter L2. Do not force, guarantee or bias the card into a roll just to close the gate.': '- **WS10 Triple Riveter:** ✅ COMPLETE. Natural Twin L2 → Triple Production/D1 validation passed without forcing, guaranteeing or biasing the roll.',
            '- **Historical checkpoint:** WS13 Canonical Weapon Registry / signature-weapon resolution is complete; WS15-A and WS16 are also complete. The current active balance workstream is **WS17 — Rarity identity + power scaling**.': '- **Historical checkpoint:** WS13, WS15-A, WS16 and WS17–WS23 are complete. WS14-C–F and WS15-B remain explicitly deferred character scope.',
            '- Explosive Rivet is complete. Triple Riveter is implemented/deployed and no longer blocked by PB1, but Workstream 10 remains open only for its missing natural gameplay/D1 validation evidence.': '- Explosive Rivet and Triple Riveter are complete and Production/D1 validated. Preserve random card offers; no future validation may force or bias a roll merely to manufacture evidence.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected stale roadmap text missing: ' + old[:100])
              s = s.replace(old, new)
          old = '- Workstreams **1–9, 11–13, WS15-A and WS16 are complete** under their required gates. Workstream **10 — Triple Riveter / advanced multishot** is implemented and deployed but remains intentionally open for one natural Twin L2 → Triple Production/D1 gameplay validation run; failure to roll it naturally is not treated as a defect and does not block later work. **Workstream 14 foundation is parked after WS14-B:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. WS14-C/D/E/F and WS15-B are explicitly **deferred future character scope**; do not start art generation, make the Shotgun character selectable, reuse Runner art as a shipping placeholder, patch a start screen, or run the short-range matchup gate until we intentionally return to that track. **Current active balance work continues with WS17 — Rarity identity + power scaling.**'
          new = '- Workstreams **1–13, WS15-A and WS16–WS23 are complete** under their required gates. **Workstream 14 foundation remains parked after WS14-B:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. WS14-C/D/E/F and WS15-B are explicitly **deferred future character scope**; do not start art generation, make the Shotgun character selectable, reuse Runner art as a shipping placeholder, patch a start screen, or run the short-range matchup gate until we intentionally return to that track. **The Combat & Build Balance phase is closed as of WS23; choose new work from `UPGRADE_SYSTEM_2_ROADMAP.md` or another explicitly approved roadmap.**'
          if old not in s:
              raise SystemExit('Expected stale execution rule missing')
          s = s.replace(old, new)
          p.write_text(s)
      - name: Remove one-shot workflow and commit synchronized roadmap
        run: |
          rm .github/workflows/sync-combat-roadmap-current-state-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add COMBAT_BUILD_BALANCE_ROADMAP.md .github/workflows/sync-combat-roadmap-current-state-once.yml
          git commit -m "Docs: synchronize combat roadmap through WS23"
          git push