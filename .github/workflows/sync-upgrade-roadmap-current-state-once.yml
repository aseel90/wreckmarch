name: Sync Upgrade System roadmap current state once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upgrade-roadmap-current-state-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize master roadmap status
        shell: python
        run: |
          from pathlib import Path
          p = Path('UPGRADE_SYSTEM_2_ROADMAP.md')
          s = p.read_text()
          repl = {
            'The **architecture/core migration** is complete, but the **full Upgrade System 2.0 roadmap is not complete** because U4–U7 and the new-card/build-content requirements below remain open.': 'The **architecture/core migration** is complete. The Combat & Build Balance foundation supporting U4 has also completed WS1–WS23 and is now a protected validated baseline. The **full Upgrade System 2.0 roadmap is still not complete** because remaining elite-reward, content-pool, card-visual, player-facing build-panel and final U7 cleanup/regression work below remains open.',
            '## Phase U4 — New Hunter build cards — **NEXT ACTIVE PHASE**': '## Phase U4 — New Hunter build cards — **BALANCE FOUNDATION COMPLETE / POOL COMPLETION OPEN**',
            '- [ ] Preserve elite reward guarantees. — **Status:** ⚪ NOT STARTED': '- [ ] Preserve elite reward guarantees. — **Status:** 🟢 NEXT ACTIVE — earliest genuinely open implementation requirement after the closed WS1–WS23 balance phase.',
            '- [ ] Add mechanical projectile upgrades incrementally. — **Status:** 🟡 IN PROGRESS — Piercing + Ricochet + Shrapnel + Critical + Explosive are complete; Triple is implemented/deployed and remains open only for its natural gameplay/D1 validation gate': '- [x] Add mechanical projectile upgrades incrementally. — **Status:** ✅ CURRENT PLANNED SET COMPLETE — Piercing + Ricochet + Shrapnel + Critical + Explosive + Triple are implemented, deployed and Production/D1 validated under the closed Combat & Build Balance foundation.',
            '- [ ] Verify at least 3 viable build identities. — **Status:** ⚪ NOT STARTED': '- [x] Verify at least 3 viable build identities. — **Status:** ✅ DONE — WS20 closed after 3-of-3 Production validation with RNG-tolerant identity classification and the PB1 ≤35% one-card direct-power attribution gate.',
            '- [ ] New cards create multiple real builds rather than only larger numbers. — **Status:** 🔵 U4 IN PROGRESS — Piercing/Ricochet/Shrapnel/Critical/Explosive are live; Triple is implemented but gameplay-validation-pending; broader build-identity validation remains': '- [x] New cards create multiple real builds rather than only larger numbers. — **Status:** ✅ VALIDATED — WS20 confirmed three distinct Production-valid build identities while preserving random/off-build card choices.',
            '- [ ] Rarity/levels/prerequisites work predictably for the **expanded** card pool. — **Status:** 🟡 CORE IMPLEMENTED — levels, rarity, prerequisites and technical compatibility filtering are canonical; Triple still needs natural gameplay/D1 evidence and broader expanded-pool validation remains': '- [x] Rarity/levels/prerequisites work predictably for the **expanded** card pool. — **Status:** ✅ VALIDATED — WS17 rarity gates, canonical prerequisites/compatibility and natural Triple Production/D1 evidence are complete.',
            '- [ ] The expanded system remains performant and readable on mobile. — **Status:** ⚪ requires U4/U5 content/UI validation': '- [ ] The expanded system remains performant and readable on mobile. — **Status:** 🟡 COMBAT PERFORMANCE VALIDATED / U5 READABILITY OPEN — WS21 closed projectile/effect performance on Production; card visual hierarchy/readability still belongs to U5.',
            '- [ ] Implement advanced multishot progression. — **Status:** 🟡 IMPLEMENTED / GAMEPLAY VALIDATION PENDING — Triple Riveter landed in PR #188 with Twin L2 prerequisite and 1.60x bounded 3-shot volley; manual Production run did not naturally roll it, so keep open only for a future natural gameplay/D1 validation': '- [x] Implement advanced multishot progression. — **Status:** ✅ DONE — Triple Riveter is implemented with Twin L2 prerequisite and a bounded 1.60x three-shot volley; natural Production/D1 validation completed in `wm-1e3b7683-8eae-4517-9de6-cb8f27ebb979` without forcing or biasing RNG.',
            '- [ ] Test projectile-count/performance limits. — **Status:** ⚪ NOT STARTED': '- [x] Test projectile-count/performance limits. — **Status:** ✅ DONE — WS21 added projectile spawn/active telemetry and a deterministic evaluator; Production performance evidence closed the gate without requiring a gameplay nerf.',
            '- [ ] Test interactions between mechanical cards. — **Status:** ⚪ NOT STARTED': '- [x] Test interactions between mechanical cards. — **Status:** ✅ DONE — WS22 locks high-risk combinations against the canonical 1.50 shared secondary-damage budget with full Quality/Smoke/E2E validation.'
          }
          for old, new in repl.items():
              if old not in s:
                  raise SystemExit('Expected stale master-roadmap text missing: ' + old[:100])
              s = s.replace(old, new)
          checkpoint = '''### 23.1 Balance-roadmap synchronization checkpoint — 2026-09-02

- Combat & Build Balance WS1–WS23 is closed on `main`; WS23 is the final reintegration gate.
- Triple Riveter is naturally Production/D1 validated; its previous gameplay-validation-pending status is obsolete.
- WS17 rarity, WS18 Rig ownership, WS19 Armor semantics, WS20 three-build diversity, WS21 mobile projectile/effect performance, WS22 deterministic interaction matrix and WS23 final U4 balance gate are complete.
- Deferred character work is unchanged: WS14-C–F and WS15-B remain parked and must not be pulled into the next Upgrade System task accidentally.
- The next new Upgrade System development is U3 `Preserve elite reward guarantees`; after U3 closes, return to the remaining genuinely open U4 pool-completion requirement.

---

'''
          marker = '# 24. Definition of Done'
          if '### 23.1 Balance-roadmap synchronization checkpoint — 2026-09-02' not in s:
              if marker not in s:
                  raise SystemExit('Definition-of-Done marker missing')
              s = s.replace(marker, checkpoint + marker)
          p.write_text(s)
      - name: Remove one-shot workflow and commit synchronized master roadmap
        run: |
          rm .github/workflows/sync-upgrade-roadmap-current-state-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UPGRADE_SYSTEM_2_ROADMAP.md .github/workflows/sync-upgrade-roadmap-current-state-once.yml
          git commit -m "Docs: synchronize Upgrade System roadmap after WS23"
          git push
