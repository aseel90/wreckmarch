name: U7 canonical upgrade scene migration

on:
  push:
    branches:
      - u7/canonical-upgrade-scene

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate upgrade scene ownership
        run: |
          set -euo pipefail
          cat > src/upgrades/upgrade-scene.js <<'EOF'
          import { createActiveUpgradeOfferChoices } from './upgrade-offer-pool.js?v=1';
          import { rollUpgradeChoices } from './upgrade-roll-service.js?v=2';

          const CATEGORY_COLORS = {
            HERO: 0xd98446,
            UTILITY: 0x4fc8d8,
            FORTRESS: 0xd4ad62,
            EVOLUTION: 0x9d6be8,
          };

          const colorFor = category => CATEGORY_COLORS[category] || CATEGORY_COLORS.HERO;

          function fitFrame(image, maxWidth, maxHeight) {
            const frameWidth = image.frame?.realWidth || image.width || 1;
            const frameHeight = image.frame?.realHeight || image.height || 1;
            const scale = Math.min(maxWidth / frameWidth, maxHeight / frameHeight);
            image.setDisplaySize(frameWidth * scale, frameHeight * scale);
          }

          export class UpgradeSceneV4 extends Phaser.Scene {
            constructor() { super('UpgradeSceneV4'); }

            init(data) {
              this.payload = data || {};
              this.selectedIndex = 0;
              this.locked = false;
              this.cards = [];
            }

            create() {
              const { gameScene, choices = [], level = 1 } = this.payload;
              this.gameScene = gameScene;
              this.choices = choices;
              const W = this.scale.width;
              const H = this.scale.height;
              this.add.rectangle(W / 2, H / 2, W, H, 0x05080c, .94);
              this.add.text(W / 2, 22, `LEVEL ${level}`, { fontFamily: 'Arial Black,Arial', fontSize: '13px', color: '#55d8e5' }).setOrigin(.5);
              this.add.text(W / 2, 49, 'CHOOSE YOUR UPGRADE', { fontFamily: 'Arial Black,Arial', fontSize: '25px', color: '#f1d09a' }).setOrigin(.5);
              this.add.text(W / 2, 74, 'Build the run. Change the machine.', { fontFamily: 'Arial', fontSize: '11px', color: '#8a96a0' }).setOrigin(.5);
              const margin = Phaser.Math.Clamp(W * .045, 28, 48);
              const gap = Phaser.Math.Clamp(W * .018, 12, 20);
              const cardW = Math.min(308, (W - margin * 2 - gap * 2) / 3);
              const cardH = Math.min(370, H - 114);
              const total = cardW * 3 + gap * 2;
              const start = (W - total) / 2 + cardW / 2;
              choices.forEach((upgrade, index) => this.card(start + index * (cardW + gap), H * .59, cardW, cardH, upgrade, index));
              this.refresh();
              this.input.keyboard?.on('keydown-LEFT', () => this.move(-1));
              this.input.keyboard?.on('keydown-RIGHT', () => this.move(1));
              this.input.keyboard?.on('keydown-ENTER', () => this.choose(this.selectedIndex));
              this.input.keyboard?.on('keydown-ONE', () => this.choose(0));
              this.input.keyboard?.on('keydown-TWO', () => this.choose(1));
              this.input.keyboard?.on('keydown-THREE', () => this.choose(2));
            }

            card(x, y, width, height, upgrade, index) {
              const accent = colorFor(upgrade.category);
              const rarity = Number.isInteger(upgrade.rarityColor) ? upgrade.rarityColor : accent;
              const group = this.add.container(x, y);
              const shadow = this.add.rectangle(7, 9, width, height, 0, .38);
              const bg = this.add.rectangle(0, 0, width, height, 0x151b22, .995).setStrokeStyle(2, rarity, .82);
              const strip = this.add.rectangle(0, -height / 2 + 7, width, 14, accent, .96);
              const category = this.add.text(-width / 2 + 17, -height / 2 + 28, upgrade.category, { fontFamily: 'Arial Black,Arial', fontSize: '10px', color: Phaser.Display.Color.IntegerToColor(accent).rgba }).setOrigin(0, .5);
              const rarityText = this.add.text(width / 2 - 17, -height / 2 + 28, `${upgrade.rarityLabel || upgrade.rarity || 'COMMON'} • ${Math.round((Number(upgrade.rarityPowerMultiplier) || 1) * 100)}% POWER`, { fontFamily: 'Arial Black,Arial', fontSize: '9px', color: Phaser.Display.Color.IntegerToColor(rarity).rgba }).setOrigin(1, .5);
              const artHeight = Math.min(176, height * .43);
              const artY = -height * .18;
              const artBg = this.add.rectangle(0, artY, width - 26, artHeight, 0x0b1015, .72).setStrokeStyle(1.5, rarity, .34);
              const frame = `c5-card-${upgrade.id}`;
              const canUseArt = this.textures.exists('c5-upgrade-sheet') && this.textures.get('c5-upgrade-sheet')?.has?.(frame);
              const art = canUseArt
                ? this.add.image(0, artY, 'c5-upgrade-sheet', frame)
                : this.add.rectangle(0, artY, width - 38, artHeight - 10, 0x10171d, .92);
              if (canUseArt) fitFrame(art, width - 38, artHeight - 10);
              const title = this.add.text(0, height * .08, upgrade.title, { fontFamily: 'Arial Black,Arial', fontSize: `${Math.max(15, Math.min(20, width / 14))}px`, color: '#f2f4f6', align: 'center', wordWrap: { width: width - 30 } }).setOrigin(.5);
              const desc = this.add.text(0, height * .23, upgrade.desc, { fontFamily: 'Arial', fontSize: '12px', color: '#b3bdc6', align: 'center', wordWrap: { width: width - 36 }, lineSpacing: 2 }).setOrigin(.5, 0);
              const currentLevel = this.gameScene?.upgradeLevels?.[upgrade.id] || 0;
              const footer = this.add.text(0, height / 2 - 23, currentLevel ? `CURRENT LV ${currentLevel}` : 'NEW UPGRADE', { fontFamily: 'Arial Black,Arial', fontSize: '9px', color: '#77838d' }).setOrigin(.5);
              const hit = this.add.zone(0, 0, width, height).setInteractive({ useHandCursor: true });
              hit.on('pointerover', () => { this.selectedIndex = index; this.refresh(); });
              hit.on('pointerdown', () => this.choose(index));
              group.add([shadow, bg, strip, category, rarityText, artBg, art, title, desc, footer, hit]);
              this.cards.push({ group, bg, strip, rarity });
            }

            move(delta) {
              if (this.locked || !this.choices.length) return;
              this.selectedIndex = (this.selectedIndex + delta + this.choices.length) % this.choices.length;
              this.refresh();
            }

            refresh() {
              this.cards.forEach((view, index) => {
                const selected = index === this.selectedIndex;
                view.group.setScale(selected ? 1.025 : 1);
                view.bg.setStrokeStyle(selected ? 4 : 2, view.rarity, selected ? 1 : .74);
                view.strip.setAlpha(selected ? 1 : .84);
              });
            }

            choose(index) {
              if (this.locked || !this.choices[index]) return;
              this.locked = true;
              this.choices[index].apply();
              this.cameras.main.flash(70, 75, 198, 215, false);
              this.time.delayedCall(80, () => this.gameScene?.closeUpgradeCards?.());
            }
          }

          export function installUpgradeScene(gameScene) {
            if (!gameScene?.game?.scene) throw new Error('Upgrade scene install requires an active game scene');
            if (!gameScene.game.scene.getScene('UpgradeSceneV4')) {
              gameScene.game.scene.add('UpgradeSceneV4', UpgradeSceneV4, false);
            }
            gameScene.__upgradeSceneOwner = 'src/upgrades/upgrade-scene.js';

            gameScene.openUpgradeCards = function() {
              if (this.upgradeOpen || this.gameOver) return;
              const choices = rollUpgradeChoices(createActiveUpgradeOfferChoices(this), { count: 3 });
              if (!choices.length) return;
              this.upgradeOpen = true;
              this.physics.pause();
              if (this.spawnEvent) this.spawnEvent.paused = true;
              if (this.waveEvent) this.waveEvent.paused = true;
              this.joy.active = false;
              this.joy.id = null;
              this.hero.setVelocity(0, 0);
              this.input.enabled = false;
              document.body.classList.add('wm-upgrade-active');
              this.scene.launch('UpgradeSceneV4', { gameScene: this, choices, level: this.level });
              this.scene.bringToTop('UpgradeSceneV4');
            };

            gameScene.closeUpgradeCards = function() {
              if (!this.upgradeOpen) return;
              document.body.classList.remove('wm-upgrade-active');
              this.scene.stop('UpgradeSceneV4');
              this.upgradeOpen = false;
              this.input.enabled = true;
              if (!this.gameOver) {
                this.physics.resume();
                if (this.spawnEvent) this.spawnEvent.paused = false;
                if (this.waveEvent) this.waveEvent.paused = false;
              }
              this.joyBase.setAlpha(.38);
              this.joyKnob.setAlpha(.4);
              if (this.pendingLevelUps > 0) {
                this.pendingLevelUps -= 1;
                this.time.delayedCall(100, () => this.openUpgradeCards());
              }
            };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              return text.replace(old, new, 1)

          p = Path('src/phase-c1-runtime.js')
          s = p.read_text()
          s = replace_once(s,
              "import { createActiveUpgradeOfferChoices } from './upgrades/upgrade-offer-pool.js?v=1';\nimport { rollUpgradeChoices } from './upgrades/upgrade-roll-service.js?v=2';",
              "import { installUpgradeScene } from './upgrades/upgrade-scene.js?v=1';",
              'C1 imports')
          s = s.replace("const ICON_IDS = [\n  'heavy-rivets', 'overclock', 'long-barrel', 'twin-riveter', 'fleet-feet',\n  'scrap-magnet', 'armor-plate', 'field-repair', 'impact-shield', 'call-rig', 'rig-overdrive', 'twin-cannon'\n];\nconst CATEGORY_COLORS = {\n  HERO: 0xd98446,\n  UTILITY: 0x4fc8d8,\n  FORTRESS: 0xd4ad62,\n  EVOLUTION: 0x9d6be8\n};\n", '')
          start = s.index('function c1UpgradePool(scene) {')
          end = s.index('function refineLandscapeScale(scene) {')
          s = s[:start] + s[end:]
          s = replace_once(s, '  installLandscapeUpgradeScene(scene);', '  installUpgradeScene(scene);', 'C1 install')
          s = s.replace('dedicated UpgradeScene', 'canonical upgrade-scene owner')
          s = s.replace('Phase C.1 active: landscape HUD + 8-way two-hand aim + UpgradeScene cards', 'Phase C.1 active: landscape HUD + 8-way two-hand aim + canonical upgrade scene')
          p.write_text(s)

          p = Path('src/phase-c2-runtime.js')
          s = p.read_text()
          s = s.replace("const ICON_IDS = [\n  'heavy-rivets', 'overclock', 'long-barrel', 'twin-riveter', 'fleet-feet',\n  'scrap-magnet', 'armor-plate', 'call-rig', 'rig-overdrive', 'twin-cannon'\n];\nconst CATEGORY_COLORS = {\n  HERO: 0xd98446,\n  UTILITY: 0x4fc8d8,\n  FORTRESS: 0xd4ad62,\n  EVOLUTION: 0x9d6be8\n};\n", '')
          s = replace_once(s,
              "  if (scene.textures.exists('c2-aim-atlas') && scene.textures.exists('c2-upgrade-art')) return Promise.resolve();",
              "  if (scene.textures.exists('c2-aim-atlas')) return Promise.resolve();",
              'C2 asset guard')
          s = s.replace("    if (!scene.textures.exists('c2-upgrade-art')) scene.load.svg('c2-upgrade-art', './assets/ui/upgrade-art-v2.svg');\n", '')
          start = s.index('function categoryColor(category) {')
          end = s.index('export async function applyPhaseC2() {')
          s = s[:start] + s[end:]
          s = s.replace('  installIllustratedUpgradeScene(scene);\n', '')
          s = s.replace(' + illustrated cards', '')
          s = s.replace(' + illustrated upgrade cards', '')
          p.write_text(s)

          p = Path('src/phase-c3-runtime.js')
          s = p.read_text()
          s = s.replace("const COLORS={HERO:0xd98446,UTILITY:0x4fc8d8,FORTRESS:0xd4ad62,EVOLUTION:0x9d6be8};\n", '')
          start = s.index('class UpgradeSceneV3 extends Phaser.Scene')
          end = s.index('function view(s)')
          s = s[:start] + s[end:]
          s = replace_once(s,
              "cards:!!(s.game.scene.getScene('UpgradeSceneV3')&&FRAMES['icon_heavy-rivets.png']&&FRAMES['icon_call-rig.png'])",
              "cards:!!(s.game.scene.getScene('UpgradeSceneV4')&&!s.game.scene.getScene('UpgradeScene')&&!s.game.scene.getScene('UpgradeSceneV2')&&!s.game.scene.getScene('UpgradeSceneV3')&&FRAMES['icon_heavy-rivets.png']&&FRAMES['icon_call-rig.png'])",
              'C3 self-test')
          s = s.replace('crowd(s);cards(s);view(s);', 'crowd(s);view(s);')
          p.write_text(s)

          p = Path('src/phase-c5-runtime.js')
          s = p.read_text()
          s = s.replace("const COLORS={HERO:0xd98446,UTILITY:0x4fc8d8,FORTRESS:0xd4ad62,EVOLUTION:0x9d6be8};\n", '')
          start = s.index('function fitFrame(im,w,h)')
          end = s.index('async function loadAssets(s)')
          s = s[:start] + s[end:]
          start = s.index('function color(c)')
          end = s.index('function selfTest(s)')
          s = s[:start] + s[end:]
          s = s.replace("await installCharacterPresentationPhase(s,'c5');installCards(s);", "await installCharacterPresentationPhase(s,'c5');")
          p.write_text(s)
          PY

          cat > tests/unit/upgrade-scene-ownership.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const ROOT = resolve(import.meta.dirname, '../..');
          const read = (path: string) => readFileSync(resolve(ROOT, path), 'utf8');

          describe('U7 canonical Upgrade Scene ownership', () => {
            it('keeps scene lifecycle under src/upgrades and retires C1/C2/C3/C5 scene wrappers', () => {
              const canonical = read('src/upgrades/upgrade-scene.js');
              const c1 = read('src/phase-c1-runtime.js');
              const c2 = read('src/phase-c2-runtime.js');
              const c3 = read('src/phase-c3-runtime.js');
              const c5 = read('src/phase-c5-runtime.js');
              const d1 = read('src/phase-d1-runtime.js');

              expect(canonical).toContain("class UpgradeSceneV4 extends Phaser.Scene");
              expect(canonical).toContain("scene.launch('UpgradeSceneV4'");
              expect(canonical).toContain('gameScene.openUpgradeCards = function()');
              expect(canonical).toContain('gameScene.closeUpgradeCards = function()');
              expect(canonical).toContain("gameScene.__upgradeSceneOwner = 'src/upgrades/upgrade-scene.js'");

              expect(c1).toContain("import { installUpgradeScene } from './upgrades/upgrade-scene.js?v=1';");
              expect(c1).toContain('installUpgradeScene(scene);');
              for (const legacy of [c1, c2, c3, c5]) {
                expect(legacy).not.toMatch(/class UpgradeScene(?:V2|V3|V4)? extends Phaser\.Scene/);
                expect(legacy).not.toContain('.launch =');
                expect(legacy).not.toContain('openUpgradeCards = function');
                expect(legacy).not.toContain('closeUpgradeCards = function');
              }
              expect(c2).not.toContain('c2-upgrade-art');
              expect(c3).not.toContain("getScene('UpgradeSceneV3')&&");
              expect(c5).not.toContain('installCards(s)');
              expect(d1).toContain("getScene('UpgradeSceneV4')");
              expect(d1).toContain('installUpgradeCardPresentation');
            });
          });
          EOF

          rm .github/workflows/u7-canonical-upgrade-scene.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/upgrades/upgrade-scene.js src/phase-c1-runtime.js src/phase-c2-runtime.js src/phase-c3-runtime.js src/phase-c5-runtime.js tests/unit/upgrade-scene-ownership.test.ts .github/workflows/u7-canonical-upgrade-scene.yml
          git diff --cached --check
          git commit -m "U7 consolidate upgrade scene ownership"
          git push origin HEAD:u7/canonical-upgrade-scene
