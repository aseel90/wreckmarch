name: Finalize WS14 Deferred Roadmap Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ws14-defer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix roadmap execution status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          road = Path('COMBAT_BUILD_BALANCE_ROADMAP.md')
          text = road.read_text()
          old = "**Workstream 14 is active:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. **Next is WS14-C visual identity.** Do **not** make the Shotgun character selectable, reuse Runner art as a shipping placeholder, or patch a start screen into this stage; selection belongs to WS14-D and live activation to WS14-E."
          new = "**Workstream 14 foundation is parked after WS14-B:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. WS14-C/D/E/F are explicitly **deferred future character scope** recorded above; do not start art generation, make the Shotgun character selectable, reuse Runner art as a shipping placeholder, or patch a start screen until we intentionally return to this workstream."
          if old not in text:
              raise SystemExit('Expected old WS14 execution rule was not found')
          road.write_text(text.replace(old, new))

          gate = Path('WS14_C_CHARACTER_ART_GATE.md').read_text()
          if 'FUTURE / DEFERRED' not in gate or 'DO NOT START' not in gate:
              raise SystemExit('WS14-C art gate is not parked/deferred')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMBAT_BUILD_BALANCE_ROADMAP.md
          git rm .github/workflows/finalize-ws14-defer.yml
          git commit -m 'Park WS14 character work for later'
          git push origin HEAD:main
