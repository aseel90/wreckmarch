name: Apply localized Ricochet roadmap status

on:
  push:
    branches:
      - u4-ricochet-v2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch roadmap status and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('UPGRADE_SYSTEM_2_ROADMAP.md')
          text = path.read_text()
          old = "### Ricochet\nRivets can redirect/bounce to a nearby valid enemy after impact."
          new = "### Ricochet\nRivets can redirect/bounce to a nearby valid enemy after impact.\n\n**Implementation status:** 🔵 IN PROGRESS — PR #109. Canonical `ricochetCount`, Pierce-first/final-impact redirect behavior, duplicate-target prevention, overlap/sweep ordering protection, D1-owned card art and deterministic Chromium coverage are implemented on the feature branch. Production gates are not yet complete; do not mark DONE until merge + exact-SHA Live verification pass."
          if old not in text:
              raise SystemExit('Ricochet anchor not found')
          text = text.replace(old, new, 1)
          old_line = "- [ ] Implement Ricochet. — **Status:** ⚪ NOT STARTED"
          new_line = "- [ ] Implement Ricochet. — **Status:** 🔵 IN PROGRESS — PR #109; implementation exists on `u4-ricochet-v2`, CI/merge/production verification still pending"
          if old_line not in text:
              raise SystemExit('Ricochet checklist line not found')
          text = text.replace(old_line, new_line, 1)
          path.write_text(text)
          PY
          rm .github/workflows/update-u4-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPGRADE_SYSTEM_2_ROADMAP.md .github/workflows/update-u4-roadmap.yml
          git commit -m "Docs: mark Ricochet in progress"
          git push origin HEAD:u4-ricochet-v2
