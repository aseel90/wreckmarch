name: Patch Ricochet roadmap completion

on:
  push:
    branches:
      - docs-u4-ricochet-done

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark Ricochet done and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('UPGRADE_SYSTEM_2_ROADMAP.md')
          text = path.read_text()
          old = "**Implementation status:** 🔵 IN PROGRESS — PR #109. Canonical `ricochetCount`, Pierce-first/final-impact redirect behavior, duplicate-target prevention, overlap/sweep ordering protection, D1-owned card art and deterministic Chromium coverage are implemented on the feature branch. Production gates are not yet complete; do not mark DONE until merge + exact-SHA Live verification pass."
          new = "**Implementation status:** ✅ DONE — PR #109; squash merge `6b499451bb5ff7fc29f184180d420db96fef88c6`. Canonical `ricochetCount`, Pierce-first/final-impact redirect behavior, duplicate-target prevention, overlap/sweep ordering protection, D1-owned card art and deterministic Chromium coverage passed PR gates. Exact-SHA production verification passed via iOS Live + Pages recovery on the merged SHA, with no open Live Chromium or main CI failure remaining."
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Ricochet status anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_line = "- [ ] Implement Ricochet. — **Status:** 🔵 IN PROGRESS — PR #109; implementation exists on `u4-ricochet-v2`, CI/merge/production verification still pending"
          new_line = "- [x] Implement Ricochet. — **Status:** ✅ DONE — PR #109; squash merge `6b499451bb5ff7fc29f184180d420db96fef88c6`; exact-SHA production verification passed"
          if text.count(old_line) != 1:
              raise SystemExit(f'Expected one Ricochet checklist anchor, found {text.count(old_line)}')
          path.write_text(text.replace(old_line, new_line, 1))
          PY
          rm .github/workflows/patch-ricochet-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPGRADE_SYSTEM_2_ROADMAP.md .github/workflows/patch-ricochet-roadmap.yml
          git commit -m "Docs: mark Ricochet DONE in canonical roadmap"
          git push origin HEAD:docs-u4-ricochet-done
