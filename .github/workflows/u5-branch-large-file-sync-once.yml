name: U5 branch large-file sync once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/u5-branch-large-file-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch U5 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin u5-card-frame-hierarchy
          git checkout -B u5-card-frame-hierarchy origin/u5-card-frame-hierarchy
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          pages = '.github/workflows/pages.yml'
          replace_once(pages,
              'curl -fsSL --retry 5 "${BASE}src/phase-d1-runtime.js?v=27" -o wm-live-phase-d1.js',
              'curl -fsSL --retry 5 "${BASE}src/phase-d1-runtime.js?v=28" -o wm-live-phase-d1.js')
          replace_once(pages,
              '          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-card-art.js?v=7" -o wm-live-upgrade-card-art.js\n',
              '          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-card-art.js?v=7" -o wm-live-upgrade-card-art.js\n          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-card-presentation.js?v=1" -o wm-live-upgrade-card-presentation.js\n')
          replace_once(pages,
              'grep -F "./src/phase-d1-runtime.js?v=27" wm-live-index.html',
              'grep -F "./src/phase-d1-runtime.js?v=28" wm-live-index.html')
          replace_once(pages,
              '          grep -F "./upgrades/upgrade-card-art.js?v=7" wm-live-phase-d1.js\n',
              '          grep -F "./upgrades/upgrade-card-presentation.js?v=1" wm-live-phase-d1.js\n          grep -F "./upgrade-card-art.js?v=7" wm-live-upgrade-card-presentation.js\n          grep -F "UPGRADE_CARD_PRESENTATION_VERSION = \'u5-frame-hierarchy-v1\'" wm-live-upgrade-card-presentation.js\n')
          replace_once(pages,
              '            wm-live-phase-d1.js\n            wm-live-character-system.js',
              '            wm-live-phase-d1.js\n            wm-live-upgrade-card-art.js\n            wm-live-upgrade-card-presentation.js\n            wm-live-character-system.js')

          roadmap = 'UPGRADE_SYSTEM_2_ROADMAP.md'
          replace_once(roadmap,
              '- [ ] Audit current card UI. — **Status:** ⚪ NOT STARTED\n- [ ] Finalize rarity frame language. — **Status:** ⚪ NOT STARTED',
              '- [x] Audit current card UI. — **Status:** ✅ DONE — U5 frame-hierarchy pass audited the legacy `UpgradeSceneV4` renderer inside Phase D1 and moved presentation ownership to `src/upgrades/upgrade-card-presentation.js`; gameplay/roll ownership remains untouched.\n- [x] Finalize rarity frame language. — **Status:** ✅ DONE — Common/Rare/Epic/Legendary now use deterministic frame profiles with increasing stroke/glow/accent language while preserving the existing rarity mechanics and weights.')
          replace_once(roadmap,
              '## Phase U5 — Card visual overhaul — **NEXT ACTIVE PHASE**\n- [ ] Improve frames/art hierarchy. — **Status:** ⚪ NOT STARTED',
              '## Phase U5 — Card visual overhaul — **IN PROGRESS / NEXT: RARITY + LEVEL PRESENTATION**\n- [x] Improve frames/art hierarchy. — **Status:** ✅ DONE — canonical card-presentation owner, larger dominant art region, compact metadata, clearer rarity frame accents, and removal of legacy Phase D1 card-renderer ownership; dedicated level presentation/preview/mobile gates remain open.')
          PY
          git diff --check
          git add .github/workflows/pages.yml UPGRADE_SYSTEM_2_ROADMAP.md
          git commit -m "U5: synchronize live card presentation gate and roadmap"
          git push origin HEAD:u5-card-frame-hierarchy
      - name: Remove helper from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/u5-branch-large-file-sync-once.yml
          git add .github/workflows/u5-branch-large-file-sync-once.yml
          git commit -m "CI: remove completed U5 branch sync helper"
          git push origin HEAD:main
