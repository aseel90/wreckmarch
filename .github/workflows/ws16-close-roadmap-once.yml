name: WS16 roadmap close one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ws16-close-roadmap-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close WS16 and self-remove
        shell: python
        run: |
          from pathlib import Path

          p = Path('COMBAT_BUILD_BALANCE_ROADMAP.md')
          s = p.read_text()

          old_row = '| 16 | Wave/difficulty scaling vs player power | ⚪ PENDING BASELINE | Rebalance pressure after player multipliers are corrected; do not hide power creep by blindly inflating HP |'
          new_row = '| 16 | Wave/difficulty scaling vs player power | ✅ COMPLETE / CURRENT CURVE VALIDATED / NO REBALANCE REQUIRED | PR #207 / main `7d35a3239a26be30267d1979057182e39a6e4828` froze the current curve behind deterministic gates without changing gameplay numbers. Final head `3a134e37a34a2e38437264682054feca2b0ce8df` passed Quality, Smoke, all 3 Chromium shards and aggregate E2E; exact merge SHA passed Live verification. Recovery workflow was not applicable because WS16 changed no `index.html`/manifest/runtime shell paths. |'
          if old_row not in s and new_row not in s:
              raise SystemExit('WS16 row anchor missing')
          s = s.replace(old_row, new_row, 1)

          section = '''### Workstream 16 validation — Wave / difficulty scaling vs player power

          - **✅ COMPLETE / NO NUMERIC REBALANCE REQUIRED:** PR #207 merged as `7d35a3239a26be30267d1979057182e39a6e4828`; final PR head `3a134e37a34a2e38437264682054feca2b0ce8df` passed Quality, Smoke, Chromium E2E shards 1–3 and aggregate E2E.
          - RUN-0026 remains the Production reference: Wave 10 Runner Down, 906/929 kills/spawns (~97.5%, below the 98.5% screen-delete red flag), peak active 31/46 (~67.4%, inside preferred 45–70%), final nominal direct power ~3.45x Runner base inside the 2.8–4.25x late envelope.
          - The canonical curve remains deliberately non-HP-spongy: Wave 1→10 HP 1.0x→1.9x, damage 1.0x→1.36x, speed 1.0x→1.09x, while threat budget grows 15→46 and spawn interval falls 720→425 ms. Density/cadence/mixed roles/SURGE remain the primary late-game pressure axes.
          - Exact merge SHA passed GitHub Pages Live verification. `ios-standalone-recovery.yml` did not run by design because it is path-filtered to `index.html`, `manifest.webmanifest`, and its own workflow file; WS16 changed validation docs/tests only.
          - Cross-workstream observations remain parked with their correct owners: peak/average DPS ~3.39 → WS17/WS20; survivability timing → WS19; ~19.13 projectile spawns/s near the 20/s soft cap → WS21.
          - **Next active balance workstream: WS17 — Rarity identity + power scaling.**

          '''.replace('          ', '')
          anchor = '### Workstream 15 staged delivery — Enemy role / range safety\n'
          if section not in s:
              if anchor not in s:
                  raise SystemExit('WS15 section anchor missing')
              s = s.replace(anchor, section + anchor, 1)

          s = s.replace(
              '- **Next active balance workstream: WS16 — Wave/difficulty scaling vs player power.**',
              '- **WS15 handoff:** WS16 is now complete; the current active balance workstream is **WS17 — Rarity identity + power scaling**.',
              1
          )
          s = s.replace(
              '- **Historical checkpoint:** WS13 Canonical Weapon Registry / signature-weapon resolution is complete; the current next active balance workstream is **WS16 — Wave/difficulty scaling vs player power**.',
              '- **Historical checkpoint:** WS13 Canonical Weapon Registry / signature-weapon resolution is complete; WS15-A and WS16 are also complete. The current active balance workstream is **WS17 — Rarity identity + power scaling**.',
              1
          )

          old_exec = '- Workstreams **1–9, 11–13 and WS15-A are complete** under their required gates. Workstream **10 — Triple Riveter / advanced multishot** is implemented and deployed but remains intentionally open for one natural Twin L2 → Triple Production/D1 gameplay validation run; failure to roll it naturally is not treated as a defect and does not block later work. **Workstream 14 foundation is parked after WS14-B:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. WS14-C/D/E/F and WS15-B are explicitly **deferred future character scope**; do not start art generation, make the Shotgun character selectable, reuse Runner art as a shipping placeholder, patch a start screen, or run the short-range matchup gate until we intentionally return to that track. **Current active balance work continues with WS16 — Wave/difficulty scaling vs player power.**'
          new_exec = '- Workstreams **1–9, 11–13, WS15-A and WS16 are complete** under their required gates. Workstream **10 — Triple Riveter / advanced multishot** is implemented and deployed but remains intentionally open for one natural Twin L2 → Triple Production/D1 gameplay validation run; failure to roll it naturally is not treated as a defect and does not block later work. **Workstream 14 foundation is parked after WS14-B:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. WS14-C/D/E/F and WS15-B are explicitly **deferred future character scope**; do not start art generation, make the Shotgun character selectable, reuse Runner art as a shipping placeholder, patch a start screen, or run the short-range matchup gate until we intentionally return to that track. **Current active balance work continues with WS17 — Rarity identity + power scaling.**'
          if old_exec not in s and new_exec not in s:
              raise SystemExit('execution rule anchor missing')
          s = s.replace(old_exec, new_exec, 1)

          p.write_text(s)
          Path('.github/workflows/ws16-close-roadmap-once.yml').unlink()
      - name: Commit final roadmap state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add COMBAT_BUILD_BALANCE_ROADMAP.md .github/workflows/ws16-close-roadmap-once.yml
          git commit -m "Close WS16 in combat balance roadmap"
          git push
