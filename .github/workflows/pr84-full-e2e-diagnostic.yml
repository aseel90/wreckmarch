name: PR84 Full E2E stress diagnostic

on:
  push:
    branches:
      - stabilize-sawbug-self-test

permissions:
  contents: read
  issues: write

jobs:
  full-e2e-stress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full E2E stress and capture outcome
        id: stress
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm exec playwright test --repeat-each=3 --workers=2 2>&1 | tee wm-full-e2e-stress.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.stress.outputs.exit_code }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "$EXIT_CODE" = "0" ]; then outcome="success"; else outcome="failure"; fi
          {
            echo "Full E2E stress diagnostic on \`$SHA\`: **$outcome**"
            echo
            echo '```text'
            tail -c 60000 wm-full-e2e-stress.log
            echo
            echo '```'
          } > diagnostic-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[TEMP PR84] Full E2E stress diagnostic" --body-file diagnostic-body.md
