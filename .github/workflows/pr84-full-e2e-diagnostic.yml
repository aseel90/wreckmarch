name: PR84 Full E2E diagnostic

on:
  push:
    branches:
      - stabilize-sawbug-self-test

permissions:
  contents: read
  issues: write

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-e2e-install.log

      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee wm-e2e-playwright-install.log

      - name: Run full E2E and capture outcome
        id: e2e
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm test:e2e 2>&1 | tee wm-e2e.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "$EXIT_CODE" = "0" ]; then outcome="success"; else outcome="failure"; fi
          {
            echo "Full E2E diagnostic on \`$SHA\`: **$outcome**"
            echo
            for LOG in wm-e2e.log wm-e2e-playwright-install.log wm-e2e-install.log; do
              [ -f "$LOG" ] || continue
              echo "### $LOG"
              echo '```text'
              tail -c 16000 "$LOG"
              echo
              echo '```'
            done
          } > diagnostic-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[TEMP PR84] Full E2E diagnostic" --body-file diagnostic-body.md
