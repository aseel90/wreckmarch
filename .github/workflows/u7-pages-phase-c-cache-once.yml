name: U7 Pages Phase C cache sync once

on:
  push:
    branches: [u7-10min-progression-gate]
    paths: [.github/workflows/u7-pages-phase-c-cache-once.yml]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align and push with diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo '### U7 Pages cache helper diagnostics'
            echo '```text'
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pages.yml')
          text = path.read_text()
          old = 'phase-c-runtime.js?v=22'
          print('old_count=', text.count(old))
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly 2 Phase C v22 live-gate anchors, got {text.count(old)}')
          path.write_text(text.replace(old, 'phase-c-runtime.js?v=23'))
          PY
            echo "python_exit=$?"
            git diff -- .github/workflows/pages.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/pages.yml
            git commit -m 'U7: verify Phase C v23 in deployed asset graph'
            echo "commit_exit=$?"
            git push origin HEAD:u7-10min-progression-gate
            echo "push_exit=$?"
            echo '```'
          } > /tmp/u7-pages-helper.md 2>&1
          cat /tmp/u7-pages-helper.md
          gh pr comment 253 --repo "${{ github.repository }}" --body-file /tmp/u7-pages-helper.md
