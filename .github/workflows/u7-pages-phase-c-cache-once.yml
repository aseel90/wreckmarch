name: U7 Pages Phase C cache sync once

on:
  push:
    branches: [u7-10min-progression-gate]
    paths: [.github/workflows/u7-pages-phase-c-cache-once.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align live asset gate and self-delete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pages.yml')
          text = path.read_text()
          old = 'phase-c-runtime.js?v=22'
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly 2 Phase C v22 live-gate anchors, got {text.count(old)}')
          path.write_text(text.replace(old, 'phase-c-runtime.js?v=23'))
          PY
          rm .github/workflows/u7-pages-phase-c-cache-once.yml
      - name: Commit cache-gate sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml .github/workflows/u7-pages-phase-c-cache-once.yml
          git commit -m 'U7: verify Phase C v23 in deployed asset graph'
          git push origin HEAD:u7-10min-progression-gate
