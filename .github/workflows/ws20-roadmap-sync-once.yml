name: One-shot WS17-20 roadmap sync

on:
  push:
    branches: [main]
    paths:
      - '.ws20-roadmap-sync-trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch roadmaps with exact assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          combat = Path('COMBAT_BUILD_BALANCE_ROADMAP.md')
          t = combat.read_text()
          repls = {
            '| 17 | Rarity identity + power scaling | ⚪ PENDING BASELINE / U7 | Resolve same-card rarity identity and prevent rarity from magnifying already-multiplicative stats excessively |': '| 17 | Rarity identity + power scaling | ✅ COMPLETE / CURRENT MODEL VALIDATED / NO NERF REQUIRED | PR #209 / main `f868f789a40d9c674a0e0e772c5cdbde00b22ab9`. Current Common/Rare/Epic/Legendary multipliers 1.00/1.15/1.30/1.50 remain; per-level scaling and fixed-rarity mechanical budgets are regression-locked. Triple stays fixed Rare but owns its explicit 1.60× volley budget rather than receiving an automatic extra 1.15×. Final head passed Quality, Smoke, all Chromium shards and aggregate E2E; exact merge SHA passed Live verification. |',
            '| 18 | Rig/support damage ownership | ⚪ PENDING | Decouple support balance from ambiguous `primaryWeapon.damage` semantics and future shotgun pellet damage |': '| 18 | Rig/support damage ownership | ✅ COMPLETE / SUPPORT DAMAGE DECOUPLED | PR #214 / main `89596fba6a6d6a1deba45deae1ee5af0a93d4dee`. Fortress Rig now owns a canonical 13.92-damage / 920 ms support profile (~15.13 nominal DPS) independent of hero `primaryWeapon.damage`, Heavy, Twin/Triple or future Shotgun pellet semantics. Quality, Smoke, all Chromium shards, aggregate E2E, exact-SHA Live and Pages recovery passed. |',
            '| 19 | Armor/stat combat semantics + survivability utility | 🟡 FOUNDATION PROD-VALIDATED / BROADER SEMANTICS PENDING | RUN-0026 verified Field Repair + Impact Shield telemetry; canonical armor-mitigation semantics remain future work |': '| 19 | Armor/stat combat semantics + survivability utility | ✅ COMPLETE / ARMOR SEMANTICS DEFINED / CURRENT RUNNER BALANCE UNCHANGED | PR #218 / main `b47b62fc7fa6e094c78709235a09971d5ebe1f01`. Canonical Armor mitigation is `min(0.50, armor / (armor + 100))`, applied after character incoming-damage scaling and before Impact Shield. Armor Plate remains max-HP + recovery only; no current card grants Armor and Runner resolves to 0 Armor, so current production balance is unchanged. Quality, Smoke, all Chromium shards, aggregate E2E, exact-SHA Live and Pages recovery passed. |',
            '| 20 | Build identities + anti-mandatory-card validation | ⚪ PENDING BASELINE | Validate multiple viable builds; no Twin/Heavy/Overclock-style automatic pick should dominate unrelated builds |': '| 20 | Build identities + anti-mandatory-card validation | 🟡 ACTIVE / BASELINE AUDIT NEXT | Validate at least three genuinely distinct viable builds and enforce the PB1 anti-mandatory-card gate; no Twin/Heavy/Overclock-style choice should dominate unrelated archetypes. Start from deterministic build scenarios + Production telemetry before changing card numbers. |',
            '**Next active balance workstream: WS17 — Rarity identity + power scaling.**': '**Next active balance workstream: WS20 — Build identities + anti-mandatory-card validation.**',
            '**WS15 handoff:** WS16 is now complete; the current active balance workstream is **WS17 — Rarity identity + power scaling**.': '**WS15 handoff:** WS16–WS19 are now complete; the current active balance workstream is **WS20 — Build identities + anti-mandatory-card validation**.',
            '**Historical checkpoint:** WS13 Canonical Weapon Registry / signature-weapon resolution is complete; WS15-A and WS16 are also complete. The current active balance workstream is **WS17 — Rarity identity + power scaling**.': '**Historical checkpoint:** WS13 Canonical Weapon Registry / signature-weapon resolution is complete; WS15-A and WS16–WS19 are also complete. The current active balance workstream is **WS20 — Build identities + anti-mandatory-card validation**.',
            'Workstreams **1–9, 11–13, WS15-A and WS16 are complete** under their required gates.': 'Workstreams **1–9, 11–13, WS15-A and WS16–WS19 are complete** under their required gates.',
            '**Current active balance work continues with WS17 — Rarity identity + power scaling.**': '**Current active balance work continues with WS20 — Build identities + anti-mandatory-card validation.**',
          }
          for old, new in repls.items():
              if old not in t:
                  raise SystemExit(f'Missing combat roadmap assertion: {old[:100]}')
              t = t.replace(old, new)

          anchor = '\n### Workstream 15 staged delivery — Enemy role / range safety\n'
          if '### Workstream 17 validation — Rarity identity + power scaling' not in t:
              if anchor not in t:
                  raise SystemExit('Missing WS15 section anchor')
              block = '''
### Workstream 17 validation — Rarity identity + power scaling

- **✅ COMPLETE / NO NERF REQUIRED:** PR #209 merged as `f868f789a40d9c674a0e0e772c5cdbde00b22ab9`.
- Current rarity multipliers remain Common 1.00×, Rare 1.15×, Epic 1.30×, Legendary 1.50×; rarity applies per level rather than multiplying an upgrade's final resolved stat wholesale.
- RUN-0026 provided a high-rarity stress sample and remained inside PB1. Triple Riveter is fixed Rare for identity but keeps its explicit 1.60× mechanical volley budget independent of the rarity power multiplier.
- Final head `53a4020c424f3afb87c57cdfe48324370c9e75a7` passed Quality, Smoke, all Chromium shards and aggregate E2E; exact merge SHA passed Live verification.

### Workstream 18 validation — Rig / support damage ownership

- **✅ COMPLETE / SUPPORT OWNERSHIP DECOUPLED:** PR #214 merged as `89596fba6a6d6a1deba45deae1ee5af0a93d4dee`.
- `src/rig/fortress-rig-profile.js` owns the support budget: 13.92 damage, 920 ms cadence, 1 projectile, 680 speed, 560 range. Hero weapon damage and multishot semantics no longer silently scale support damage.
- The production cache path was explicitly invalidated (`rig-system.js?v=2` → `phase-c4-runtime.js?v=5`) and locked by tests.
- Final tested head `042bee672b3520f2fac48f9eeb582e2f32dbad50` passed Quality, Smoke, all Chromium shards and aggregate E2E; exact merge SHA passed Live verification and Pages recovery.

### Workstream 19 validation — Armor / survivability semantics

- **✅ COMPLETE / CURRENT RUNNER BALANCE UNCHANGED:** PR #218 merged as `b47b62fc7fa6e094c78709235a09971d5ebe1f01`.
- Canonical Armor mitigation is `min(0.50, armor / (armor + 100))`; it applies after character incoming-damage scaling and before Impact Shield absorption.
- Armor Plate remains max HP + bounded recovery, Field Repair remains missing-health recovery, Impact Shield remains bounded hit absorption, and no current card grants Armor. Runner resolves to 0 Armor, so WS19 introduces semantics without a hidden production buff/nerf.
- Final tested head `5745ad0f11ccbb268efd5a4f3566d7df6252145e` passed Quality, Smoke, all Chromium shards and aggregate E2E. Exact merge SHA passed Live verification at 2026-09-02T11:48:14Z and Pages recovery at 11:48:29Z.
- **Handoff:** WS20 now owns build-identity and anti-mandatory-card validation. Do not use WS20 as justification for numeric changes until deterministic build scenarios and Production evidence agree.
'''
              t = t.replace(anchor, block + anchor)
          combat.write_text(t)

          upgrade = Path('UPGRADE_SYSTEM_2_ROADMAP.md')
          u = upgrade.read_text()
          core_anchor = 'Latest verified gameplay commit for the core: `89926f8`.'
          if core_anchor in u:
              u = u.replace(core_anchor, '''Latest verified gameplay commit for the original core migration: `89926f8`.

Recent Combat & Build Balance ownership gates now also verified on Production:

- **WS17 — rarity identity / power scaling:** current Common/Rare/Epic/Legendary multipliers **1.00 / 1.15 / 1.30 / 1.50** are validated and remain unchanged; rarity is per-level and fixed-rarity mechanical budgets such as Triple Riveter stay explicitly owned. Main proof: `f868f789a40d9c674a0e0e772c5cdbde00b22ab9`.
- **WS18 — Rig/support ownership:** Fortress Rig support damage is decoupled from hero `primaryWeapon.damage` and now owns a canonical **13.92 damage / 920 ms** baseline in `src/rig/fortress-rig-profile.js`. Main proof: `89596fba6a6d6a1deba45deae1ee5af0a93d4dee`.
- **WS19 — Armor semantics:** canonical Armor mitigation is now owned by PlayerDamageSystem/rules with diminishing returns and a **50% hard cap**. **Armor Plate remains max HP + recovery only**, no current card grants Armor, and Runner currently resolves to 0 Armor. Main proof: `b47b62fc7fa6e094c78709235a09971d5ebe1f01`.
- All three gates passed their required automated checks; WS18 and WS19 also passed exact-SHA Pages/live delivery gates where their runtime cache paths changed.
''')
          elif 'Recent Combat & Build Balance ownership gates now also verified on Production:' not in u:
              raise SystemExit('Missing Upgrade roadmap core anchor')

          u_repls = {
            '## Phase U4 — New Hunter build cards — **NEXT ACTIVE PHASE**': '## Phase U4 — New Hunter build cards — **ACTIVE CONTENT PHASE / WS20 BUILD-IDENTITY GATE ACTIVE**',
            '- [ ] Verify at least 3 viable build identities. — **Status:** ⚪ NOT STARTED': '- [ ] Verify at least 3 viable build identities. — **Status:** 🟡 WS20 ACTIVE — deterministic build-identity + anti-mandatory-card baseline is the current Combat & Build Balance workstream; do not close until at least three distinct viable archetypes pass deterministic and Production evidence.',
            '- [ ] Rarity/DPS/progression tuning. — **Status:** ⚪ NOT STARTED': '- [ ] Rarity/DPS/progression tuning. — **Status:** 🟡 BASELINE VALIDATED / FINAL U7 STILL OPEN — WS17 validated the current 1.00/1.15/1.30/1.50 rarity model with no nerf required; broader late-run progression tuning remains part of U7.',
          }
          for old, new in u_repls.items():
              if old in u:
                  u = u.replace(old, new)
              elif new not in u:
                  raise SystemExit(f'Missing Upgrade roadmap assertion: {old}')
          upgrade.write_text(u)
          PY
      - name: Verify intended state
        run: |
          grep -F '| 17 | Rarity identity + power scaling | ✅ COMPLETE' COMBAT_BUILD_BALANCE_ROADMAP.md
          grep -F '| 18 | Rig/support damage ownership | ✅ COMPLETE' COMBAT_BUILD_BALANCE_ROADMAP.md
          grep -F '| 19 | Armor/stat combat semantics + survivability utility | ✅ COMPLETE' COMBAT_BUILD_BALANCE_ROADMAP.md
          grep -F '| 20 | Build identities + anti-mandatory-card validation | 🟡 ACTIVE' COMBAT_BUILD_BALANCE_ROADMAP.md
          grep -F 'WS20 BUILD-IDENTITY GATE ACTIVE' UPGRADE_SYSTEM_2_ROADMAP.md
          grep -F 'WS19 — Armor semantics' UPGRADE_SYSTEM_2_ROADMAP.md
      - name: Commit sync and self-delete
        run: |
          rm -f .github/workflows/ws20-roadmap-sync-once.yml .ws20-roadmap-sync-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMBAT_BUILD_BALANCE_ROADMAP.md UPGRADE_SYSTEM_2_ROADMAP.md .github/workflows/ws20-roadmap-sync-once.yml .ws20-roadmap-sync-trigger
          git commit -m 'Sync WS17-19 closure and activate WS20'
          git push origin HEAD:main
