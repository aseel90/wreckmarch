name: Twin Riveter Migration One-Shot

on:
  push:
    branches: [upgrade-system-u2-twin-riveter]
    paths: ['.github/workflows/twin-riveter-migration.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-system-u2-twin-riveter
          fetch-depth: 0
      - name: Apply canonical wiring and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('src/combat/weapon-system.js',
              '    const count = Math.max(1, this.scene.twinShots || 1);',
              "    const mechanicalCount = this.scene.upgradeMechanicalState?.['twin-riveter']?.projectileCount;\n    const count = Math.max(1, mechanicalCount || this.scene.twinShots || 1);")

          replace('src/phase-c-runtime.js',
              "import { createRegisteredStatUpgradeChoice } from './upgrades/upgrade-runtime.js?v=4';",
              "import { createRegisteredStatUpgradeChoice, createRegisteredUpgradeChoice } from './upgrades/upgrade-runtime.js?v=5';")
          replace('src/phase-c-runtime.js',
              "    { id: 'twin-riveter', category: 'HERO', title: 'TWIN RIVETER', desc: 'Fire an extra rivet with slight spread.', weight: .72, available: () => upgradeLevel(scene, 'twin-riveter') < 1, apply: () => { bumpUpgrade(scene, 'twin-riveter'); scene.twinShots = 2; } },",
              "    createRegisteredUpgradeChoice(scene, 'twin-riveter', { category: 'HERO' }),")

          replace('src/phase-c1-runtime.js',
              "import { createRegisteredStatUpgradeChoice } from './upgrades/upgrade-runtime.js?v=4';",
              "import { createRegisteredStatUpgradeChoice, createRegisteredUpgradeChoice } from './upgrades/upgrade-runtime.js?v=5';")
          replace('src/phase-c1-runtime.js',
              "    { id:'twin-riveter', category:'HERO', title:'TWIN RIVETER', desc:'Fire an extra rivet with slight spread.', weight:.72,\n      available:()=>upgradeLevel(scene,'twin-riveter')<2,\n      apply:()=>{ bumpUpgrade(scene,'twin-riveter'); scene.twinShots=Math.min(3,(scene.twinShots||1)+1); } },",
              "    createRegisteredUpgradeChoice(scene, 'twin-riveter', { category: 'HERO' }),")

          replace('index.html', './src/phase-c-runtime.js?v=11', './src/phase-c-runtime.js?v=12')
          replace('index.html', './src/phase-c1-runtime.js?v=6', './src/phase-c1-runtime.js?v=7')

          roadmap = Path('UPGRADE_SYSTEM_2_ROADMAP.md')
          text = roadmap.read_text()
          old = """- [ ] Migrate Long Barrel. — **Status:** 🟡 MERGED / CI RECOVERY + LIVE VERIFY
  - Canonical dual-modifier definition (+18% projectile speed, +10% range), shared Phase C/C1 adapter and unit/final-card E2E coverage were merged to `main` in `d731bad`. Final checkbox remains blocked until the canonical CI E2E gate is stable again and the resulting deployed build clears Live Chromium.
- [ ] Migrate Twin Riveter. — **Status:** ⚪ NOT STARTED"""
          new = """- [x] Migrate Long Barrel. — **Status:** ✅ DONE
  - Verified on `98de52f`: the canonical +18% projectile-speed / +10% range definition from `d731bad` passed the sharded Playwright E2E gate, Quality, Smoke and deployed live verification; CI Issue #83 auto-closed with `quality=success, e2e=success, smoke=success`.
- [ ] Migrate Twin Riveter. — **Status:** 🟡 IMPLEMENTED / PR VERIFY
  - Canonical mechanical-effect definition and shared Phase C/C1 adapter are implemented with final C1 parity (level 1 = 2 rivets, level 2 = 3 rivets). Final checkbox waits for PR sharded E2E, merge and Live Chromium verification."""
          if old not in text: raise SystemExit('roadmap card block mismatch')
          text = text.replace(old, new, 1)
          text = text.replace(
              "  - Current verified gameplay commit: `c9da716` (Quality/E2E/Smoke recovered; deployment produced no `[LIVE] deployed main smoke failed` issue).",
              "  - Current verified gameplay commit: `98de52f` (Quality/E2E/Smoke recovered on main; Live verification passed and CI Issue #83 auto-closed).",
              1)
          pr_items = [
              'Pin Playwright CI execution to one worker per runner.',
              'Split the E2E suite across three GitHub Actions shards.',
              'Keep one stable aggregate check named `E2E` for branch protection and CI consumers.',
              'Use Playwright blob reports per shard and merge them into one HTML diagnostic artifact.',
              'Use `retryStrategy: isolated` with one CI retry.',
              'Fail CI when Playwright classifies a test as flaky; a retry must not silently turn the gate green.',
              'Record traces only on the first retry in CI.',
              'Comment failing shard logs directly on the PR and keep aggregate diagnostics as a second layer.',
              'Remove temporary diagnostic workflows from the canonical path.'
          ]
          for item in pr_items:
              a = f'- [ ] {item} — **Status:** 🟡 IMPLEMENTED / PR VERIFY'
              b = f'- [x] {item} — **Status:** ✅ DONE'
              if a not in text: raise SystemExit(f'roadmap gate mismatch: {item}')
              text = text.replace(a, b, 1)
          a = '- [ ] Verify the new E2E architecture on PR, merge, and confirm `main` + Live Chromium before marking this gate complete. — **Status:** 🟡 IMPLEMENTED / PR + LIVE VERIFY'
          b = '- [x] Verify the new E2E architecture on PR, merge, and confirm `main` + Live Chromium before marking this gate complete. — **Status:** ✅ DONE — verified on `98de52f`; CI Issue #83 auto-closed and live verification passed.'
          if a not in text: raise SystemExit('roadmap live gate mismatch')
          roadmap.write_text(text.replace(a, b, 1))

          policy = Path('TESTING_AND_DEPLOYMENT_POLICY.md')
          text = policy.read_text()
          for item in [
              'Run E2E as three isolated Playwright shards with one worker per runner.',
              'Use isolated retries and fail CI if any test is classified as flaky.',
              'Merge shard blob reports into one canonical Playwright HTML report.',
              'Route shard and aggregate PR failure diagnostics through explicit `pull-requests: write` permission.'
          ]:
              a = f'- [ ] {item} — **Status:** 🟡 IMPLEMENTED / PR VERIFY'
              b = f'- [x] {item} — **Status:** ✅ DONE'
              if a not in text: raise SystemExit(f'policy mismatch: {item}')
              text = text.replace(a, b, 1)
          a = '- [ ] Confirm the sharded E2E gate and Live Chromium gate on `main`. — **Status:** 🟡 IMPLEMENTED / PR + LIVE VERIFY'
          b = '- [x] Confirm the sharded E2E gate and Live Chromium gate on `main`. — **Status:** ✅ DONE — verified on `98de52f`; CI Issue #83 recovered and auto-closed, and live verification passed.'
          if a not in text: raise SystemExit('policy live gate mismatch')
          policy.write_text(text.replace(a, b, 1))

          e2e_b64 = ''
          Path('tests/e2e/upgrade-twin-riveter.spec.ts').write_bytes(base64.b64decode(e2e_b64))
          PY
      - name: Validate migration syntax
        run: |
          node --check src/upgrades/upgrade-mechanical-effects.js
          node --check src/upgrades/definitions/twin-riveter.js
          node --check src/upgrades/upgrade-runtime.js
          node --check src/upgrades/upgrade-catalog.js
          node --check src/combat/weapon-system.js
          node --check src/phase-c-runtime.js
          node --check src/phase-c1-runtime.js
          git diff --check
      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/combat/weapon-system.js src/phase-c-runtime.js src/phase-c1-runtime.js index.html UPGRADE_SYSTEM_2_ROADMAP.md TESTING_AND_DEPLOYMENT_POLICY.md tests/e2e/upgrade-twin-riveter.spec.ts
          git rm .github/workflows/twin-riveter-migration.yml
          git commit -m 'Wire Twin Riveter through canonical upgrade runtime'
          git push origin HEAD:upgrade-system-u2-twin-riveter
