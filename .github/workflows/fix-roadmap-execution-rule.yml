name: Fix deferred WS14 execution rule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-roadmap-execution-rule.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update execution rule and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('COMBAT_BUILD_BALANCE_ROADMAP.md')
          s = p.read_text()
          old = "- Workstreams **1–9 and 11–13 are complete** under their required gates. Workstream **10 — Triple Riveter / advanced multishot** is implemented and deployed but remains intentionally open for one natural Twin L2 → Triple Production/D1 gameplay validation run; failure to roll it naturally is not treated as a defect and does not block later work. **Workstream 14 is active:** WS14-A architecture and WS14-B A1 weapon foundation are complete on `main` (`b2663805f4f4050278f531fc14b2ec92e283e3d7`), with exact-SHA Pages/live verification passed. **Next is WS14-C visual identity.** Do **not** make the Shotgun character selectable, reuse Runner art as a shipping placeholder, or patch a start screen into this stage; selection belongs to WS14-D and live activation to WS14-E."
          new = "- Workstreams **1–9 and 11–13 are complete** under their required gates. Workstream **10 — Triple Riveter / advanced multishot** is implemented and deployed but remains intentionally open only for one natural Twin L2 → Triple Production/D1 gameplay validation run; failure to roll it naturally is not treated as a defect and does not block later work. **Workstream 14 weapon foundation is complete, while WS14-C–F character work is intentionally DEFERRED / NOT NOW by the 2026-09-02 project decision.** Do not make the Shotgun character selectable, reuse Runner art as a shipping placeholder, or start character-selection work until that deferred track is explicitly resumed. Current non-character balance work continues with Workstreams 15–23; WS15 may establish the Runner/enemy baseline now, while its short-range-character half remains deferred until the Shotgun character is activated."
          if old not in s:
              raise SystemExit('expected execution-rule text not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-roadmap-execution-rule.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add COMBAT_BUILD_BALANCE_ROADMAP.md .github/workflows/fix-roadmap-execution-rule.yml
          git commit -m "Align roadmap execution rule with deferred character work"
          git push
