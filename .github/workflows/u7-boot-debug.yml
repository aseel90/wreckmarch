name: Temporary U7 Boot Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: u7-boot-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Vendor Phaser
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
      - name: Capture browser boot state
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >wm-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE' >wm-boot-debug.log 2>&1
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 960, height: 540 } });
          const events = [];
          page.on('console', msg => events.push(`CONSOLE ${msg.type()}: ${msg.text()}`));
          page.on('pageerror', err => events.push(`PAGEERROR: ${err?.stack || err}`));
          page.on('requestfailed', req => events.push(`REQUESTFAILED: ${req.url()} :: ${req.failure()?.errorText || 'unknown'}`));
          page.on('response', res => { if (res.status() >= 400) events.push(`HTTP ${res.status()}: ${res.url()}`); });
          try {
            await page.goto('http://127.0.0.1:4173/?debug=1&autotest=1', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(20000);
            const state = await page.evaluate(() => {
              const game = window.__WM_GAME__ || window.Phaser?.GAMES?.find(Boolean) || window.Phaser?.GAMES?.[0];
              return {
                bodyClass: document.body.className,
                htmlDataset: { ...document.documentElement.dataset },
                flags: Object.fromEntries(Object.entries(window).filter(([k]) => k.startsWith('__WM_PHASE_') || k.includes('SELF_TEST')).map(([k,v]) => [k, typeof v === 'object' ? JSON.stringify(v) : String(v)])),
                sceneKeys: game?.scene?.keys ? Object.keys(game.scene.keys) : [],
                pendingScenes: game?.scene?._pending?.map?.(x => x?.key) || [],
                queueOps: game?.scene?._queue?.map?.(x => x?.op) || [],
                debugText: document.querySelector('#debug')?.textContent || document.querySelector('#debugLog')?.textContent || ''
              };
            });
            console.log('STATE', JSON.stringify(state, null, 2));
          } catch (err) {
            console.log('DRIVER_ERROR', err?.stack || err);
          }
          console.log('EVENTS');
          for (const event of events) console.log(event);
          await browser.close();
          NODE
      - name: Comment diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            printf 'Temporary U7 boot diagnostic.\n\n```text\n'
            tail -c 30000 wm-boot-debug.log || true
            printf '\n```\n'
          } > /tmp/u7-boot.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/u7-boot.md
      - name: Self-delete debug workflow
        if: always()
        run: |
          set -euo pipefail
          git rm .github/workflows/u7-boot-debug.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Remove temporary U7 boot diagnostic'
          git push origin HEAD:${{ github.head_ref }}
