name: Apply Scrap Magnet Migration

on:
  push:
    branches:
      - upgrade-system-u2-scrap-magnet

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-system-u2-scrap-magnet
          fetch-depth: 0
      - name: Apply canonical Scrap Magnet patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/scrap-magnet.patch
          git apply --check /tmp/scrap-magnet.patch
          git apply /tmp/scrap-magnet.patch
          node --check src/upgrades/definitions/scrap-magnet.js
          node --check src/upgrades/upgrade-catalog.js
          node --check src/phase-c-runtime.js
          node --check src/phase-c1-runtime.js
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-scrap-magnet-migration.yml
          git add UPGRADE_SYSTEM_2_ROADMAP.md src tests
          git commit -m "Migrate Scrap Magnet to canonical character stats"
          git push origin HEAD:upgrade-system-u2-scrap-magnet
