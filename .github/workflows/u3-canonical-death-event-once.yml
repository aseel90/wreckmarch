name: U3 canonical enemy death event once

on:
  push:
    branches: [u3-elite-rarity-budget]
    paths:
      - '.github/workflows/u3-canonical-death-event-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace runtime kill wrapper with canonical death event
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/combat/enemy-combat-system.js')
          s = p.read_text()
          old = """    return { dropCount, elite, x, y };
            }
          }"""
          new = """    const death = { dropCount, elite, x, y, enemyId, enemy };
              this.scene.events?.emit?.('wreckmarch:enemy-killed', death);
              return death;
            }
          }"""
          if old not in s:
              raise SystemExit('enemy death return marker missing')
          p.write_text(s.replace(old, new))

          p = Path('src/rewards/u3-elite-reward-runtime.js')
          s = p.read_text()
          old = """function installEliteDeathReward(scene, rewards) {
            const combat = scene.enemyCombatSystem;
            if (!combat || combat.__eliteRewardWrapped) return;
            const previousKill = combat.killEnemy.bind(combat);
            combat.killEnemy = function(enemy) {
              const eligible = Boolean(enemy?.active && enemy.elite && !enemy.__eliteRewardDropped);
              const drop = eligible ? { x: Number(enemy.x) || 0, y: Number(enemy.y) || 0 } : null;
              const result = previousKill(enemy);
              if (result && drop) {
                enemy.__eliteRewardDropped = true;
                rewards.dropCrate(drop);
              }
              return result;
            };
            combat.__eliteRewardWrapped = true;
          }
          """
          new = """function installEliteDeathReward(scene, rewards) {
            if (scene.__eliteDeathRewardListener) return;
            const onEnemyKilled = death => {
              const enemy = death?.enemy;
              if (!death?.elite || !enemy || enemy.__eliteRewardDropped) return;
              enemy.__eliteRewardDropped = true;
              rewards.dropCrate({ x: Number(death.x) || 0, y: Number(death.y) || 0 });
            };
            scene.events?.on?.('wreckmarch:enemy-killed', onEnemyKilled);
            scene.__eliteDeathRewardListener = onEnemyKilled;
            scene.events?.once?.('shutdown', () => {
              scene.events?.off?.('wreckmarch:enemy-killed', onEnemyKilled);
              scene.__eliteDeathRewardListener = null;
            });
          }
          """
          if old not in s:
              raise SystemExit('elite death wrapper marker missing')
          p.write_text(s.replace(old, new))

          replacements = [
            ('src/combat/combat-system.js', "./enemy-combat-system.js?v=8", "./enemy-combat-system.js?v=9"),
            ('src/enemies/enemy-system.js', "../combat/combat-system.js?v=13", "../combat/combat-system.js?v=14"),
            ('index.html', "./src/enemies/enemy-system.js?v=27", "./src/enemies/enemy-system.js?v=28"),
            ('tests/unit/enemy-combat-integration.test.ts', "../combat/combat-system.js?v=13", "../combat/combat-system.js?v=14"),
          ]
          for path, old, new in replacements:
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'cache/test marker missing: {path} {old}')
              p.write_text(s.replace(old, new))

          Path('tests/unit/u3-elite-ownership.test.ts').write_text("""import { describe, expect, it } from 'vitest';
          import fs from 'node:fs';

          const enemyCombat = fs.readFileSync(new URL('../../src/combat/enemy-combat-system.js', import.meta.url), 'utf8');
          const eliteRuntime = fs.readFileSync(new URL('../../src/rewards/u3-elite-reward-runtime.js', import.meta.url), 'utf8');

          describe('U3 Elite reward ownership', () => {
            it('publishes death from canonical combat instead of replacing killEnemy at runtime', () => {
              expect(enemyCombat).toContain("this.scene.events?.emit?.('wreckmarch:enemy-killed', death)");
              expect(eliteRuntime).toContain("scene.events?.on?.('wreckmarch:enemy-killed', onEnemyKilled)");
              expect(eliteRuntime).not.toContain('combat.killEnemy =');
              expect(eliteRuntime).not.toContain('previousKill');
              expect(eliteRuntime).not.toContain('__eliteRewardWrapped');
            });
          });
          """)
      - name: Remove one-shot workflow and commit refactor
        run: |
          rm .github/workflows/u3-canonical-death-event-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/combat/enemy-combat-system.js src/rewards/u3-elite-reward-runtime.js src/combat/combat-system.js src/enemies/enemy-system.js index.html tests/unit/enemy-combat-integration.test.ts tests/unit/u3-elite-ownership.test.ts .github/workflows/u3-canonical-death-event-once.yml
          git commit -m "U3: route Elite rewards through canonical combat death event"
          git push
