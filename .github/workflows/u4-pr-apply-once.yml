name: Apply U4 pool patch on branch push

on:
  push:
    branches: [u4-finalize-hunter-initial-pool]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: u4-finalize-hunter-initial-pool
      - name: Run staged U4 patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f src/upgrades/upgrade-offer-pool.js ]; then
            echo "U4 offer-pool owner already exists; nothing to apply."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/u4-initial-pool-once.yml').read_text()
          start_marker = '      - name: Apply guarded U4 patch\n'
          end_marker = '      - name: Commit U4 pool ownership\n'
          start = source.index(start_marker)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index(end_marker, run)
          Path('/tmp/apply-u4.sh').write_text(textwrap.dedent(source[run:end]))
          PY
          bash /tmp/apply-u4.sh
      - name: Commit U4 implementation to branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -f src/upgrades/upgrade-offer-pool.js ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/upgrades/upgrade-offer-pool.js tests/unit/upgrade-offer-pool.test.ts src/phase-c-runtime.js src/phase-c1-runtime.js index.html .github/workflows/pages.yml tests/unit/weapon-projectile-integration.test.ts tests/unit/telemetry-bridge.test.ts tests/unit/upgrade-roadmap-integrity.test.ts UPGRADE_SYSTEM_2_ROADMAP.md
          git commit -m "U4: finalize canonical 12-card Hunter pool"
          git push origin HEAD:u4-finalize-hunter-initial-pool
