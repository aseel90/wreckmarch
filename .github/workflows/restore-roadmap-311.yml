name: Restore protected roadmap 311

on:
  push:
    branches:
      - fix/311-roadmap-integrity

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore protected roadmap and apply localized U5/U6 status
        run: |
          set -euo pipefail
          git checkout 55499a973f9ecd698254bf7a992c2f9d8f1d6e82 -- UPGRADE_SYSTEM_2_ROADMAP.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UPGRADE_SYSTEM_2_ROADMAP.md')
          s = p.read_text()
          replacements = [
              (
                  'The **architecture/core migration** and U4 Hunter pool/content foundation are complete, but the **full Upgrade System 2.0 roadmap is not complete** because U5 card visual/readability work, U6 player-facing build panel work, and the remaining U7 live-run/rarity/DPS final gates remain open.',
                  'The **architecture/core migration**, U4 Hunter pool/content foundation, U5 card visual/readability work, and U6 player-facing build panel are complete. The **full Upgrade System 2.0 roadmap is not complete** because the remaining U7 live-run/final cleanup gates remain open.'
              ),
              (
                  '## Phase U5 — Card visual overhaul — **NEXT ACTIVE PHASE**\n- [x] Improve frames/art hierarchy. — **Status:** ✅ DONE — canonical card-presentation ownership, rarity frame language and the `ART → NAME → RARITY → LEVEL → DESCRIPTION` hierarchy are unit/Chromium covered and Live-validated.\n- [x] Add rarity and level presentation. — **Status:** ✅ DONE — rarity frame profiles are canonical and cards now show current/next/max level using registry-owned `maxLevel`; no rarity weights, RNG, requirements, offer ordering or upgrade power rules are changed.\n- [ ] Add real before→after previews. — **Status:** ⚪ NOT STARTED\n- [ ] Mobile visual test. — **Status:** ⚪ NOT STARTED\n\n## Phase U6 — Run stats/build panel\n- [x] Expose resolved stats safely. — **Status:** ✅ DONE\n- [ ] Implement read-only build panel. — **Status:** ⚪ NOT STARTED\n- [ ] Verify displayed values against combat. — **Status:** ⚪ NOT STARTED',
                  '## Phase U5 — Card visual overhaul — **NEXT ACTIVE PHASE**\n> **Current state:** ✅ COMPLETE. The protected heading is retained verbatim for roadmap-integrity compatibility.\n- [x] Improve frames/art hierarchy. — **Status:** ✅ DONE — canonical card-presentation ownership, rarity frame language and the `ART → NAME → RARITY → LEVEL → DESCRIPTION` hierarchy are unit/Chromium covered and Live-validated.\n- [x] Add rarity and level presentation. — **Status:** ✅ DONE — rarity frame profiles are canonical and cards now show current/next/max level using registry-owned `maxLevel`; no rarity weights, RNG, requirements, offer ordering or upgrade power rules are changed.\n- [x] Add real before→after previews. — **Status:** ✅ DONE — `upgrade-preview.js` reuses canonical stat/mechanical application paths in detached preview state; commit `eb287c74f04947f2eb724b2776d749e12ac5b6e6` added real before→after values without mutating the live run.\n- [x] Mobile visual test. — **Status:** ✅ DONE — `tests/e2e/upgrade-cards-mobile.spec.ts` validates all active offers at the canonical 844×390 landscape target, including readable before→after presentation and non-overlap; commit `ef0f50097363113dc805ab0ddcf1190e3e0487b7` plus later responsive closeout remained Production-green.\n\n## Phase U6 — Run stats/build panel\n> **Current state:** ✅ COMPLETE on `55499a973f9ecd698254bf7a992c2f9d8f1d6e82`; Quality + E2E + Smoke + Live Chromium passed.\n- [x] Expose resolved stats safely. — **Status:** ✅ DONE\n- [x] Implement read-only build panel. — **Status:** ✅ DONE — Pause now exposes a dedicated `RUN BUILD` panel backed by immutable `createRunBuildSnapshot()` data; the panel does not own or mutate gameplay values.\n- [x] Verify displayed values against combat. — **Status:** ✅ DONE — character/weapon values come from `RunStatState.resolve()` and projectile-count/volley values come from `WeaponSystem.heroVolleyProfile()`; 844×390 E2E asserts displayed HP/damage/projectile-count against the same canonical runtime sources.'
              ),
              (
                  '- [ ] Stats shown to the player match actual combat in the planned build/run-stats UI. — **Status:** 🔵 debug/read-only data exists; player-facing panel remains\n- [ ] The expanded system remains performant and readable on mobile. — **Status:** 🟡 PARTIAL — WS21 Production telemetry validates projectile/effect performance; U5 card visual/readability work and its mobile visual test remain open.',
                  '- [x] Stats shown to the player match actual combat in the planned build/run-stats UI. — **Status:** ✅ U6 VERIFIED — the Pause `RUN BUILD` panel reads `RunStatState.resolve()` plus the live `WeaponSystem.heroVolleyProfile()` and is E2E-checked against the active scene.\n- [x] The expanded system remains performant and readable on mobile. — **Status:** ✅ VERIFIED — WS21 Production telemetry validates projectile/effect performance, U5 covers the three-card 844×390 presentation, and U6 validates the Pause build panel inside the same target mobile landscape viewport.'
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected roadmap block not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/restore-roadmap-311.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UPGRADE_SYSTEM_2_ROADMAP.md .github/workflows/restore-roadmap-311.yml
          git commit -m "Fix #311 roadmap integrity"
          git push origin HEAD:fix/311-roadmap-integrity
