name: U7 progression repair once

on:
  push:
    branches: [u7-10min-progression-gate]
    paths: [.github/workflows/u7-progression-repair-once.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical files and apply U7 progression patch
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/phase-c-runtime.js > src/phase-c-runtime.js
          git show origin/main:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          phase = Path('src/phase-c-runtime.js')
          text = phase.read_text()
          needle = "import { createWeaponRuntimeState } from './combat/weapon-registry.js?v=2';"
          replacement = needle + "\nimport { getScrapXpNeeded } from './balance/progression-balance.js?v=1';"
          if needle not in text:
              raise SystemExit('phase-c import anchor missing')
          text = text.replace(needle, replacement, 1)
          old = """function xpNeeded(level) {
            const l = Math.max(1, level);
            return 6 + (l - 1) * 4 + Math.floor(Math.pow(l - 1, 1.18));
          }

          """
          if old not in text:
              raise SystemExit('xpNeeded block missing')
          text = text.replace(old, '', 1)
          text = text.replace('scene.scrapNeeded = xpNeeded(scene.level);', 'scene.scrapNeeded = getScrapXpNeeded(scene.level);')
          text = text.replace('this.scrapNeeded = xpNeeded(this.level);', 'this.scrapNeeded = getScrapXpNeeded(this.level);')
          phase.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          if './src/phase-c-runtime.js?v=22' not in html:
              raise SystemExit('index phase-c cache anchor missing')
          index.write_text(html.replace('./src/phase-c-runtime.js?v=22', './src/phase-c-runtime.js?v=23', 1))
          PY
          rm .github/workflows/u7-progression-repair-once.yml
      - name: Commit repaired branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/phase-c-runtime.js index.html .github/workflows/u7-progression-repair-once.yml
          git commit -m 'U7: wire canonical progression curve into live runtime'
          git push origin HEAD:u7-10min-progression-gate
