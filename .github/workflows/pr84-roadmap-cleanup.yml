name: PR84 Roadmap Cleanup

on:
  push:
    branches:
      - stabilize-sawbug-self-test

permissions:
  contents: write

jobs:
  clean-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore main roadmap and apply intended updates
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- UPGRADE_SYSTEM_2_ROADMAP.md
          python -c "from pathlib import Path; import base64; p=Path('UPGRADE_SYSTEM_2_ROADMAP.md'); t=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); sec=base64.b64decode('').decode(); marker='# 22. Cleanup / architecture debt pass'; assert old in t, 'Long Barrel block not found'; assert marker in t, 'section 22 marker not found'; p.write_text(t.replace(old,new,1).replace(marker,sec+marker,1))"
      - name: Commit cleaned roadmap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPGRADE_SYSTEM_2_ROADMAP.md
          if git diff --cached --quiet; then
            echo 'No roadmap changes needed.'
            exit 0
          fi
          git commit -m 'Clean roadmap for sharded E2E gate'
          git push origin HEAD:stabilize-sawbug-self-test
