name: WS14 temporary branch autopatch

on:
  push:
    branches: [workstream-14-volley-profile-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ws14-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workstream-14-volley-profile-foundation
          fetch-depth: 0
      - name: Apply exact non-workflow fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/combat/weapon-system.js')
          s = p.read_text()
          needle = "    const fireProfile = scene.primaryWeapon?.fireProfile || scene.weaponDefinition?.fireProfile || {};\n"
          insert = """    const mirroredTwinCount = Math.max(1, Math.floor(Number(scene.twinShots) || 1));
              if (mirroredTwinCount > 1) {
                const projectileCount = mirroredTwinCount === 2 ? 2 : 3;
                const halfSpreadRadians = projectileCount === 2 ? this.heroProfile.twinSpread2 : this.heroProfile.twinSpread3;
                const projectileDamageScale = this.heroProfile.multiShotDamageScale;
                return Object.freeze({
                  source: 'upgrade-mirror',
                  projectileCount,
                  halfSpreadRadians,
                  volleyDamageMultiplier: projectileDamageScale * projectileCount,
                  projectileDamageScale,
                  spreads: Object.freeze(buildSymmetricSpreadOffsets(projectileCount, halfSpreadRadians))
                });
              }

              const fireProfile = scene.primaryWeapon?.fireProfile || scene.weaponDefinition?.fireProfile || {};
          """
          if "source: 'upgrade-mirror'" not in s:
              if needle not in s: raise SystemExit('WeaponSystem insertion point missing')
              s = s.replace(needle, insert, 1)
          p.write_text(s)

          p = Path('tests/unit/upgrade-card-art.test.ts')
          s = p.read_text().replace('./src/phase-d1-runtime.js?v=26', './src/phase-d1-runtime.js?v=27')
          p.write_text(s)

          p = Path('tests/e2e/upgrade-cards.spec.ts')
          s = p.read_text()
          old = """  for (const card of result.cards) {
              const expectedTexture = card.id === 'piercing-rivets'
                ? 'upgrade-icon-piercing-rivets'
                : card.id === 'ricochet'
                  ? 'upgrade-icon-ricochet'
                  : card.id === 'shrapnel-impact'
                    ? 'upgrade-icon-shrapnel-impact'
                    : card.id === 'critical-rivet'
                      ? 'upgrade-icon-critical-rivet'
                      : card.id === 'field-repair'
                        ? 'upgrade-icon-field-repair'
                        : card.id === 'impact-shield'
                          ? 'upgrade-icon-impact-shield'
                          : 'c3-atlas';
          """
          new = """  const customTextures: Record<string, string> = {
              'piercing-rivets': 'upgrade-icon-piercing-rivets',
              ricochet: 'upgrade-icon-ricochet',
              'shrapnel-impact': 'upgrade-icon-shrapnel-impact',
              'critical-rivet': 'upgrade-icon-critical-rivet',
              'field-repair': 'upgrade-icon-field-repair',
              'impact-shield': 'upgrade-icon-impact-shield',
              'explosive-rivet': 'upgrade-icon-explosive-rivet',
              'triple-riveter': 'upgrade-icon-triple-riveter'
            };
            for (const card of result.cards) {
              const expectedTexture = customTextures[card.id] || 'c3-atlas';
          """
          if 'const customTextures:' not in s:
              if old not in s: raise SystemExit('Upgrade card E2E mapping block missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit branch patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/combat/weapon-system.js tests/unit/upgrade-card-art.test.ts tests/e2e/upgrade-cards.spec.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m '[ws14-autopatch] Preserve Twin fallback and fix tests'
          git push origin HEAD:workstream-14-volley-profile-foundation
