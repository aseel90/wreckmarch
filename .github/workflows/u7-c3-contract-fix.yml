name: Apply U7 C3 Contract Fix

on:
  push:
    branches: [u7/canonical-upgrade-scene]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: u7/canonical-upgrade-scene
          fetch-depth: 0
      - name: Replace obsolete C3 registry coupling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/phase-c3-runtime.js')
          text = p.read_text()
          old = "cards:!!(s.game.scene.getScene('UpgradeSceneV4')&&!s.game.scene.getScene('UpgradeScene')&&!s.game.scene.getScene('UpgradeSceneV2')&&!s.game.scene.getScene('UpgradeSceneV3')&&FRAMES['icon_heavy-rivets.png']&&FRAMES['icon_call-rig.png'])"
          new = "cards:!!(s.__upgradeSceneOwner==='src/upgrades/upgrade-scene.js'&&typeof s.openUpgradeCards==='function'&&typeof s.closeUpgradeCards==='function'&&FRAMES['icon_heavy-rivets.png']&&FRAMES['icon_call-rig.png'])"
          if old not in text:
              raise SystemExit('expected C3 registry assertion not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Update ownership regression assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/upgrade-scene-ownership.test.ts')
          text = p.read_text()
          needle = "    expect(c3).not.toContain(\"const v3=s.game.scene.getScene('UpgradeSceneV3')\");\n"
          replacement = needle + "    expect(c3).toContain(\"s.__upgradeSceneOwner==='src/upgrades/upgrade-scene.js'\");\n"
          if needle not in text:
              raise SystemExit('expected ownership assertion anchor not found')
          p.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Restore normal smoke timeout and remove helper workflow
        run: |
          git show origin/main:scripts/ci-smoke.mjs > scripts/ci-smoke.mjs
          git rm .github/workflows/u7-c3-contract-fix.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/phase-c3-runtime.js tests/unit/upgrade-scene-ownership.test.ts scripts/ci-smoke.mjs .github/workflows/u7-c3-contract-fix.yml
          git commit -m 'Decouple C3 self-test from Upgrade Scene registry timing'
          git push origin HEAD:u7/canonical-upgrade-scene
