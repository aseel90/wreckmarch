name: Test and Deploy Wreckmarch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-quality-install.log
      - name: Typecheck, unit tests and static build
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee wm-quality-check.log
      - name: Comment quality diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Quality checks failed.'
            echo
            for LOG in wm-quality-check.log wm-quality-install.log; do
              [ -f "$LOG" ] || continue
              echo "### $LOG"
              echo '```text'
              tail -c 12000 "$LOG"
              echo
              echo '```'
            done
          } > /tmp/wm-quality-comment.md
          gh issue comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/wm-quality-comment.md
      - name: Preserve quality diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality
          if-no-files-found: ignore
          path: |
            wm-quality-check.log
            wm-quality-install.log

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-e2e-install.log
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee wm-e2e-playwright-install.log
      - name: Run Playwright tests
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee wm-e2e.log
      - name: Comment Playwright diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Playwright E2E failed.'
            echo
            for LOG in wm-e2e.log wm-e2e-playwright-install.log wm-e2e-install.log; do
              [ -f "$LOG" ] || continue
              echo "### $LOG"
              echo '```text'
              tail -c 12000 "$LOG"
              echo
              echo '```'
            done
          } > /tmp/wm-e2e-comment.md
          gh issue comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/wm-e2e-comment.md
      - name: Preserve Playwright diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e
          if-no-files-found: ignore
          path: |
            wm-e2e.log
            wm-e2e-install.log
            wm-e2e-playwright-install.log
            test-results/**
            playwright-report/**

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install smoke dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-smoke-install.log
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee wm-smoke-playwright-install.log
      - name: Vendor Phaser locally
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
      - name: Browser smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >wm-http.log 2>&1 &
          HTTP_PID=$!
          cleanup() { kill "$HTTP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 40s node scripts/ci-smoke.mjs 2>&1 | tee wm-smoke.log
      - name: Preserve smoke diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke
          if-no-files-found: ignore
          path: |
            wm-smoke.log
            wm-smoke-install.log
            wm-smoke-playwright-install.log
            wm-http.log

  ci-bridge:
    name: CI issue bridge
    needs: [quality, e2e, smoke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download quality diagnostics
        if: needs.quality.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-quality
          path: /tmp/ci-quality
      - name: Download E2E diagnostics
        if: needs.e2e.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-e2e
          path: /tmp/ci-e2e
      - name: Download smoke diagnostics
        if: needs.smoke.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-smoke
          path: /tmp/ci-smoke
      - name: Bridge main CI state to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          TITLE='[CI] main is failing'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[CI] main is failing") | .number' | head -n1)"
          if [ "$QUALITY" = success ] && [ "$E2E" = success ] && [ "$SMOKE" = success ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "CI recovered on \`$SHA\`: quality=$QUALITY, e2e=$E2E, smoke=$SMOKE."
            fi
            exit 0
          fi
          {
            echo "CI failed on \`$SHA\`."
            echo
            printf -- '- quality: **%s**\n- e2e: **%s**\n- smoke: **%s**\n\n' "$QUALITY" "$E2E" "$SMOKE"
            echo "Run: $RUN_URL"
            echo
            if [ "$QUALITY" = failure ]; then
              for LOG in /tmp/ci-quality/wm-quality-check.log /tmp/ci-quality/wm-quality-install.log; do
                [ -f "$LOG" ] || continue
                echo "### $(basename "$LOG")"
                echo '```text'
                tail -c 10000 "$LOG"
                echo
                echo '```'
                echo
              done
            fi
            if [ "$E2E" = failure ]; then
              for LOG in /tmp/ci-e2e/wm-e2e.log /tmp/ci-e2e/wm-e2e-playwright-install.log; do
                [ -f "$LOG" ] || continue
                echo "### $(basename "$LOG")"
                echo '```text'
                tail -c 10000 "$LOG"
                echo
                echo '```'
                echo
              done
            fi
            if [ "$SMOKE" = failure ]; then
              for LOG in /tmp/ci-smoke/wm-smoke.log /tmp/ci-smoke/wm-smoke-playwright-install.log /tmp/ci-smoke/wm-http.log; do
                [ -f "$LOG" ] || continue
                echo "### $(basename "$LOG")"
                echo '```text'
                tail -c 10000 "$LOG"
                echo
                echo '```'
                echo
              done
            fi
          } > /tmp/wm-ci-issue.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/wm-ci-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/wm-ci-issue.md --label ci-failure
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: [quality, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare artifact
        run: |
          rm -rf .git node_modules .vite dist test-results playwright-report
          rm -f wm-*.log
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    name: Live Chromium smoke
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install smoke dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-live-install.log
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee wm-live-playwright-install.log
      - name: Run live browser smoke
        env:
          WM_SMOKE_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -o pipefail
          PAGE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?autotest=1&debug=1"
          echo "LIVE_URL=$PAGE_URL" | tee wm-live-url.log
          WM_SMOKE_URL="$PAGE_URL" timeout 45s node scripts/ci-smoke.mjs 2>&1 | tee wm-live-smoke.log
      - name: Preserve live smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke
          if-no-files-found: ignore
          path: |
            wm-live-url.log
            wm-live-smoke.log
            wm-live-install.log
            wm-live-playwright-install.log
      - name: Open, update, or close live failure issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          LIVE_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='[LIVE] deployed main smoke failed'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[LIVE] deployed main smoke failed") | .number' | head -n1)"
          if [ "$LIVE_RESULT" = success ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Live Chromium smoke recovered on \`$SHA\`: $PAGE_URL"
            fi
            exit 0
          fi
          {
            echo "Live Chromium smoke failed on deployed \`$SHA\`."
            echo
            echo "URL: $PAGE_URL"
            echo "Run: $RUN_URL"
            echo
            for LOG in wm-live-smoke.log wm-live-playwright-install.log; do
              [ -f "$LOG" ] || continue
              echo "### $LOG"
              echo '```text'
              tail -c 12000 "$LOG"
              echo
              echo '```'
              echo
            done
          } > /tmp/wm-live-issue.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/wm-live-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/wm-live-issue.md --label ci-failure
          fi
