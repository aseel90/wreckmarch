name: Test and Deploy Wreckmarch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee wm-quality-install.log
      - name: Typecheck, unit tests and static build
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee wm-quality-check.log
      - name: Comment quality diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Quality checks failed.'
            echo
            for LOG in wm-quality-check.log wm-quality-install.log; do
              [ -f "$LOG" ] || continue
              echo "### $LOG"
              echo '```text'
              tail -c 12000 "$LOG"
              echo
              echo '```'
            done
          } > /tmp/wm-quality-comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/wm-quality-comment.md
      - name: Preserve quality diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality
          if-no-files-found: ignore
          path: |
            wm-quality-check.log
            wm-quality-install.log

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee wm-e2e-install.log
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee wm-e2e-playwright-install.log
      - name: Run Playwright tests
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee wm-e2e.log
      - name: Comment Playwright diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Playwright E2E failed.'
            echo
            for LOG in wm-e2e.log wm-e2e-playwright-install.log wm-e2e-install.log; do
              [ -f "$LOG" ] || continue
              echo "### $LOG"
              echo '```text'
              tail -c 12000 "$LOG"
              echo
              echo '```'
            done
          } > /tmp/wm-e2e-comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/wm-e2e-comment.md
      - name: Preserve Playwright diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e
          if-no-files-found: ignore
          path: |
            wm-e2e.log
            wm-e2e-install.log
            wm-e2e-playwright-install.log
            test-results/**
            playwright-report/**

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vendor Phaser locally
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
      - name: Browser smoke test
        run: |
          set -uo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 >wm-xvfb.log 2>&1 &
          XVFB_PID=$!
          python3 -m http.server 4173 --bind 127.0.0.1 >wm-http.log 2>&1 &
          HTTP_PID=$!
          cleanup() { kill "$HTTP_PID" "$XVFB_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          set +e
          timeout 35s google-chrome --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1280,720 --enable-logging=stderr --v=0 'http://127.0.0.1:4173/?autotest=1&debug=1' >wm-chrome.log 2>&1
          CHROME_STATUS=$?
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          text = Path('wm-chrome.log').read_text(errors='ignore') if Path('wm-chrome.log').exists() else ''
          markers = {
              'visual': 'Current visual stack revealed',
              'phase_e1': 'Phase E.1 clean road renderer active',
              'rat': 'Production Scrap Rat locked after final runtime',
              'terrain': 'E1 persistence test PASSED',
          }
          missing = [name for name, marker in markers.items() if marker not in text]
          fatal = []
          for line in text.splitlines():
              if '[WRECKMARCH] ERROR:' in line or 'LOAD FAILED' in line:
                  fatal.append(line)
          Path('wm-smoke.log').write_text(
              'markers=' + repr(markers) + '\nmissing=' + repr(missing) + '\nfatal=' + repr(fatal[-20:]) + '\n'
          )
          if missing or fatal:
              print(Path('wm-smoke.log').read_text())
              sys.exit(1)
          print('Browser smoke passed:', ', '.join(markers))
          PY
      - name: Preserve smoke diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke
          if-no-files-found: ignore
          path: |
            wm-smoke.log
            wm-chrome.log
            wm-http.log
            wm-xvfb.log

  ci-bridge:
    name: CI issue bridge
    needs: [quality, e2e, smoke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download quality diagnostics
        if: needs.quality.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-quality
          path: /tmp/ci-quality
      - name: Download E2E diagnostics
        if: needs.e2e.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-e2e
          path: /tmp/ci-e2e
      - name: Download smoke diagnostics
        if: needs.smoke.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-smoke
          path: /tmp/ci-smoke
      - name: Bridge main CI state to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          TITLE='[CI] main is failing'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[CI] main is failing") | .number' | head -n1)"
          if [ "$QUALITY" = success ] && [ "$E2E" = success ] && [ "$SMOKE" = success ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "CI recovered on \`$SHA\`: quality=$QUALITY, e2e=$E2E, smoke=$SMOKE."
            fi
            exit 0
          fi
          {
            printf 'CI failed on `%s`.\n\n' "$SHA"
            printf -- '- quality: **%s**\n- e2e: **%s**\n- smoke: **%s**\n\n' "$QUALITY" "$E2E" "$SMOKE"
            printf 'Run: https://github.com/%s/actions/runs/%s\n\n' "$REPO" "${{ github.run_id }}"
            if [ "$QUALITY" = failure ]; then
              for LOG in /tmp/ci-quality/wm-quality-check.log /tmp/ci-quality/wm-quality-install.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
            if [ "$E2E" = failure ]; then
              for LOG in /tmp/ci-e2e/wm-e2e.log /tmp/ci-e2e/wm-e2e-playwright-install.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
            if [ "$SMOKE" = failure ]; then
              for LOG in /tmp/ci-smoke/wm-smoke.log /tmp/ci-smoke/wm-chrome.log /tmp/ci-smoke/wm-http.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
          } > /tmp/wm-ci-issue.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/wm-ci-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/wm-ci-issue.md --label ci-failure
          fi

  deploy:
    name: Deploy GitHub Pages
    # Publish after the fast correctness gates. E2E still runs and is reported by ci-bridge,
    # but a superseded/cancelled Playwright run must not leave Pages serving stale PWA metadata.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp index.html style.css manifest.webmanifest _site/
          cp -R src _site/src
          cp -R assets _site/assets
          mkdir -p _site/vendor
          if [ -f vendor/phaser.min.js ]; then cp vendor/phaser.min.js _site/vendor/phaser.min.js; else curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o _site/vendor/phaser.min.js; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
