name: Test and Deploy Wreckmarch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: package.json
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --prefer-offline --no-frozen-lockfile 2>&1 | tee /tmp/wm-quality-install.log
      - name: Typecheck, unit tests and static build
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/wm-quality-check.log
      - name: Comment quality diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = []
          for title, path in [
              ('pnpm install', '/tmp/wm-quality-install.log'),
              ('typecheck / unit / build', '/tmp/wm-quality-check.log'),
          ]:
              p = Path(path)
              if p.exists():
                  sections.append(f'### {title}\n```text\n{p.read_text(errors="ignore")[-6000:]}\n```')
          Path('/tmp/wm-quality-diagnostic.md').write_text('## Quality diagnostic\n\n' + '\n\n'.join(sections))
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/wm-quality-diagnostic.md
      - name: Preserve quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality
          path: |
            /tmp/wm-quality-install.log
            /tmp/wm-quality-check.log
          if-no-files-found: ignore
          retention-days: 2

  e2e:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: package.json
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --prefer-offline --no-frozen-lockfile 2>&1 | tee /tmp/wm-e2e-install.log
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee /tmp/wm-e2e-playwright-install.log
      - name: Run Playwright tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee /tmp/wm-e2e.log
      - name: Comment Playwright diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = []
          for title, path in [
              ('pnpm install', '/tmp/wm-e2e-install.log'),
              ('Playwright install', '/tmp/wm-e2e-playwright-install.log'),
              ('Playwright E2E', '/tmp/wm-e2e.log'),
          ]:
              p = Path(path)
              if p.exists():
                  sections.append(f'### {title}\n```text\n{p.read_text(errors="ignore")[-6000:]}\n```')
          Path('/tmp/wm-e2e-diagnostic.md').write_text('## Playwright diagnostic\n\n' + '\n\n'.join(sections))
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/wm-e2e-diagnostic.md
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e
          path: |
            /tmp/wm-e2e-install.log
            /tmp/wm-e2e-playwright-install.log
            /tmp/wm-e2e.log
          if-no-files-found: ignore
          retention-days: 2

  smoke:
    name: Production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor Phaser locally
        shell: bash
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 --connect-timeout 10 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js \
            || curl -fsSL --retry 3 --connect-timeout 10 https://unpkg.com/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
          test -s vendor/phaser.min.js

      - name: Browser smoke test
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/wm-smoke.log) 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found on runner"
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=15000 \
            --dump-dom \
            "http://127.0.0.1:4173/?debug=1&autotest=1" \
            >/tmp/wm-dom.html 2>/tmp/wm-chrome.log

          check_log () {
            if ! grep -q "$1" /tmp/wm-dom.html; then
              echo "Browser test failed: $2"
              cat /tmp/wm-chrome.log
              cat /tmp/wm-dom.html
              exit 1
            fi
          }

          # Smoke checks are intentionally based on durable DOM/runtime state, not copy text.
          # Phase log wording changes often during polish and should not block a valid build.
          check_log '<canvas' 'Phaser canvas was not created'
          check_log 'data-wreckmarch-visual-ready="current"' 'final visual stack did not become ready'
          check_log 'data-wreckmarch-c3-self-test="passed"' 'Phase C.3 DOM self-test flag missing'
          check_log 'data-wreckmarch-c31-self-test="passed"' 'Phase C.3.1 DOM self-test flag missing'
          check_log 'data-wreckmarch-c4-self-test="passed"' 'Phase C.4 DOM self-test flag missing'
          check_log 'data-wreckmarch-c5-self-test="passed"' 'Phase C.5 DOM self-test flag missing'
          check_log 'data-wreckmarch-d1-self-test="passed"' 'Phase D.1 DOM self-test flag missing'
          check_log 'data-wreckmarch-phase-e0="active"' 'Phase E.0 fast terrain bootstrap flag missing'
          check_log 'data-wreckmarch-phase-e1="active"' 'Phase E.1 final asphalt layer DOM flag missing'
          check_log 'data-wreckmarch-e1-self-test="passed"' 'Phase E.1 road persistence self-test did not pass'
          check_log 'data-wreckmarch-enemy-foundation="active"' 'enemy foundation DOM flag missing'

          if grep -qE '<body[^>]*class="[^"]*boot-error' /tmp/wm-dom.html; then
            echo "Browser test failed: runtime error marker detected"
            cat /tmp/wm-chrome.log
            cat /tmp/wm-dom.html
            exit 1
          fi

          test -s /tmp/wm-dom.html
          cp /tmp/wm-dom.html /tmp/wm-smoke-dom.html
      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke
          path: |
            /tmp/wm-smoke.log
            /tmp/wm-http.log
            /tmp/wm-chrome.log
            /tmp/wm-smoke-dom.html
          if-no-files-found: ignore
          retention-days: 2

  ci_bridge:
    name: CI failure bridge
    needs: [quality, e2e, smoke]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Download quality diagnostics
        if: needs.quality.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-quality
          path: /tmp/ci-quality

      - name: Bridge main CI state to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          SMOKE: ${{ needs.smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[CI] main is failing'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[CI] main is failing") | .number' | head -n1)"

          if [ "$QUALITY" = 'success' ] && [ "$E2E" = 'success' ] && [ "$SMOKE" = 'success' ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "CI recovered on \`$SHA\`: quality=$QUALITY, e2e=$E2E, smoke=$SMOKE."
            fi
            exit 0
          fi

          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          {
            printf 'CI failed on `%s`.\n\n' "$SHA"
            printf -- '- quality: **%s**\n- e2e: **%s**\n- smoke: **%s**\n\n' "$QUALITY" "$E2E" "$SMOKE"
            printf 'Run: %s\n' "$RUN_URL"

            if [ "$QUALITY" != 'success' ]; then
              for LOG in /tmp/ci-quality/wm-quality-check.log /tmp/ci-quality/wm-quality-install.log; do
                if [ -s "$LOG" ]; then
                  printf '\n### %s\n```text\n' "$(basename "$LOG")"
                  tail -n 80 "$LOG"
                  printf '\n```\n'
                fi
              done
            fi
          } > /tmp/wm-ci-issue.md

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/wm-ci-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/wm-ci-issue.md --label ci-failure
          fi

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -R src _site/src
          cp -R assets _site/assets
          mkdir -p _site/vendor
          if [ -f vendor/phaser.min.js ]; then cp vendor/phaser.min.js _site/vendor/phaser.min.js; else curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o _site/vendor/phaser.min.js; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
