name: Test and Deploy Wreckmarch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --prefer-offline --no-frozen-lockfile 2>&1 | tee /tmp/wm-quality-install.log
      - name: Typecheck, unit tests and static build
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/wm-quality-check.log
      - name: Comment quality diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          sections=[]
          for title,path in [
              ('pnpm install', '/tmp/wm-quality-install.log'),
              ('typecheck / unit / build', '/tmp/wm-quality-check.log'),
          ]:
              p=Path(path)
              if p.exists():
                  text=p.read_text(errors='replace')[-12000:]
                  sections.append(f'### {title}\n```text\n{text}\n```')
          Path('/tmp/wm-quality-diagnostic.md').write_text('## Quality diagnostic\n\n' + '\n\n'.join(sections))
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/wm-quality-diagnostic.md
      - name: Preserve quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality
          path: |
            /tmp/wm-quality-install.log
            /tmp/wm-quality-check.log
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --prefer-offline --no-frozen-lockfile 2>&1 | tee /tmp/wm-e2e-install.log
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee /tmp/wm-e2e-playwright-install.log
      - name: Run Playwright tests
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee /tmp/wm-e2e.log
      - name: Comment Playwright diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          sections=[]
          for title,path in [
              ('pnpm install', '/tmp/wm-e2e-install.log'),
              ('Playwright install', '/tmp/wm-e2e-playwright-install.log'),
              ('Playwright E2E', '/tmp/wm-e2e.log'),
          ]:
              p=Path(path)
              if p.exists():
                  text=p.read_text(errors='replace')[-12000:]
                  sections.append(f'### {title}\n```text\n{text}\n```')
          Path('/tmp/wm-e2e-diagnostic.md').write_text('## Playwright diagnostic\n\n' + '\n\n'.join(sections))
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/wm-e2e-diagnostic.md
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e
          path: |
            /tmp/wm-e2e-install.log
            /tmp/wm-e2e-playwright-install.log
            /tmp/wm-e2e.log
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Production browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vendor Phaser locally
        run: |
          set -o pipefail
          mkdir -p vendor
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
      - name: Browser smoke test
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/wm-smoke.log) 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wm-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID >/dev/null 2>&1 || true; kill ${CHROME_PID:-} >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .25
          done
          CHROME="$(command -v chromium-browser || command -v chromium || command -v google-chrome || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome executable found" >&2
            exit 1
          fi
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/wm-chrome-profile \
            'http://127.0.0.1:4173/?autotest=1' >/tmp/wm-chrome.log 2>&1 &
          CHROME_PID=$!
          for i in $(seq 1 80); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break
            sleep .25
          done
          TARGET="$(curl -fsS http://127.0.0.1:9222/json | python3 -c "import json,sys; pages=json.load(sys.stdin); print(next(p['webSocketDebuggerUrl'] for p in pages if p.get('type')=='page'))")"
          python3 - "$TARGET" <<'PY'
          import asyncio, json, sys, urllib.request
          target=sys.argv[1]
          import websockets
          async def main():
              async with websockets.connect(target, max_size=16*1024*1024) as ws:
                  seq=0
                  async def call(method, params=None):
                      nonlocal seq
                      seq+=1
                      ident=seq
                      await ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
                      while True:
                          msg=json.loads(await ws.recv())
                          if msg.get('id')==ident:
                              return msg
                  await call('Runtime.enable')
                  await asyncio.sleep(14)
                  expr="""JSON.stringify({
                    ready:document.documentElement.dataset.wreckmarchVisualReady,
                    e1:document.documentElement.dataset.wreckmarchE1SelfTest,
                    persist:document.documentElement.dataset.wreckmarchE1Persistence,
                    hound:document.documentElement.dataset.wreckmarchRustHoundVisual,
                    rat:document.documentElement.dataset.wreckmarchScrapRatVisual,
                    body:document.body.className,
                    log:(window.__WM_E1_ROAD_WATCH__||null),
                    errors:Array.from(document.querySelectorAll('#log')).map(x=>x.textContent).join('\\n')
                  })"""
                  res=await call('Runtime.evaluate',{'expression':expr,'returnByValue':True})
                  value=res.get('result',{}).get('result',{}).get('value','{}')
                  print(value)
                  data=json.loads(value)
                  ok=(data.get('ready')=='current' and data.get('e1')=='passed' and data.get('persist')=='passed')
                  if not ok:
                      raise SystemExit('Smoke self-test failed: '+json.dumps(data))
                  dom=await call('Runtime.evaluate',{'expression':'document.documentElement.outerHTML','returnByValue':True})
                  open('/tmp/wm-dom.html','w').write(dom.get('result',{}).get('result',{}).get('value',''))
          asyncio.run(main())
          PY
          cp /tmp/wm-dom.html /tmp/wm-smoke-dom.html
      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke
          path: |
            /tmp/wm-smoke.log
            /tmp/wm-chrome.log
            /tmp/wm-http.log
            /tmp/wm-smoke-dom.html
          if-no-files-found: ignore
          retention-days: 7

  ci-bridge:
    name: CI failure bridge
    needs: [quality, e2e, smoke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - name: Download quality diagnostics
        if: needs.quality.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-quality
          path: /tmp/ci-quality
      - name: Download E2E diagnostics
        if: needs.e2e.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-e2e
          path: /tmp/ci-e2e
      - name: Download smoke diagnostics
        if: needs.smoke.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ci-smoke
          path: /tmp/ci-smoke
      - name: Bridge main CI state to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          TITLE='[CI] main is failing'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[CI] main is failing") | .number' | head -n1)"
          if [ "$QUALITY" = success ] && [ "$E2E" = success ] && [ "$SMOKE" = success ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "CI recovered on \`$SHA\`: quality=$QUALITY, e2e=$E2E, smoke=$SMOKE."
            fi
            exit 0
          fi
          {
            printf 'CI failed on `%s`.\n\n' "$SHA"
            printf -- '- quality: **%s**\n- e2e: **%s**\n- smoke: **%s**\n\n' "$QUALITY" "$E2E" "$SMOKE"
            printf 'Run: https://github.com/%s/actions/runs/%s\n\n' "$REPO" "${{ github.run_id }}"
            if [ "$QUALITY" = failure ]; then
              for LOG in /tmp/ci-quality/wm-quality-check.log /tmp/ci-quality/wm-quality-install.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
            if [ "$E2E" = failure ]; then
              for LOG in /tmp/ci-e2e/wm-e2e.log /tmp/ci-e2e/wm-e2e-playwright-install.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
            if [ "$SMOKE" = failure ]; then
              for LOG in /tmp/ci-smoke/wm-smoke.log /tmp/ci-smoke/wm-chrome.log /tmp/ci-smoke/wm-http.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
          } > /tmp/wm-ci-issue.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/wm-ci-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/wm-ci-issue.md --label ci-failure
          fi

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp index.html style.css manifest.webmanifest _site/
          cp -R src _site/src
          cp -R assets _site/assets
          mkdir -p _site/vendor
          if [ -f vendor/phaser.min.js ]; then cp vendor/phaser.min.js _site/vendor/phaser.min.js; else curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o _site/vendor/phaser.min.js; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
