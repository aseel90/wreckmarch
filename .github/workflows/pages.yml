      - name: Open, update, or close live failure issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          OUTCOME: ${{ steps.live_smoke.outcome }}
        run: |
          set -euo pipefail
          TITLE='[LIVE] deployed main smoke failed'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[LIVE] deployed main smoke failed") | .number' | head -n1)"
          if [ "$OUTCOME" = success ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Live Chromium smoke recovered on \`$SHA\`: $PAGE_URL"
            fi
            exit 0
          fi
          {
            printf 'Live Chromium smoke failed after GitHub Pages deployed `%s`.\n\n' "$SHA"
            printf 'Live URL: %s\n' "$PAGE_URL"
            printf 'Run: https://github.com/%s/actions/runs/%s\n\n' "$REPO" "${{ github.run_id }}"
            printf 'The smoke gate treats these browser signals as failures:\n'
            printf -- '- console.error\n- pageerror\n- requestfailed\n- boot/playability assertion timeout\n- stale deployed asset graph\n- missing SEND REPORT control in wmTelemetry mode\n\n'
            if [ -f wm-live-smoke.log ]; then
              printf '### wm-live-smoke.log\n```text\n'
              tail -c 16000 wm-live-smoke.log
              printf '\n```\n'
            fi
          } > /tmp/wm-live-issue.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/wm-live-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/wm-live-issue.md --label ci-failure
          fi
          exit 1
