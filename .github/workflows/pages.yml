name: Bootstrap clean U7 migration

on:
  push:
    branches: [u7/canonical-upgrade-scene-clean]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy final U7 files and self-restore workflows
        run: |
          set -euo pipefail
          git fetch origin u7/canonical-upgrade-scene main
          git checkout origin/u7/canonical-upgrade-scene -- \
            src/phase-c1-runtime.js \
            src/phase-c2-runtime.js \
            src/phase-c3-runtime.js \
            src/phase-c5-runtime.js \
            src/upgrades/upgrade-scene.js \
            tests/unit/armor-plate-upgrade.test.ts \
            tests/unit/survivability-upgrades.test.ts \
            tests/unit/upgrade-scene-ownership.test.ts \
            tests/unit/upgrade-system-u0-baseline.test.ts \
            tests/unit/weapon-projectile-integration.test.ts
          git show origin/main:.github/workflows/pages.yml > .github/workflows/pages.yml
          rm -f .github/workflows/u7-clean-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml .github/workflows/u7-clean-copy.yml src tests
          git commit -m "Consolidate Upgrade Scene ownership"
          git push origin HEAD:u7/canonical-upgrade-scene-clean
