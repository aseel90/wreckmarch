name: Test and Deploy Wreckmarch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: package.json
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --prefer-offline --no-frozen-lockfile 2>&1 | tee /tmp/wm-quality-install.log
      - name: Typecheck, unit tests and static build
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/wm-quality-check.log
      - name: Comment quality diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = []
          for title, path in [
              ('pnpm install', '/tmp/wm-quality-install.log'),
              ('typecheck / unit / build', '/tmp/wm-quality-check.log'),
          ]:
              p = Path(path)
              if p.exists():
                  sections.append(f'### {title}\n```text\n{p.read_text(errors="ignore")[-6000:]}\n```')
          Path('/tmp/wm-quality-diagnostic.md').write_text('## Quality diagnostic\n\n' + '\n\n'.join(sections))
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/wm-quality-diagnostic.md
      - name: Preserve quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality
          path: |
            /tmp/wm-quality-install.log
            /tmp/wm-quality-check.log
          if-no-files-found: ignore
          retention-days: 2

  e2e:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: package.json
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --prefer-offline --no-frozen-lockfile 2>&1 | tee /tmp/wm-e2e-install.log
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee /tmp/wm-e2e-playwright-install.log
      - name: Run Playwright tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee /tmp/wm-e2e.log
      - name: Comment Playwright diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = []
          for title, path in [
              ('pnpm install', '/tmp/wm-e2e-install.log'),
              ('Playwright install', '/tmp/wm-e2e-playwright-install.log'),
              ('Playwright E2E', '/tmp/wm-e2e.log'),
          ]:
              p = Path(path)
              if p.exists():
                  sections.append(f'### {title}\n```text\n{p.read_text(errors="ignore")[-6000:]}\n```')
          Path('/tmp/wm-e2e-diagnostic.md').write_text('## Playwright diagnostic\n\n' + '\n\n'.join(sections))
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/wm-e2e-diagnostic.md
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e
          path: |
            /tmp/wm-e2e-install.log
            /tmp/wm-e2e-playwright-install.log
            /tmp/wm-e2e.log
          if-no-files-found: ignore
          retention-days: 2

  smoke:
    name: Production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor Phaser locally
        shell: bash
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 --connect-timeout 10 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js \
            || curl -fsSL --retry 3 --connect-timeout 10 https://unpkg.com/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
          test -s vendor/phaser.min.js

      - name: Browser smoke test
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found on runner"
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=15000 \
            --dump-dom \
            "http://127.0.0.1:4173/?debug=1&autotest=1" \
            >/tmp/wm-dom.html 2>/tmp/wm-chrome.log

          check_log () {
            if ! grep -q "$1" /tmp/wm-dom.html; then
              echo "Browser test failed: $2"
              cat /tmp/wm-chrome.log
              cat /tmp/wm-dom.html
              exit 1
            fi
          }

          check_log '<canvas' 'Phaser canvas was not created'
          check_log 'Art pack v2 applied' 'production art pack was not applied'
          check_log 'Phase B applied: 2200x2200 world + tuned movement + visible Rivet Gun' 'Phase B large-world runtime was not applied'
          check_log 'Phase B.1 polish active: hand-anchored Rivet Gun + asset-based wasteland' 'Phase B.1 visual polish was not applied'
          check_log 'Phase C active: weapon rig + scaled combat + swept hitboxes + Scrap cards + optional Rig' 'Phase C core loop was not applied'
          check_log 'Phase C.1 active: landscape HUD + 8-way two-hand aim + UpgradeScene cards' 'Phase C.1 landscape UX was not applied'
          check_log 'Phase C.2 active: adaptive viewport + dimensional weapon poses + illustrated upgrade cards' 'Phase C.2 responsive visual foundation was not applied'
          check_log 'Phase C.3 active: exclusive PNG art + smooth Rig motion + rotating wheels + crowd separation' 'Phase C.3 art/motion polish was not applied'
          check_log 'C3 browser self-test PASSED: atlas=ok weapon=ok rigParts=ok cards=ok wrecks=ok crowd=ok rigMotion=ok wheels=ok' 'Phase C.3 behavior self-test did not pass'
          check_log 'data-wreckmarch-c3-self-test="passed"' 'Phase C.3 DOM self-test flag missing'
          check_log 'Phase C.3.1 visual frame fix active: real atlas frames + full-size weapon/rig/card art' 'Phase C.3.1 frame fix was not applied'
          check_log 'C3.1 visual browser test PASSED: frame=ok gun=ok rig=ok wheels=ok cardArt=ok cards=ok' 'Phase C.3.1 rendered-size self-test did not pass'
          check_log 'data-wreckmarch-c31-self-test="passed"' 'Phase C.3.1 DOM self-test flag missing'
          check_log 'Phase C.4 active: permanent weapon sockets + spring Rig follow + PNG terrain roads' 'Phase C.4 sockets/Rig/terrain runtime was not applied'
          check_log 'C4 browser self-test PASSED: sockets=ok noThirdHand=ok ground=ok roads=ok noAngularRoadGraphics=ok rigSpring=ok wheels=ok' 'Phase C.4 rendered behavior test did not pass'
          check_log 'data-wreckmarch-c4-self-test="passed"' 'Phase C.4 DOM self-test flag missing'
          check_log 'Phase C.5 active: aim-facing hero body + 2x vector upgrade art + visible road network' 'Phase C.5 body/card/terrain runtime was not applied'
          check_log 'C5 browser self-test PASSED: bodyAim=ok noThirdHand=ok cardArtVectorHD=ok roadNetwork=ok roadsVisible=ok groundVisible=ok' 'Phase C.5 browser visual/behavior self-test did not pass'
          check_log 'data-wreckmarch-c5-self-test="passed"' 'Phase C.5 DOM self-test flag missing'
          check_log 'Phase D.1 active: animated Runner + integrated mechanical arm + premium PNG card art + visible asphalt + real vehicle scale' 'Phase D.1 world/player rebuild was not applied'
          check_log 'D1 browser self-test PASSED: animatedLegs=ok mechanicalArm=ok noHandSprites=ok premiumCards=ok roadsVisible=ok vehicleScale=ok' 'Phase D.1 browser visual/behavior self-test did not pass'
          check_log 'data-wreckmarch-d1-self-test="passed"' 'Phase D.1 DOM self-test flag missing'
          check_log 'data-wreckmarch-phase-e0="active"' 'Phase E.0 fast terrain bootstrap flag missing'
          check_log 'FAST TERRAIN ready in' 'Phase E.0 fast terrain did not report readiness'
          check_log 'Phase E.1b active: persistent asphalt layer' 'Phase E.1 final asphalt layer was not applied'
          check_log 'E1 browser self-test PASSED: roadSegments=ok roadAtSpawn=ok noLegacyCover=ok groundBelowRoad=ok roadAboveGround=ok' 'Phase E.1 browser road test did not pass'
          check_log 'data-wreckmarch-e1-self-test="passed"' 'Phase E.1 browser road test DOM flag missing'
          check_log 'E1 persistence test PASSED at 12s' 'Phase E.1 asphalt did not remain valid for 12 seconds'
          check_log 'data-wreckmarch-e1-persistence="passed"' 'Phase E.1 persistence DOM flag missing'

          if grep -Eq '<body[^>]*class="[^"]*boot-error' /tmp/wm-dom.html; then
            echo "Browser test failed: boot loader reported an error"
            cat /tmp/wm-chrome.log
            cat /tmp/wm-dom.html
            exit 1
          fi

          echo "Wreckmarch E1c production-baseline browser test passed"

      - name: Comment browser diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, re
          dom = Path('/tmp/wm-dom.html').read_text(errors='ignore') if Path('/tmp/wm-dom.html').exists() else ''
          chrome = Path('/tmp/wm-chrome.log').read_text(errors='ignore') if Path('/tmp/wm-chrome.log').exists() else ''
          m = re.search(r'<pre id="debug-panel"[^>]*>(.*?)</pre>', dom, re.S)
          debug = html.unescape(re.sub('<[^>]+>', '', m.group(1))).strip() if m else 'debug panel not found'
          body = '### Browser smoke diagnostic\n\n```text\n' + debug[-5000:] + '\n```\n\nChrome tail:\n```text\n' + chrome[-2500:] + '\n```\n'
          Path('/tmp/wm-diagnostic.md').write_text(body)
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/wm-diagnostic.md
      - name: Preserve browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke
          path: |
            /tmp/wm-http.log
            /tmp/wm-dom.html
            /tmp/wm-chrome.log
          if-no-files-found: ignore
          retention-days: 2

  ci_bridge:
    name: CI failure bridge
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, e2e, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
    steps:
      - name: Download CI diagnostics
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-*
          path: /tmp/wm-ci-logs
          merge-multiple: true
      - name: Create or resolve CI failure issue
        shell: bash
        run: |
          set -euo pipefail

          TITLE='[CI] main is failing'
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          gh label create ci-failure \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description 'Automated Wreckmarch CI failure tracker' \
            --force >/dev/null

          ISSUE_NUMBER="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label ci-failure \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" \
            | head -n 1)"

          FAILED=()
          [ "$QUALITY_RESULT" = 'failure' ] && FAILED+=('quality')
          [ "$E2E_RESULT" = 'failure' ] && FAILED+=('e2e')
          [ "$SMOKE_RESULT" = 'failure' ] && FAILED+=('smoke')

          if [ ${#FAILED[@]} -gt 0 ]; then
            FAILED_LIST="$(IFS=', '; echo "${FAILED[*]}")"
            python3 - <<'PY'
          from pathlib import Path
          import html, re

          root = Path('/tmp/wm-ci-logs')
          sections = []

          def tail(title, filename, limit=3500):
              p = root / filename
              if not p.exists():
                  return
              text = p.read_text(errors='ignore').strip()
              if text:
                  sections.append(f'### {title}\n```text\n{text[-limit:]}\n```')

          tail('Quality: typecheck / unit / build', 'wm-quality-check.log', 4500)
          tail('Quality: dependency install', 'wm-quality-install.log', 2200)
          tail('Playwright E2E', 'wm-e2e.log', 4500)
          tail('Playwright browser install', 'wm-e2e-playwright-install.log', 2200)
          tail('Playwright dependency install', 'wm-e2e-install.log', 1800)

          dom_path = root / 'wm-dom.html'
          if dom_path.exists():
              dom = dom_path.read_text(errors='ignore')
              m = re.search(r'<pre id="debug-panel"[^>]*>(.*?)</pre>', dom, re.S)
              if m:
                  debug = html.unescape(re.sub('<[^>]+>', '', m.group(1))).strip()
                  if debug:
                      sections.append(f'### Smoke: game debug panel\n```text\n{debug[-4500:]}\n```')
          tail('Smoke: Chrome stderr', 'wm-chrome.log', 3000)
          tail('Smoke: HTTP server', 'wm-http.log', 1500)

          Path('/tmp/wm-ci-diagnostics.md').write_text('\n\n'.join(sections))
          PY
            cat > /tmp/wm-ci-failure.md <<EOF
          ## Wreckmarch CI failure

          **Failed jobs:** ${FAILED_LIST}

          | Job | Result |
          | --- | --- |
          | quality | ${QUALITY_RESULT} |
          | e2e | ${E2E_RESULT} |
          | smoke | ${SMOKE_RESULT} |

          - Commit: [\`${GITHUB_SHA:0:7}\`](${COMMIT_URL})
          - Workflow run: [open diagnostics](${RUN_URL})
          - Trigger: \`${GITHUB_EVENT_NAME}\`

          This issue is managed automatically by GitHub Actions. A later successful run on \`main\` will close it.
          EOF

            if [ -s /tmp/wm-ci-diagnostics.md ]; then
              printf '\n\n## Diagnostic excerpts\n\n' >> /tmp/wm-ci-failure.md
              cat /tmp/wm-ci-diagnostics.md >> /tmp/wm-ci-failure.md
            fi

            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue comment "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file /tmp/wm-ci-failure.md
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" \
                --label ci-failure \
                --body-file /tmp/wm-ci-failure.md
            fi
            exit 0
          fi

          if [ "$QUALITY_RESULT" = 'success' ] && [ "$E2E_RESULT" = 'success' ] && [ "$SMOKE_RESULT" = 'success' ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "CI recovered on commit ${GITHUB_SHA:0:7}. All quality, e2e and smoke checks passed. Run: ${RUN_URL}"
            fi
          fi

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [quality, e2e, smoke]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Vendor Phaser locally
        shell: bash
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 --connect-timeout 10 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js \
            || curl -fsSL --retry 3 --connect-timeout 10 https://unpkg.com/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
          test -s vendor/phaser.min.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
