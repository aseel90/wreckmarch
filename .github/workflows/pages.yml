name: Pages CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke
        env:
          WM_SMOKE_URL: http://127.0.0.1:4173/?autotest=1&debug=1&wmTelemetry=1
        run: |
          pnpm dev --host 127.0.0.1 > /tmp/wm-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          node scripts/ci-smoke.mjs

  e2e-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E shard ${{ matrix.shard }}/3
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3 --reporter=blob
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge reports
        run: |
          if ls all-blob-reports/*.zip >/dev/null 2>&1; then
            pnpm exec playwright merge-reports --reporter=line all-blob-reports
          else
            echo "No blob reports found"
            exit 1
          fi

  ci-issue-bridge:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, smoke, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Open, update, or close CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          QUALITY: ${{ needs.quality.result }}
          SMOKE: ${{ needs.smoke.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          TITLE='[CI] main quality/smoke/e2e failed'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[CI] main quality/smoke/e2e failed") | .number' | head -n1)"
          if [ "$QUALITY" = success ] && [ "$SMOKE" = success ] && [ "$E2E" = success ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Main recovered on \`$SHA\`: quality=$QUALITY smoke=$SMOKE e2e=$E2E"
            fi
            exit 0
          fi
          BODY="Main CI failed on \`$SHA\`.

          - Quality: $QUALITY
          - Smoke: $SMOKE
          - E2E: $E2E
          - Run: https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label ci-failure
          fi
          exit 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, smoke, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp index.html style.css manifest.webmanifest _site/
          cp -R assets src vendor _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile 2>&1 | tee wm-live-install.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium 2>&1 | tee wm-live-playwright-install.log
      - name: Wait for Pages deployment to settle
        run: sleep 15
      - name: Fetch deployed cache graph
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}/"
          curl -fsSL --retry 5 "${BASE}index.html?live=${{ github.sha }}" -o wm-live-index.html
          curl -fsSL --retry 5 "${BASE}src/mobile-hud-polish.js?asset=canonical-hud-20260903-responsive-v2" -o wm-live-mobile-hud.js
          curl -fsSL --retry 5 "${BASE}src/mobile-hud-loader-canonical-v2.js" -o wm-live-mobile-hud-loader.js
          curl -fsSL --retry 5 "${BASE}src/telemetry/telemetry-runtime.js?v=9&wreckerHealth=1&wreckerIdentity=1" -o wm-live-telemetry-runtime.js
          curl -fsSL --retry 5 "${BASE}src/telemetry/run-telemetry.js?v=7&wreckerHealth=1&wreckerIdentity=1" -o wm-live-run-telemetry.js
          curl -fsSL --retry 5 "${BASE}src/enemies/enemy-system.js?v=29&wreckerHealth=1" -o wm-live-enemy-system.js
          curl -fsSL --retry 5 "${BASE}src/phase-b-runtime.js?v=7" -o wm-live-phase-b.js
          curl -fsSL --retry 5 "${BASE}src/phase-c-runtime.js?v=10&u7=1" -o wm-live-phase-c.js
          curl -fsSL --retry 5 "${BASE}src/phase-c1-runtime.js?v=18&u7=2" -o wm-live-phase-c1.js
          curl -fsSL --retry 5 "${BASE}src/phase-c5-runtime.js?v=13&wrecker=11" -o wm-live-phase-c5.js
          curl -fsSL --retry 5 "${BASE}src/phase-d1-runtime.js?v=30&u5=3&wrecker=11" -o wm-live-phase-d1.js
          curl -fsSL --retry 5 "${BASE}src/phase-e1-runtime.js?v=20" -o wm-live-phase-e1.js
          curl -fsSL --retry 5 "${BASE}src/characters/character-runtime-presentation.js?v=11&wrecker=11" -o wm-live-character-runtime-presentation.js
          curl -fsSL --retry 5 "${BASE}src/characters/character-registry.js?v=4&wrecker=2" -o wm-live-character-registry.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-production-presentation.js?v=9&wrecker=10" -o wm-live-shotgun-production-presentation.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-runtime-presentation.js?v=7" -o wm-live-shotgun-runtime-presentation.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-aim-alignment.js?v=5" -o wm-live-shotgun-aim-alignment.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-production-art.js?v=4" -o wm-live-shotgun-production-art.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-art-contract.js?v=3" -o wm-live-shotgun-art-contract.js
          curl -fsSL --retry 5 "${BASE}assets/hero/shotgun-weapon.svg" -o wm-live-shotgun-weapon.svg
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-locomotion-art.js?v=4" -o wm-live-shotgun-locomotion-art.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-baked-locomotion.js?v=3" -o wm-live-shotgun-baked-locomotion.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-hand-overlay-bake.js?v=2" -o wm-live-shotgun-hand-overlay-bake.js
          curl -fsSL --retry 5 "${BASE}src/characters/runner-production-presentation.js?v=1" -o wm-live-runner-production-presentation.js
          curl -fsSL --retry 5 "${BASE}src/characters/character-system.js?v=7&wreckerHealth=1" -o wm-live-character-system.js
          curl -fsSL --retry 5 "${BASE}src/combat/weapon-registry.js?v=2" -o wm-live-weapon-registry.js
          curl -fsSL --retry 5 "${BASE}src/combat/weapon-system.js?v=8" -o wm-live-weapon-system.js
          curl -fsSL --retry 5 "${BASE}src/combat/definitions/rivet-gun.js?v=2" -o wm-live-rivet-gun.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-scene.js?v=2" -o wm-live-upgrade-scene.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-offer-pool.js?v=2" -o wm-live-upgrade-offer-pool.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-roll-service.js?v=2" -o wm-live-upgrade-roll-service.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-card-art.js?v=7" -o wm-live-upgrade-card-art.js
          curl -fsSL --retry 5 "${BASE}src/final-polish-runtime.js?v=2" -o wm-live-final-polish.js
          curl -fsSL --retry 5 "${BASE}src/ui/game-shell.js?v=15&wrecker=2" -o wm-live-game-shell.js

          grep -F "./src/phase-b-runtime.js?v=7" wm-live-index.html
          grep -F "./src/phase-c-runtime.js?v=10&u7=1" wm-live-index.html
          grep -F "./src/phase-c1-runtime.js?v=18&u7=2" wm-live-index.html
          grep -F "./src/phase-c5-runtime.js?v=13&wrecker=11" wm-live-index.html
          grep -F "./src/phase-d1-runtime.js?v=30&u5=3&wrecker=11" wm-live-index.html
          grep -F "./src/phase-e1-runtime.js?v=20" wm-live-index.html
          grep -F "./characters/character-runtime-presentation.js?v=11&wrecker=11" wm-live-phase-c5.js
          grep -F "./characters/character-runtime-presentation.js?v=11&wrecker=11" wm-live-phase-d1.js
          grep -F "./shotgun-production-presentation.js?v=9&wrecker=10" wm-live-character-runtime-presentation.js
          grep -F "./shotgun-runtime-presentation.js?v=7" wm-live-shotgun-production-presentation.js
          grep -F "__shotgunTwoHandHold" wm-live-shotgun-production-presentation.js
          grep -F "two-hand-fixed" wm-live-shotgun-production-presentation.js
          grep -F "runtimeRotation === false" wm-live-shotgun-production-presentation.js
          grep -F "setRotation(pose.weaponRotation)" wm-live-shotgun-production-presentation.js
          grep -F "body-weapon-front-hands" wm-live-shotgun-production-presentation.js
          grep -F "__shotgunHandOverlay" wm-live-shotgun-production-presentation.js
          grep -F "heroDepth < weaponDepth" wm-live-shotgun-production-presentation.js
          grep -F "weaponDepth < overlayDepth" wm-live-shotgun-production-presentation.js
          grep -F "runtimeBodyRotation === false" wm-live-shotgun-production-presentation.js
          grep -F "supportFromGrip" wm-live-shotgun-runtime-presentation.js
          grep -F "getShotgunWeaponOriginForFacing" wm-live-shotgun-runtime-presentation.js
          grep -F "facing === 'left' ? 1 - origin.x : origin.x" wm-live-shotgun-runtime-presentation.js
          grep -F ".setOrigin(pose.weaponOrigin.x, pose.weaponOrigin.y)" wm-live-shotgun-production-presentation.js
          grep -F "wrecker-shotgun-pellet" wm-live-shotgun-production-presentation.js
          grep -F "shots?.forEach?.(({ bullet })" wm-live-shotgun-production-presentation.js
          grep -F "setRotation?.(Math.atan2(vy, vx))" wm-live-shotgun-production-presentation.js
          grep -F "WRECKER_SHOTGUN_MUZZLE_AIM" wm-live-shotgun-production-presentation.js
          grep -F "maxVerticalTravelPx: 6" wm-live-shotgun-production-presentation.js
          grep -F "Math.sin(angle) * WRECKER_SHOTGUN_MUZZLE_AIM.maxVerticalTravelPx" wm-live-shotgun-production-presentation.js
          grep -F "const muzzle = resolveWreckerShotgunMuzzle(weaponMuzzle, requestedAngle)" wm-live-shotgun-production-presentation.js
          grep -F "bodyRearGrip: BODY_REAR_GRIP" wm-live-shotgun-art-contract.js
          grep -F "const BODY_REAR_GRIP = Object.freeze({ x: 70, y: 75 })" wm-live-shotgun-art-contract.js
          grep -F "const BODY_SUPPORT_GRIP = Object.freeze({ x: 103, y: 78 })" wm-live-shotgun-art-contract.js
          grep -F "const WEAPON_SUPPORT_GRIP = Object.freeze({ x: 51, y: 25 })" wm-live-shotgun-art-contract.js
          grep -F "./shotgun-art-contract.js?v=3" wm-live-shotgun-production-art.js
          grep -F "./shotgun-production-art.js?v=4" wm-live-shotgun-aim-alignment.js
          grep -F "authoredGrip = SHOTGUN_PRODUCTION_ART.body.authoredGripMarker" wm-live-shotgun-aim-alignment.js
          grep -F "data-support-x=\"51\" data-support-y=\"25\"" wm-live-shotgun-weapon.svg
          grep -F "./shotgun-locomotion-art.js?v=4" wm-live-shotgun-production-presentation.js
          grep -F "./shotgun-baked-locomotion.js?v=3" wm-live-shotgun-locomotion-art.js
          grep -F "./shotgun-hand-overlay-bake.js?v=2" wm-live-shotgun-locomotion-art.js
          grep -F "handOverlayKey" wm-live-shotgun-runtime-presentation.js
          grep -F "body-weapon-front-hands" wm-live-shotgun-runtime-presentation.js
          grep -F "SHOTGUN_HAND_OVERLAY_MASKS" wm-live-shotgun-hand-overlay-bake.js
          grep -F "bakeShotgunHandOverlayTexture" wm-live-shotgun-hand-overlay-bake.js
          grep -F "SHOTGUN_BAKED_RUN_POSES" wm-live-shotgun-baked-locomotion.js
          grep -F "bakeShotgunRunTextures" wm-live-shotgun-baked-locomotion.js
          grep -F "./runner-production-presentation.js?v=1" wm-live-character-runtime-presentation.js
          grep -F "./combat/weapon-registry.js?v=2" wm-live-phase-b.js
          grep -F "./combat/weapon-registry.js?v=2" wm-live-phase-c.js
          grep -F "../combat/weapon-registry.js?v=2" wm-live-character-system.js
          grep -F "this._resetHealthOnNextInstall=Boolean(scene?.hero)" wm-live-character-system.js
          grep -F "const resetHealth=this._resetHealthOnNextInstall===true" wm-live-character-system.js
          grep -F "this.applyGameplayDefaults({resetHealth})" wm-live-character-system.js
          grep -F "../combat/weapon-system.js?v=8" wm-live-enemy-system.js
          grep -F "./definitions/rivet-gun.js?v=2" wm-live-weapon-registry.js
          grep -F "id: 'rivet-gun'" wm-live-rivet-gun.js
          grep -F "damage: 24" wm-live-rivet-gun.js
          grep -F "fireDelay: 390" wm-live-rivet-gun.js
          grep -F "projectileSpeed: 760" wm-live-rivet-gun.js
          grep -F "range: 570" wm-live-rivet-gun.js
          grep -F "projectileCount: 1" wm-live-rivet-gun.js
          grep -F "halfSpreadRadians: 0" wm-live-rivet-gun.js
          grep -F "volleyDamageMultiplier: 1" wm-live-rivet-gun.js
          grep -F "heroVolleyProfile()" wm-live-weapon-system.js
          grep -F "source: 'weapon'" wm-live-weapon-system.js
          grep -F "weaponVolley:s.primaryWeapon?.fireProfile?.projectileCount===1" wm-live-runner-production-presentation.js
          grep -F "weaponIdentity:s.characterSystem?.weaponDefinition?.id==='rivet-gun'" wm-live-runner-production-presentation.js
          grep -F "./upgrades/upgrade-scene.js?v=1" wm-live-phase-c.js
          grep -F "./upgrades/upgrade-scene.js?v=2" wm-live-phase-c1.js
          grep -F "./upgrade-offer-pool.js?v=2" wm-live-upgrade-scene.js
          grep -F "./upgrade-roll-service.js?v=2" wm-live-upgrade-scene.js
          grep -F "class UpgradeSceneV4 extends Phaser.Scene" wm-live-upgrade-scene.js
          grep -F "gameScene.__upgradeSceneOwner = 'src/upgrades/upgrade-scene.js'" wm-live-upgrade-scene.js
          grep -F "offer('explosive-rivet', 'HERO'" wm-live-upgrade-offer-pool.js
          grep -F "offer('triple-riveter', 'EVOLUTION'" wm-live-upgrade-offer-pool.js
          grep -F "HUNTER_INITIAL: 'HUNTER_INITIAL'" wm-live-upgrade-offer-pool.js
          grep -F "./upgrades/upgrade-card-art.js?v=7" wm-live-phase-d1.js
          grep -F "upgrade-icon-explosive-rivet" wm-live-upgrade-card-art.js
          grep -F "upgrade-icon-triple-riveter" wm-live-upgrade-card-art.js
          grep -F "./src/mobile-hud-loader-canonical-v2.js" wm-live-index.html
          grep -F "./mobile-hud-polish.js?asset=canonical-hud-20260903-responsive-v2" wm-live-mobile-hud-loader.js
          grep -F "./src/final-polish-runtime.js?v=2" wm-live-index.html
          if grep -Fq "scene.endRun=" wm-live-mobile-hud.js || grep -Fq "__WM_END_RUN_LAYOUT__" wm-live-mobile-hud.js || grep -Fq "TEST UI v5" wm-live-mobile-hud.js; then
            echo "mobile HUD still owns legacy Results/end-run UI"
            exit 1
          fi
          if grep -Fq "mobile-hud-polish" wm-live-phase-d1.js; then
            echo "phase-d1 still owns mobile HUD"
            exit 1
          fi
          if grep -Fq "mobile-hud-polish" wm-live-final-polish.js; then
            echo "final-polish still owns mobile HUD"
            exit 1
          fi
      - name: Smoke test deployed Pages build
        id: live_smoke
        continue-on-error: true
        env:
          WM_SMOKE_URL: ${{ needs.deploy.outputs.page_url }}?debug=1&wmTelemetry=1&build=${{ github.sha }}
          WM_SMOKE_CHARACTER: shotgun
        run: |
          set -o pipefail
          timeout 75s node scripts/ci-smoke.mjs 2>&1 | tee wm-live-smoke.log
      - name: Preserve live smoke diagnostics
        if: steps.live_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke
          if-no-files-found: ignore
          path: |
            wm-live-smoke.log
            wm-live-install.log
            wm-live-playwright-install.log
            wm-live-index.html
            wm-live-mobile-hud.js
            wm-live-mobile-hud-loader.js
            wm-live-telemetry-runtime.js
            wm-live-run-telemetry.js
            wm-live-enemy-system.js
            wm-live-phase-b.js
            wm-live-phase-c.js
            wm-live-phase-c1.js
            wm-live-phase-c5.js
            wm-live-upgrade-scene.js
            wm-live-upgrade-offer-pool.js
            wm-live-upgrade-roll-service.js
            wm-live-upgrade-card-art.js
            wm-live-phase-d1.js
            wm-live-phase-e1.js
            wm-live-character-runtime-presentation.js
            wm-live-character-registry.js
            wm-live-shotgun-production-presentation.js
            wm-live-shotgun-runtime-presentation.js
            wm-live-shotgun-aim-alignment.js
            wm-live-shotgun-production-art.js
            wm-live-shotgun-art-contract.js
            wm-live-shotgun-weapon.svg
            wm-live-shotgun-locomotion-art.js
            wm-live-shotgun-baked-locomotion.js
            wm-live-shotgun-hand-overlay-bake.js
            wm-live-runner-production-presentation.js
            wm-live-character-system.js
            wm-live-weapon-registry.js
            wm-live-weapon-system.js
            wm-live-rivet-gun.js
            wm-live-final-polish.js
            wm-live-game-shell.js
      - name: Open, update, or close live failure issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          OUTCOME: ${{ steps.live_smoke.outcome }}
        run: |
          set -euo pipefail
          TITLE='[LIVE] deployed main smoke failed'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[LIVE] deployed main smoke failed") | .number' | head -n1)"
          if [ "$OUTCOME" = success ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Live Chromium smoke recovered on \`$SHA\`: $PAGE_URL"
            fi
            exit 0
          fi
          {
            printf 'Live Chromium smoke failed after GitHub Pages deployed `%s`.\n\n' "$SHA"
            printf 'Live URL: %s\n' "$PAGE_URL"
            printf 'Run: https://github.com/%s/actions/runs/%s\n\n' "$REPO" "${{ github.run_id }}"
            printf 'The smoke gate treats these browser signals as failures:\n'
            printf -- '- console.error\n- pageerror\n- requestfailed\n- boot/playability assertion timeout\n- stale deployed asset graph\n- missing SEND REPORT control in wmTelemetry mode\n\n'
            if [ -f wm-live-smoke.log ]; then
              printf '### wm-live-smoke.log\n```text\n'
              tail -c 16000 wm-live-smoke.log
              printf '\n```\n'
            fi
          } > /tmp/wm-live-issue.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/wm-live-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/wm-live-issue.md --label ci-failure
          fi
          exit 1
