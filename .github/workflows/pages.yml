name: Test and Deploy Wreckmarch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-quality-install.log
      - name: Typecheck, unit tests and static build
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee wm-quality-check.log
      - name: Comment quality diagnostics
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Quality checks failed.'
            echo
            for LOG in wm-quality-check.log wm-quality-install.log; do
              [ -f "$LOG" ] || continue
              echo "### $LOG"
              echo '```text'
              tail -c 12000 "$LOG"
              echo
              echo '```'
            done
          } > /tmp/wm-quality-comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/wm-quality-comment.md
      - name: Preserve quality diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality
          if-no-files-found: ignore
          path: |
            wm-quality-check.log
            wm-quality-install.log

  e2e-shard:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee "wm-e2e-install-${{ matrix.shardIndex }}.log"
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee "wm-e2e-playwright-install-${{ matrix.shardIndex }}.log"
      - name: Run Playwright shard
        run: |
          set -o pipefail
          pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} 2>&1 | tee "wm-e2e-shard-${{ matrix.shardIndex }}.log"
      - name: Comment shard failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          LOG="wm-e2e-shard-${{ matrix.shardIndex }}.log"
          {
            echo "Playwright **E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}** failed."
            echo
            if [ -f "$LOG" ]; then
              echo "### $LOG"
              echo '```text'
              tail -c 16000 "$LOG"
              echo
              echo '```'
            fi
          } > /tmp/wm-e2e-shard-comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/wm-e2e-shard-comment.md
      - name: Upload shard report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shardIndex }}
          if-no-files-found: error
          retention-days: 7
          path: |
            blob-report/**
            wm-e2e-shard-${{ matrix.shardIndex }}.log
            wm-e2e-install-${{ matrix.shardIndex }}.log
            wm-e2e-playwright-install-${{ matrix.shardIndex }}.log

  e2e:
    name: E2E
    needs: [e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install report dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-e2e-report-install.log
      - name: Download all E2E shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: all-e2e-artifacts
          merge-multiple: true
      - name: Merge Playwright shard reports
        id: merge_e2e
        run: |
          set -u
          mkdir -p all-blob-reports
          find all-e2e-artifacts -type f -name '*.zip' -exec cp {} all-blob-reports/ \;
          if ! compgen -G 'all-blob-reports/*.zip' > /dev/null; then
            echo 'No Playwright blob reports were produced.' | tee wm-e2e-merged.log
            echo 'exit_code=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          set -o pipefail
          pnpm exec playwright merge-reports --reporter=html,line ./all-blob-reports 2>&1 | tee wm-e2e-merged.log
          MERGE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$MERGE_EXIT" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment merged Playwright diagnostics
        if: ${{ github.event_name == 'pull_request' && (needs.e2e-shard.result != 'success' || steps.merge_e2e.outputs.exit_code != '0') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          {
            echo "Playwright E2E failed. Sharded result: **$SHARD_RESULT**."
            echo
            if [ -f wm-e2e-merged.log ]; then
              echo '### merged Playwright report'
              echo '```text'
              tail -c 16000 wm-e2e-merged.log
              echo
              echo '```'
            fi
            for LOG in all-e2e-artifacts/wm-e2e-shard-*.log; do
              [ -f "$LOG" ] || continue
              echo "### $(basename "$LOG")"
              echo '```text'
              tail -c 6000 "$LOG"
              echo
              echo '```'
            done
          } > /tmp/wm-e2e-comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/wm-e2e-comment.md
      - name: Enforce E2E gate
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
          MERGE_EXIT: ${{ steps.merge_e2e.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$SHARD_RESULT" != success ]; then
            echo "One or more E2E shards failed: $SHARD_RESULT"
            exit 1
          fi
          if [ "${MERGE_EXIT:-1}" != 0 ]; then
            echo "Merged Playwright report failed: ${MERGE_EXIT:-missing}"
            exit 1
          fi
      - name: Preserve merged E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e
          if-no-files-found: ignore
          retention-days: 14
          path: |
            wm-e2e-merged.log
            wm-e2e-report-install.log
            all-e2e-artifacts/**
            playwright-report/**

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install smoke dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-smoke-install.log
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee wm-smoke-playwright-install.log
      - name: Vendor Phaser locally
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
      - name: Browser smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >wm-http.log 2>&1 &
          HTTP_PID=$!
          cleanup() { kill "$HTTP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 75s node scripts/ci-smoke.mjs 2>&1 | tee wm-smoke.log
      - name: Preserve smoke diagnostics
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke
          if-no-files-found: ignore
          path: |
            wm-smoke.log
            wm-smoke-install.log
            wm-smoke-playwright-install.log
            wm-http.log

  ci-bridge:
    name: CI issue bridge
    needs: [quality, e2e, smoke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download quality diagnostics
        if: needs.quality.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-quality
          path: /tmp/ci-quality
      - name: Download E2E diagnostics
        if: needs.e2e.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-e2e
          path: /tmp/ci-e2e
      - name: Download smoke diagnostics
        if: needs.smoke.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-smoke
          path: /tmp/ci-smoke
      - name: Bridge main CI state to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          TITLE='[CI] main is failing'
          ISSUE_NUMBER="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[CI] main is failing") | .number' | head -n1)"
          if [ "$QUALITY" = success ] && [ "$E2E" = success ] && [ "$SMOKE" = success ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "CI recovered on \`$SHA\`: quality=$QUALITY, e2e=$E2E, smoke=$SMOKE."
            fi
            exit 0
          fi
          {
            printf 'CI failed on `%s`.\n\n' "$SHA"
            printf -- '- quality: **%s**\n- e2e: **%s**\n- smoke: **%s**\n\n' "$QUALITY" "$E2E" "$SMOKE"
            printf 'Run: https://github.com/%s/actions/runs/%s\n\n' "$REPO" "${{ github.run_id }}"
            if [ "$QUALITY" = failure ]; then
              for LOG in /tmp/ci-quality/wm-quality-check.log /tmp/ci-quality/wm-quality-install.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
            if [ "$E2E" = failure ]; then
              for LOG in /tmp/ci-e2e/wm-e2e-merged.log /tmp/ci-e2e/all-e2e-artifacts/wm-e2e-shard-*.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
            if [ "$SMOKE" = failure ]; then
              for LOG in /tmp/ci-smoke/wm-smoke.log /tmp/ci-smoke/wm-smoke-playwright-install.log /tmp/ci-smoke/wm-http.log; do
                [ -f "$LOG" ] || continue
                printf '### %s\n```text\n' "$(basename "$LOG")"
                tail -c 12000 "$LOG"
                printf '\n```\n\n'
              done
            fi
          } > /tmp/wm-ci-issue.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/wm-ci-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/wm-ci-issue.md --label ci-failure
          fi

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp index.html style.css manifest.webmanifest _site/
          cp -R src _site/src
          cp -R assets _site/assets
          mkdir -p _site/vendor
          if [ -f vendor/phaser.min.js ]; then cp vendor/phaser.min.js _site/vendor/phaser.min.js; else curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o _site/vendor/phaser.min.js; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    name: Live Chromium smoke
    needs: [deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee wm-live-install.log
      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee wm-live-playwright-install.log
      - name: Verify deployed telemetry UI asset graph
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}/"
          curl -fsSL --retry 5 "${BASE}?build=${SHA}" -o wm-live-index.html
          curl -fsSL --retry 5 "${BASE}src/mobile-hud-loader-canonical-v2.js" -o wm-live-mobile-hud-loader.js
          curl -fsSL --retry 5 "${BASE}src/mobile-hud-polish.js?asset=canonical-hud-20260903-responsive-v2" -o wm-live-mobile-hud.js
          curl -fsSL --retry 5 "${BASE}src/enemies/enemy-system.js?v=24" -o wm-live-enemy-system.js
          curl -fsSL --retry 5 "${BASE}src/phase-b-runtime.js?v=6" -o wm-live-phase-b.js
          curl -fsSL --retry 5 "${BASE}src/phase-c-runtime.js?v=24" -o wm-live-phase-c.js
          curl -fsSL --retry 5 "${BASE}src/phase-c1-runtime.js?v=19" -o wm-live-phase-c1.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-scene.js?v=1" -o wm-live-upgrade-scene.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-offer-pool.js?v=1" -o wm-live-upgrade-offer-pool.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-roll-service.js?v=2" -o wm-live-upgrade-roll-service.js
          curl -fsSL --retry 5 "${BASE}src/phase-d1-runtime.js?v=29" -o wm-live-phase-d1.js
          curl -fsSL --retry 5 "${BASE}src/characters/character-runtime-presentation.js?v=3&wrecker=4" -o wm-live-character-runtime-presentation.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-production-presentation.js?v=3&wrecker=4" -o wm-live-shotgun-production-presentation.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-runtime-presentation.js?v=3" -o wm-live-shotgun-runtime-presentation.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-locomotion-art.js?v=2" -o wm-live-shotgun-locomotion-art.js
          curl -fsSL --retry 5 "${BASE}src/characters/shotgun-baked-locomotion.js?v=1" -o wm-live-shotgun-baked-locomotion.js
          curl -fsSL --retry 5 "${BASE}src/characters/runner-production-presentation.js?v=1" -o wm-live-runner-production-presentation.js
          curl -fsSL --retry 5 "${BASE}src/characters/character-system.js?v=10" -o wm-live-character-system.js
          curl -fsSL --retry 5 "${BASE}src/combat/weapon-registry.js?v=2" -o wm-live-weapon-registry.js
          curl -fsSL --retry 5 "${BASE}src/combat/weapon-system.js?v=8" -o wm-live-weapon-system.js
          curl -fsSL --retry 5 "${BASE}src/combat/definitions/rivet-gun.js?v=2" -o wm-live-rivet-gun.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-card-art.js?v=7" -o wm-live-upgrade-card-art.js
          curl -fsSL --retry 5 "${BASE}src/final-polish-runtime.js?v=2" -o wm-live-final-polish.js
          grep -F "./src/phase-b-runtime.js?v=6" wm-live-index.html
          grep -F "./src/phase-c-runtime.js?v=24" wm-live-index.html
          grep -F "./src/phase-c1-runtime.js?v=19" wm-live-index.html
          grep -F "./src/phase-d1-runtime.js?v=29&u5=3&wrecker=4" wm-live-index.html
          grep -F "./characters/character-runtime-presentation.js?v=3&wrecker=4" wm-live-phase-d1.js
          grep -F "./shotgun-production-presentation.js?v=3&wrecker=4" wm-live-character-runtime-presentation.js
          grep -F "./shotgun-runtime-presentation.js?v=3" wm-live-shotgun-production-presentation.js
          grep -F "./shotgun-locomotion-art.js?v=2" wm-live-shotgun-production-presentation.js
          grep -F "./shotgun-baked-locomotion.js?v=1" wm-live-shotgun-locomotion-art.js
          grep -F "SHOTGUN_BAKED_RUN_POSES" wm-live-shotgun-baked-locomotion.js
          grep -F "bakeShotgunRunTextures" wm-live-shotgun-baked-locomotion.js
          grep -F "./runner-production-presentation.js?v=1" wm-live-character-runtime-presentation.js
          grep -F "./combat/weapon-registry.js?v=2" wm-live-phase-b.js
          grep -F "./combat/weapon-registry.js?v=2" wm-live-phase-c.js
          grep -F "../combat/weapon-registry.js?v=2" wm-live-character-system.js
          grep -F "../combat/weapon-system.js?v=8" wm-live-enemy-system.js
          grep -F "./definitions/rivet-gun.js?v=2" wm-live-weapon-registry.js
          grep -F "id: 'rivet-gun'" wm-live-rivet-gun.js
          grep -F "damage: 24" wm-live-rivet-gun.js
          grep -F "fireDelay: 390" wm-live-rivet-gun.js
          grep -F "projectileSpeed: 760" wm-live-rivet-gun.js
          grep -F "range: 570" wm-live-rivet-gun.js
          grep -F "projectileCount: 1" wm-live-rivet-gun.js
          grep -F "halfSpreadRadians: 0" wm-live-rivet-gun.js
          grep -F "volleyDamageMultiplier: 1" wm-live-rivet-gun.js
          grep -F "heroVolleyProfile()" wm-live-weapon-system.js
          grep -F "source: 'weapon'" wm-live-weapon-system.js
          grep -F "weaponVolley:s.primaryWeapon?.fireProfile?.projectileCount===1" wm-live-runner-production-presentation.js
          grep -F "weaponIdentity:s.characterSystem?.weaponDefinition?.id==='rivet-gun'" wm-live-runner-production-presentation.js
          grep -F "./upgrades/upgrade-scene.js?v=1" wm-live-phase-c.js
          grep -F "./upgrades/upgrade-scene.js?v=1" wm-live-phase-c1.js
          grep -F "./upgrade-offer-pool.js?v=1" wm-live-upgrade-scene.js
          grep -F "./upgrade-roll-service.js?v=2" wm-live-upgrade-scene.js
          grep -F "class UpgradeSceneV4 extends Phaser.Scene" wm-live-upgrade-scene.js
          grep -F "gameScene.__upgradeSceneOwner = 'src/upgrades/upgrade-scene.js'" wm-live-upgrade-scene.js
          grep -F "offer('explosive-rivet', 'HERO'" wm-live-upgrade-offer-pool.js
          grep -F "offer('triple-riveter', 'EVOLUTION'" wm-live-upgrade-offer-pool.js
          grep -F "HUNTER_INITIAL: 'HUNTER_INITIAL'" wm-live-upgrade-offer-pool.js
          grep -F "./upgrades/upgrade-card-art.js?v=7" wm-live-phase-d1.js
          grep -F "upgrade-icon-explosive-rivet" wm-live-upgrade-card-art.js
          grep -F "upgrade-icon-triple-riveter" wm-live-upgrade-card-art.js
          grep -F "./src/mobile-hud-loader-canonical-v2.js" wm-live-index.html
          grep -F "./mobile-hud-polish.js?asset=canonical-hud-20260903-responsive-v2" wm-live-mobile-hud-loader.js
          grep -F "./src/final-polish-runtime.js?v=2" wm-live-index.html
          if grep -Fq "scene.endRun=" wm-live-mobile-hud.js || grep -Fq "__WM_END_RUN_LAYOUT__" wm-live-mobile-hud.js || grep -Fq "TEST UI v5" wm-live-mobile-hud.js; then
            echo "mobile HUD still owns legacy Results/end-run UI"
            exit 1
          fi
          if grep -Fq "mobile-hud-polish" wm-live-phase-d1.js; then
            echo "phase-d1 still owns mobile HUD"
            exit 1
          fi
          if grep -Fq "mobile-hud-polish" wm-live-final-polish.js; then
            echo "final-polish still owns mobile HUD"
            exit 1
          fi
      - name: Smoke test deployed Pages build
        id: live_smoke
        continue-on-error: true
        env:
          WM_SMOKE_URL: ${{ needs.deploy.outputs.page_url }}?autotest=1&debug=1&wmTelemetry=1&build=${{ github.sha }}
        run: |
          set -o pipefail
          timeout 75s node scripts/ci-smoke.mjs 2>&1 | tee wm-live-smoke.log
      - name: Preserve live smoke diagnostics
        if: steps.live_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke
          if-no-files-found: ignore
          path: |
            wm-live-smoke.log
            wm-live-install.log
            wm-live-playwright-install.log
            wm-live-index.html
            wm-live-mobile-hud.js
            wm-live-mobile-hud-loader.js
            wm-live-enemy-system.js
            wm-live-phase-b.js
            wm-live-phase-c.js
            wm-live-phase-c1.js
            wm-live-upgrade-scene.js
            wm-live-upgrade-offer-pool.js
            wm-live-upgrade-roll-service.js
            wm-live-phase-d1.js
            wm-live-character-runtime-presentation.js
            wm-live-shotgun-production-presentation.js
            wm-live-shotgun-runtime-presentation.js
