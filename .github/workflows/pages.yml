name: Test and Deploy Wreckmarch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor Phaser locally
        shell: bash
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 --connect-timeout 10 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js \
            || curl -fsSL --retry 3 --connect-timeout 10 https://unpkg.com/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
          test -s vendor/phaser.min.js

      - name: Browser smoke test
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found on runner"
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=15000 \
            --dump-dom \
            "http://127.0.0.1:4173/?debug=1" \
            >/tmp/wm-dom.html 2>/tmp/wm-chrome.log

          if ! grep -q '<canvas' /tmp/wm-dom.html; then
            echo "Browser test failed: Phaser canvas was not created"
            cat /tmp/wm-chrome.log
            cat /tmp/wm-dom.html
            exit 1
          fi

          if ! grep -q 'Art pack v2 applied' /tmp/wm-dom.html; then
            echo "Browser test failed: production art pack was not applied"
            cat /tmp/wm-chrome.log
            cat /tmp/wm-dom.html
            exit 1
          fi

          if ! grep -q 'Phase B applied: 2200x2200 world + tuned movement + visible Rivet Gun' /tmp/wm-dom.html; then
            echo "Browser test failed: Phase B large-world runtime was not applied"
            cat /tmp/wm-chrome.log
            cat /tmp/wm-dom.html
            exit 1
          fi

          if ! grep -q 'Phase B.1 polish active: hand-anchored Rivet Gun + asset-based wasteland' /tmp/wm-dom.html; then
            echo "Browser test failed: Phase B.1 visual polish was not applied"
            cat /tmp/wm-chrome.log
            cat /tmp/wm-dom.html
            exit 1
          fi

          if ! grep -q 'Phase C active: weapon rig + scaled combat + swept hitboxes + Scrap cards + optional Rig' /tmp/wm-dom.html; then
            echo "Browser test failed: Phase C core loop was not applied"
            cat /tmp/wm-chrome.log
            cat /tmp/wm-dom.html
            exit 1
          fi

          if grep -Eq '<body[^>]*class="[^"]*boot-error' /tmp/wm-dom.html; then
            echo "Browser test failed: boot loader reported an error"
            cat /tmp/wm-chrome.log
            cat /tmp/wm-dom.html
            exit 1
          fi

          echo "Wreckmarch Phase C browser smoke test passed"

      - name: Comment browser diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, re
          dom = Path('/tmp/wm-dom.html').read_text(errors='ignore') if Path('/tmp/wm-dom.html').exists() else ''
          chrome = Path('/tmp/wm-chrome.log').read_text(errors='ignore') if Path('/tmp/wm-chrome.log').exists() else ''
          m = re.search(r'<pre id="debug-panel"[^>]*>(.*?)</pre>', dom, re.S)
          debug = html.unescape(re.sub('<[^>]+>', '', m.group(1))).strip() if m else 'debug panel not found'
          body = '### Browser smoke diagnostic\n\n```text\n' + debug[-5000:] + '\n```\n\nChrome tail:\n```text\n' + chrome[-2500:] + '\n```\n'
          Path('/tmp/wm-diagnostic.md').write_text(body)
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/wm-diagnostic.md

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: smoke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Vendor Phaser locally
        shell: bash
        run: |
          mkdir -p vendor
          curl -fsSL --retry 3 --connect-timeout 10 https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js \
            || curl -fsSL --retry 3 --connect-timeout 10 https://unpkg.com/phaser@3.90.0/dist/phaser.min.js -o vendor/phaser.min.js
          test -s vendor/phaser.min.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
