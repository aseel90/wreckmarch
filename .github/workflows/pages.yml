name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed asset graph
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://aseel90.github.io/wreckmarch/"
          curl -fsSL --retry 5 "${BASE}src/phase-c-runtime.js?v=24" -o wm-live-phase-c.js
          curl -fsSL --retry 5 "${BASE}src/phase-c1-landscape-ui.js?v=29" -o wm-live-phase-c1.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-scene.js?v=1" -o wm-live-upgrade-scene.js
          curl -fsSL --retry 5 "${BASE}src/upgrades/upgrade-offer-pool.js?v=1" -o wm-live-upgrade-offer-pool.js
          grep -F "./combat/weapon-registry.js?v=2" wm-live-phase-c.js
          grep -F "./upgrades/upgrade-scene.js?v=1" wm-live-phase-c.js
          grep -F "./upgrades/upgrade-scene.js?v=1" wm-live-phase-c1.js
          grep -F "./upgrade-offer-pool.js?v=1" wm-live-upgrade-scene.js
          grep -F "./upgrade-roll-service.js?v=2" wm-live-upgrade-scene.js
          grep -F "class UpgradeSceneV4 extends Phaser.Scene" wm-live-upgrade-scene.js
          grep -F "gameScene.__upgradeSceneOwner = 'src/upgrades/upgrade-scene.js'" wm-live-upgrade-scene.js
          grep -F "offer('explosive-rivet', 'HERO'" wm-live-upgrade-offer-pool.js
          grep -F "offer('triple-riveter', 'EVOLUTION'" wm-live-upgrade-offer-pool.js
          grep -F "HUNTER_INITIAL: 'HUNTER_INITIAL'" wm-live-upgrade-offer-pool.js
      - name: Live Chromium smoke
        run: pnpm exec playwright test tests/e2e/live-smoke.spec.ts --project=chromium
