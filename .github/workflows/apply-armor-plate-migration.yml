name: Apply Armor Plate canonical migration

on:
  push:
    branches: [upgrade-system-u2-armor-plate-canonical]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-system-u2-armor-plate-canonical
          fetch-depth: 0
      - name: Apply reviewed Armor Plate patch
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/armor.patch
          git apply --check /tmp/armor.patch
          git apply /tmp/armor.patch
      - name: Syntax guard
        run: |
          node --check src/upgrades/upgrade-mechanical-effects.js
          node --check src/upgrades/upgrade-runtime.js
          node --check src/upgrades/definitions/armor-plate.js
          node --check src/upgrades/upgrade-catalog.js
          node --check src/phase-c-runtime.js
          node --check src/phase-c1-runtime.js
      - name: Commit canonical migration and remove applicator
        run: |
          rm -f .github/workflows/apply-armor-plate-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate Armor Plate to transactional character stats'
          git push origin HEAD:upgrade-system-u2-armor-plate-canonical
