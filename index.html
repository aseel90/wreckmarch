

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061019" />
  <title>Wreckmarch — Visual Slice</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061019;color:#d9edf5;font-family:Arial,Helvetica,sans-serif}
    #game{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:stretch;background:#061019}
    canvas{display:block}
    #loadingOverlay{position:fixed;inset:0;z-index:999999;background:radial-gradient(circle at 50% 45%,#11202b 0%,#061019 58%,#02070b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;letter-spacing:.08em;color:#bce9ef;transition:opacity .18s ease;pointer-events:none}
    #loadingOverlay strong{font-size:clamp(18px,3vw,34px);color:#f7b35e;letter-spacing:.12em}
    #loadingStatus{font-size:clamp(10px,1.6vw,15px);opacity:.82}
    .visual-ready #loadingOverlay{opacity:0;visibility:hidden}
    #rotateOverlay{display:none;position:fixed;inset:0;z-index:1000000;background:#061019;color:#d9edf5;align-items:center;justify-content:center;text-align:center;padding:32px;box-sizing:border-box}
    #rotateOverlay strong{display:block;color:#f7b35e;font-size:24px;margin-bottom:10px}
    @media (orientation:portrait) and (max-width:900px){#rotateOverlay{display:flex}}
    #fullscreenBtn{position:fixed;right:12px;bottom:12px;z-index:999998;border:1px solid #6ea6b8;background:rgba(7,21,31,.8);color:#dff8ff;padding:9px 12px;border-radius:4px;font-size:12px;letter-spacing:.08em}
    #debugPanel{position:fixed;left:10px;bottom:10px;z-index:999997;max-width:min(92vw,760px);max-height:45vh;overflow:auto;background:rgba(1,8,12,.94);border:1px solid #5c8795;padding:8px 10px;font-size:11px;line-height:1.45;color:#b9f4d3;white-space:pre-wrap;display:none}
    body.debug-open #debugPanel{display:block}
    #debugToggle{position:fixed;left:10px;bottom:10px;z-index:999998;border:1px solid #405f6b;background:rgba(4,13,19,.9);color:#a9d5e3;padding:7px 9px;border-radius:4px;font-size:10px}
    body.debug-open #debugToggle{bottom:calc(45vh + 18px)}
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loadingOverlay"><strong>WRECKMARCH</strong><span>BUILD • ROLL • SURVIVE</span><span id="loadingStatus">LOADING VISUAL SLICE…</span></div>
  <div id="rotateOverlay"><div><strong>↻ ROTATE TO LANDSCAPE</strong>WRECKMARCH is built for horizontal play.</div></div>
  <button id="fullscreenBtn">⛶ FULLSCREEN</button>
  <button id="debugToggle">DEBUG ▼</button>
  <div id="debugPanel"><button id="copyDebug" style="margin-bottom:8px">COPY DEBUG</button><pre id="debugText"></pre></div>

  <script type="module">
    const debug=[];const log=(m)=>{debug.push(`[${new Date().toISOString()}] ${m}`);console.log(m);document.getElementById('debugText').textContent=debug.join('\n')};window.__WM_LOG__=log;
    window.addEventListener('error',e=>log(`ERROR: ${e.message}\n${e.error?.stack||''}`));window.addEventListener('unhandledrejection',e=>log(`PROMISE: ${e.reason?.stack||e.reason}`));
    const status=document.getElementById('loadingStatus');const fail=(m)=>{status.textContent='LOAD FAILED — OPEN DEBUG';document.body.classList.add('debug-open');log(m)};
    document.getElementById('debugToggle').onclick=()=>document.body.classList.toggle('debug-open');document.getElementById('copyDebug').onclick=()=>navigator.clipboard?.writeText(debug.join('\n'));document.getElementById('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();
    const boot=async()=>{try{status.textContent='LOADING PHASER…';await import('https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.esm.js').then(m=>window.Phaser=m.default||m);log(`Phaser ${window.Phaser.VERSION}`);status.textContent='STARTING GAME…';await import('./src/game.js?v=8');log('Phase A hero core imported');status.textContent='INSTALLING ENEMY FOUNDATION…';const enemyFoundation=await import('./src/enemies/enemy-system.js?v=9');await enemyFoundation.installEnemyFoundation();log('Enemy Foundation active');status.textContent='BUILDING TERRAIN…';const phaseE0=await import('./src/phase-e0-fast-terrain.js?v=2');await phaseE0.applyFastTerrain();log('Fast terrain bootstrap active');status.textContent='APPLYING ART PACK…';const art=await import('./src/art-runtime.js?v=6');await art.applyProductionArt();log('Production art pack active');status.textContent='EXPANDING WORLD…';const phaseB=await import('./src/phase-b-runtime.js?v=3');await phaseB.applyPhaseB();log('Phase B large world active');status.textContent='POLISHING WEAPON + WORLD…';const phaseB1=await import('./src/phase-b1-polish.js?v=4');await phaseB1.applyPhaseB1Polish();log('Phase B.1 visual polish active');status.textContent='BUILDING CORE LOOP…';const phaseC=await import('./src/phase-c-runtime.js?v=5');await phaseC.applyPhaseC();log('Phase C core loop active');status.textContent='REBUILDING LANDSCAPE UX…';const phaseC1=await import('./src/phase-c1-runtime.js?v=2');await phaseC1.applyPhaseC1();log('Phase C.1 landscape UX active');status.textContent='APPLYING VISUAL FOUNDATION…';const phaseC2=await import('./src/phase-c2-runtime.js?v=2');await phaseC2.applyPhaseC2();log('Phase C.2 responsive visual foundation active');status.textContent='APPLYING EXCLUSIVE ART + MOTION POLISH…';const phaseC3=await import('./src/phase-c3-runtime.js?v=5');await phaseC3.applyPhaseC3();log('Phase C.3 exclusive art and motion polish active');status.textContent='FIXING ART FRAMES…';const phaseC31=await import('./src/phase-c3-frame-fix.js?v=3');await phaseC31.applyPhaseC31();log('Phase C.3.1 visual frame fix active');status.textContent='LOCKING WEAPON SOCKETS + TERRAIN…';const phaseC4=await import('./src/phase-c4-runtime.js?v=3');await phaseC4.applyPhaseC4();log('Phase C.4 sockets, Rig spring and PNG terrain active');status.textContent='ALIGNING HERO + HD CARDS + ROAD NETWORK…';const phaseC5=await import('./src/phase-c5-runtime.js?v=5');await phaseC5.applyPhaseC5();log('Phase C.5 directional hero, HD cards and road network active');status.textContent='APPLYING PHASE D.1…';const phaseD1=await import('./src/phase-d1-runtime.js?v=4');await phaseD1.applyPhaseD1();log('Phase D.1 world, Runner and mechanical-arm rebuild active');status.textContent='CLEANING ROAD LAYERS…';const phaseE1=await import('./src/phase-e1-runtime.js?v=10');await phaseE1.applyPhaseE1();log('Phase E.1 clean road renderer active');const companionV3=await import('./src/companion-runtime-v3.js?v=2');companionV3.applyCompanionV3(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Companion hand socket aligned');const ratVisuals=await import('./src/enemies/scrap-rat-visuals.js?v=6');await ratVisuals.installScrapRatVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Production Scrap Rat locked after final runtime');status.textContent='READY';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));document.documentElement.dataset.wreckmarchVisualReady='current';document.body.classList.add('visual-ready');log('Current visual stack revealed')}catch(err){fail(`Game module: ${err?.stack||err}`)}};
    boot();
  </script>
</body>
</html>
