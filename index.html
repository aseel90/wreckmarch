<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#090d13" />
  <title>WRECKMARCH</title>
  <link rel="stylesheet" href="./style.css?v=8" />
</head>
<body>
  <main id="game-shell" aria-label="Wreckmarch game">
    <div id="boot"><strong>WRECKMARCH</strong><span id="boot-status">INITIALIZING…</span><small>LANDSCAPE RECOMMENDED</small></div>
    <div id="rotate-device"><div class="rotate-icon">↻</div><strong>ROTATE DEVICE</strong><span>Wreckmarch is built for landscape play.</span></div>
    <div id="game"></div>
    <button id="fullscreen-toggle" type="button">⛶ FULLSCREEN</button>
    <button id="debug-toggle" type="button" aria-expanded="false">DEBUG ▲</button>
    <button id="copy-debug" type="button" hidden>COPY DEBUG</button>
    <pre id="debug-panel" class="collapsed"></pre>
  </main>
  <script>
    (()=>{
      const q=new URLSearchParams(location.search),debug=q.get('debug')==='1',autotest=q.get('autotest')==='1',lines=[],panel=document.getElementById('debug-panel'),toggle=document.getElementById('debug-toggle'),copyDebug=document.getElementById('copy-debug'),status=document.getElementById('boot-status'),fullscreenToggle=document.getElementById('fullscreen-toggle');
      window.__WM_LOG__=(msg)=>{const line=`[${new Date().toLocaleTimeString()}] ${msg}`;lines.push(line);console.log(line);if(debug){panel.textContent=lines.slice(-120).join('\n');panel.classList.add('show')}};
      const log=window.__WM_LOG__;
      const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
      const nativeFullscreenSupported=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
      const getFullscreenElement=()=>document.fullscreenElement||document.webkitFullscreenElement;
      const requestFullscreen=()=>document.documentElement.requestFullscreen?.({navigationUI:'hide'})||document.documentElement.webkitRequestFullscreen?.();
      const exitFullscreen=()=>document.exitFullscreen?.()||document.webkitExitFullscreen?.();
      if(!standalone){document.body.classList.add('browser-shell');if(nativeFullscreenSupported)document.body.classList.add('browser-fullscreen-capable');const sync=()=>{const active=!!getFullscreenElement(),fit=document.body.classList.contains('browser-fit-mode');document.body.classList.toggle('is-fullscreen',active);fullscreenToggle.textContent=active||fit?'↙ EXIT':(nativeFullscreenSupported?'⛶ FULLSCREEN':'⛶ FIT SCREEN');fullscreenToggle.setAttribute('aria-label',active||fit?'Exit fullscreen view':'Enter fullscreen view')};fullscreenToggle.addEventListener('click',async()=>{try{if(nativeFullscreenSupported){if(getFullscreenElement())await exitFullscreen();else{await requestFullscreen();try{await screen.orientation?.lock?.('landscape')}catch(_){}}}else{document.body.classList.toggle('browser-fit-mode');window.scrollTo?.(0,0)}}catch(err){document.body.classList.toggle('browser-fit-mode');window.scrollTo?.(0,0);console.warn('[WRECKMARCH] Fullscreen request failed; using fit mode',err)}sync()});document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);window.addEventListener('resize',()=>requestAnimationFrame(sync));sync()}
      if(debug){document.body.classList.add('debug-enabled');copyDebug.hidden=false;Object.assign(copyDebug.style,{position:'fixed',right:'22px',bottom:'76px',zIndex:'10020',padding:'10px 14px',border:'1px solid #4bd777',borderRadius:'12px',background:'#07100b',color:'#7dff9f',font:'700 12px monospace'});toggle.addEventListener('click',()=>{const c=panel.classList.toggle('collapsed');toggle.textContent=c?'DEBUG ▲':'DEBUG ▼';toggle.setAttribute('aria-expanded',String(!c))});copyDebug.addEventListener('click',async()=>{const text=lines.slice(-240).join('\n');try{await navigator.clipboard.writeText(text);copyDebug.textContent='COPIED ✓'}catch(_){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();copyDebug.textContent='COPIED ✓'}setTimeout(()=>copyDebug.textContent='COPY DEBUG',1200)});if(lines.length){panel.textContent=lines.slice(-120).join('\n');panel.classList.add('show')}}
      window.addEventListener('error',e=>log(`window.error: ${e.message}`));window.addEventListener('unhandledrejection',e=>log(`unhandledrejection: ${e.reason?.stack||e.reason}`));
      const fail=msg=>{log('ERROR: '+msg);status.textContent='LOAD FAILED — OPEN ?debug=1';status.classList.add('error');document.body.classList.add('boot-error')};
      const loadScript=(src,label)=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>{log(`${label} loaded`);res()};s.onerror=()=>rej(new Error(`${label} failed: ${src}`));document.head.appendChild(s)});
      (async()=>{try{
          status.textContent='LOADING ENGINE…';try{await loadScript('./vendor/phaser.min.js','Phaser local')}catch(localErr){log(localErr.message);await loadScript('https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js','Phaser CDN fallback')}if(!window.Phaser)throw Error('Phaser unavailable after local/fallback load');log(`Phaser ${Phaser.VERSION}`);status.textContent='BOOTING HERO…';
          await import('./src/game.js?v=8');log('Phase A hero core imported');status.textContent='INSTALLING ENEMY FOUNDATION…';const enemyFoundation=await import('./src/enemies/enemy-system.js?v=6');await enemyFoundation.installEnemyFoundation();log('Enemy Foundation active');status.textContent='BUILDING TERRAIN…';const phaseE0=await import('./src/phase-e0-fast-terrain.js?v=2');await phaseE0.applyFastTerrain();log('Fast terrain bootstrap active');status.textContent='APPLYING ART PACK…';const art=await import('./src/art-runtime.js?v=6');await art.applyProductionArt();log('Production art pack active');status.textContent='EXPANDING WORLD…';const phaseB=await import('./src/phase-b-runtime.js?v=3');await phaseB.applyPhaseB();log('Phase B large world active');status.textContent='POLISHING WEAPON + WORLD…';const phaseB1=await import('./src/phase-b1-polish.js?v=4');await phaseB1.applyPhaseB1Polish();log('Phase B.1 visual polish active');status.textContent='BUILDING CORE LOOP…';const phaseC=await import('./src/phase-c-runtime.js?v=4');await phaseC.applyPhaseC();log('Phase C core loop active');status.textContent='REBUILDING LANDSCAPE UX…';const phaseC1=await import('./src/phase-c1-runtime.js?v=2');await phaseC1.applyPhaseC1();log('Phase C.1 landscape UX active');status.textContent='APPLYING VISUAL FOUNDATION…';const phaseC2=await import('./src/phase-c2-runtime.js?v=2');await phaseC2.applyPhaseC2();log('Phase C.2 responsive visual foundation active');status.textContent='APPLYING EXCLUSIVE ART + MOTION POLISH…';const phaseC3=await import('./src/phase-c3-runtime.js?v=5');await phaseC3.applyPhaseC3();log('Phase C.3 exclusive art and motion polish active');status.textContent='FIXING ART FRAMES…';const phaseC31=await import('./src/phase-c3-frame-fix.js?v=2');await phaseC31.applyPhaseC31();log('Phase C.3.1 visual frame fix active');status.textContent='LOCKING WEAPON SOCKETS + TERRAIN…';const phaseC4=await import('./src/phase-c4-runtime.js?v=3');await phaseC4.applyPhaseC4();log('Phase C.4 sockets, Rig spring and PNG terrain active');status.textContent='ALIGNING HERO + HD CARDS + ROAD NETWORK…';const phaseC5=await import('./src/phase-c5-runtime.js?v=5');await phaseC5.applyPhaseC5();log('Phase C.5 directional hero, HD cards and road network active');status.textContent='APPLYING PHASE D.1…';const phaseD1=await import('./src/phase-d1-runtime.js?v=4');await phaseD1.applyPhaseD1();log('Phase D.1 world, Runner and mechanical-arm rebuild active');status.textContent='CLEANING ROAD LAYERS…';const phaseE1=await import('./src/phase-e1-runtime.js?v=3');await phaseE1.applyPhaseE1();log('Phase E.1 clean road renderer active');const ratVisuals=await import('./src/enemies/scrap-rat-visuals.js?v=5');await ratVisuals.installScrapRatVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Production Scrap Rat locked after final runtime');status.textContent='READY';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));document.documentElement.dataset.wreckmarchVisualReady='current';document.body.classList.add('visual-ready');log('Current visual stack revealed')}catch(err){fail(`Game module: ${err?.stack||err}`)}})();
      if(autotest)log('AUTOTEST requested');
    })();
  </script>
</body>
</html>
