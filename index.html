<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1114" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WRECKMARCH" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest?v=1" />
  <title>WRECKMARCH</title>
  <link rel="stylesheet" href="./style.css?v=16" />
  <link id="wm-frontend-shell-styles" rel="stylesheet" href="./src/ui/frontend-shell.css?v=3" />
  <link id="wm-frontend-interaction-styles" rel="stylesheet" href="./src/ui/frontend-interaction.css?v=1" />
  <link id="wm-progression-styles" rel="stylesheet" href="./src/ui/progression.css?v=4" />
  <link id="wm-workshop-styles" rel="stylesheet" href="./src/workshop/workshop.css?v=1" />
  <link id="wm-results-styles" rel="stylesheet" href="./src/ui/results.css?v=2" />
  <link id="wm-run-control-modal-styles" rel="stylesheet" href="./src/ui/run-control-modal.css?v=1" />
  <link id="wm-frontend-responsive-styles" rel="stylesheet" href="./src/ui/frontend-responsive.css?v=7" />
</head>
<body>
  <div id="game"></div>
  <div id="boot"><strong>WRECKMARCH</strong><span>BUILD • ROLL • SURVIVE</span><small id="boot-status">LOADING VISUAL SLICE…</small></div>
  <button id="fs-btn">⛶ FULLSCREEN</button>
  <details id="debug"><summary>DEBUG ▼</summary><button id="copy-debug">COPY DEBUG</button><button id="copy-upgrade-debug">COPY UPGRADE STATE</button><pre id="log"></pre></details>
  <script type="module">
    const logEl=document.getElementById('log'); const status=document.getElementById('boot-status');
    const log=(m)=>{ console.log(m); logEl.textContent += `\n${m}`; logEl.scrollTop=logEl.scrollHeight; };
    window.__WM_LOG__=log;
    const fail=(m)=>{ console.error(m); document.body.classList.add('boot-error'); status.textContent='FAILED TO LOAD — OPEN DEBUG'; status.classList.add('error'); log(m); };
    const params=new URLSearchParams(location.search);
    const debug=params.has('debug')||params.get('debug')==='1';
    document.body.classList.toggle('debug-enabled',debug);
    const setStandaloneMode=()=>document.body.classList.toggle('standalone-mode',window.matchMedia?.('(display-mode: standalone)')?.matches||window.navigator.standalone===true);
    setStandaloneMode(); window.matchMedia?.('(display-mode: standalone)')?.addEventListener?.('change',setStandaloneMode);
    document.getElementById('copy-debug').onclick=async()=>{try{await navigator.clipboard?.writeText(logEl.textContent||'')}catch(e){log(`Clipboard: ${e}`)}};
    document.getElementById('copy-upgrade-debug').onclick=async()=>{try{const scene=window.__WM_GAME__?.scene?.getScene?.('Wreckmarch');if(!scene)throw new Error('Wreckmarch scene unavailable');const dumpApi=await import('./src/upgrades/upgrade-debug-dump.js?v=1');const dump=dumpApi.stringifyUpgradeDebugDump(scene);log(`UPGRADE_STATE ${dump}`);try{await navigator.clipboard?.writeText(dump)}catch(copyError){log(`UPGRADE_STATE_COPY_FAILED ${copyError}`)}}catch(e){log(`UPGRADE_STATE_ERROR ${e?.stack||e}`)}};
    const requestLandscapeLock=async(source='runtime')=>{
      const orientation=screen.orientation;
      window.__WM_ORIENTATION__={requested:'landscape',source,supported:typeof orientation?.lock==='function'};
      try{
        if(typeof orientation?.lock==='function') await orientation.lock('landscape');
        window.__WM_ORIENTATION__={...window.__WM_ORIENTATION__,locked:true};
      }catch(error){
        window.__WM_ORIENTATION__={...window.__WM_ORIENTATION__,locked:false,error:String(error)};
        log(`Orientation lock unavailable: ${error}`);
      }
    };
    document.getElementById('fs-btn').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen?.();await requestLandscapeLock('fullscreen')}else await document.exitFullscreen?.()}catch(e){log(`Fullscreen: ${e}`)}};
    if(document.body.classList.contains('standalone-mode')) requestLandscapeLock('standalone');
    window.addEventListener('pointerdown',()=>requestLandscapeLock('interaction'),{once:true,passive:true});
    const boot=async()=>{try{status.textContent='LOADING PHASER…';await import('https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.esm.js').then(m=>window.Phaser=m.default||m);log(`Phaser ${window.Phaser.VERSION}`);status.textContent='OPENING DEPLOYMENT TERMINAL…';const frontendRuntime=await import('./src/ui/frontend-runtime.js?v=10&wreckerValidation=4');const selectedCharacter=await frontendRuntime.runInitialFrontendFlow();log(`Selected character: ${selectedCharacter.id}`);status.textContent='STARTING GAME…';await import('./src/game.js?v=9');log('Phase A hero core imported');const gameBridge=await import('./src/runtime-game-handle-bridge.js?v=2');gameBridge.syncRuntimeGameHandle();const selectedCharacterRuntime=await import('./src/characters/selected-character-runtime.js?v=3&wreckerValidation=4');await selectedCharacterRuntime.applySelectedCharacterToGame(window.__WM_GAME__,selectedCharacter.id);const telemetryRuntime=await import('./src/telemetry/telemetry-runtime.js?v=15');telemetryRuntime.installTelemetryRuntime(window.__WM_GAME__);log('Run telemetry runtime active');const resultsRuntime=await import('./src/ui/results-runtime.js?v=5');resultsRuntime.installResultsRuntime(window.__WM_GAME__);log('Canonical results runtime active');status.textContent='INSTALLING ENEMY FOUNDATION…';const enemyFoundation=await import('./src/enemies/enemy-system.js?v=28');await enemyFoundation.installEnemyFoundation();log('Enemy Foundation active');status.textContent='BUILDING TERRAIN…';const phaseE0=await import('./src/phase-e0-fast-terrain.js?v=3');await phaseE0.applyFastTerrain();log('Fast terrain bootstrap active');status.textContent='APPLYING ART PACK…';const art=await import('./src/art-runtime.js?v=7');await art.applyProductionArt();log('Production art pack active');status.textContent='EXPANDING WORLD…';const phaseB=await import('./src/phase-b-runtime.js?v=6');await phaseB.applyPhaseB();log('Phase B large world active');status.textContent='POLISHING WEAPON + WORLD…';const phaseB1=await import('./src/phase-b1-polish.js?v=5');await phaseB1.applyPhaseB1Polish();log('Phase B.1 visual polish active');status.textContent='BUILDING CORE LOOP…';const phaseC=await import('./src/phase-c-runtime.js?v=24');await phaseC.applyPhaseC();log('Phase C core loop active');status.textContent='REBUILDING LANDSCAPE UX…';const phaseC1=await import('./src/phase-c1-runtime.js?v=19&u7=1');await phaseC1.applyPhaseC1();log('Phase C.1 landscape UX active');status.textContent='APPLYING VISUAL FOUNDATION…';const phaseC2=await import('./src/phase-c2-runtime.js?v=3&u7=1');await phaseC2.applyPhaseC2();log('Phase C.2 responsive visual foundation active');status.textContent='APPLYING EXCLUSIVE ART + MOTION POLISH…';const phaseC3=await import('./src/phase-c3-runtime.js?v=8&u7=1');await phaseC3.applyPhaseC3();log('Phase C.3 exclusive art and motion polish active');status.textContent='FIXING ART FRAMES…';const phaseC31=await import('./src/phase-c3-frame-fix.js?v=7&u7=1');await phaseC31.applyPhaseC31();log('Phase C.3.1 visual frame fix active');status.textContent='LOCKING WEAPON SOCKETS + TERRAIN…';const phaseC4=await import('./src/phase-c4-runtime.js?v=5');await phaseC4.applyPhaseC4();log('Phase C.4 sockets, Rig spring and PNG terrain active');status.textContent='ALIGNING HERO + HD CARDS + ROAD NETWORK…';const phaseC5=await import('./src/phase-c5-runtime.js?v=10&u7=1&wrecker=4');await phaseC5.applyPhaseC5();log('Phase C.5 character-driven presentation, HD cards and road network active');status.textContent='APPLYING PHASE D.1…';const phaseD1=await import('./src/phase-d1-runtime.js?v=29&u5=3&wrecker=4');await phaseD1.applyPhaseD1();log('Phase D.1 character production presentation and canonical upgrade card art active');const mobileHud=await import('./src/mobile-hud-loader-canonical-v2.js?rev=3');mobileHud.installMobileHudPolish(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Canonical mobile HUD active; Results owner preserved');status.textContent='CLEANING ROAD LAYERS…';const phaseE1=await import('./src/phase-e1-runtime.js?v=19');await phaseE1.applyPhaseE1();log('Phase E.1 clean road renderer active');const sawbugVisualHotfix=await import('./src/enemies/sawbug-visuals.js?v=4');await sawbugVisualHotfix.installSawbugVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Sawbug safe windup visual hotfix active');const companionV3=await import('./src/companion-runtime-v3.js?v=3');companionV3.applyCompanionV3(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Companion hand socket aligned');const ratVisuals=await import('./src/enemies/scrap-rat-visuals.js?v=7');await ratVisuals.installScrapRatVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Production Scrap Rat locked after final runtime');status.textContent='FINAL POLISH…';const finalPolish=await import('./src/final-polish-runtime.js?v=2');await finalPolish.applyFinalPolish(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Final presentation polish active');const settingsRuntime=await import('./src/ui/settings-runtime.js?v=1');settingsRuntime.installSettingsRuntime(window.__WM_GAME__);log('Canonical settings runtime active');const pauseRuntime=await import('./src/ui/pause-runtime.js?v=4');pauseRuntime.installPauseRuntime(window.__WM_GAME__);log('Canonical pause runtime active');status.textContent='READY';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));document.documentElement.dataset.wreckmarchVisualReady='current';document.body.classList.add('visual-ready');log('Current visual stack revealed')}catch(err){fail(`Game module: ${err?.stack||err}`)}};
    boot();
  </script>
</body>
</html>
