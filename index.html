<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171d26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WRECKMARCH — Landscape Combat UX</title>
  <link rel="stylesheet" href="./style.css?v=9" />
</head>
<body>
  <main id="game-shell" aria-label="Wreckmarch visual slice">
    <div id="boot"><strong>WRECKMARCH</strong><span>BUILD • ROLL • SURVIVE</span><small id="boot-status">LOADING VISUAL SLICE…</small></div>
    <div id="game"></div>
    <div id="rotate-device" aria-live="polite"><div class="rotate-icon">↻</div><strong>ROTATE TO LANDSCAPE</strong><span>WRECKMARCH is built for horizontal play.</span></div>
    <button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen">⛶ FULLSCREEN</button>
    <button id="debug-toggle" type="button" aria-controls="debug-panel" aria-expanded="true">DEBUG ▼</button>
    <button id="debug-copy" type="button" aria-label="Copy debug log" hidden>COPY DEBUG</button>
    <pre id="debug-panel" aria-live="polite"></pre>
  </main>
  <script>
    (() => {
      const debug = new URLSearchParams(location.search).has('debug'); window.__WM_DEBUG__ = debug;
      const panel=document.getElementById('debug-panel'),toggle=document.getElementById('debug-toggle'),copyDebug=document.getElementById('debug-copy'),fullscreenToggle=document.getElementById('fullscreen-toggle'),status=document.getElementById('boot-status'),DEBUG_STORE='wreckmarch-debug-v1'; let lines=[]; try{lines=JSON.parse(localStorage.getItem(DEBUG_STORE)||'[]').slice(-240)}catch(_){lines=[]}
      const standalone=window.matchMedia?.('(display-mode: standalone)')?.matches||window.navigator.standalone===true||window.__WM_NATIVE_APP__===true,fullscreenTarget=document.getElementById('game-shell');
      const requestFullscreen=()=>fullscreenTarget.requestFullscreen?.({navigationUI:'hide'})||fullscreenTarget.webkitRequestFullscreen?.(),exitFullscreen=()=>document.exitFullscreen?.()||document.webkitExitFullscreen?.(),getFullscreenElement=()=>document.fullscreenElement||document.webkitFullscreenElement||null,nativeFullscreenSupported=!!(fullscreenTarget.requestFullscreen||fullscreenTarget.webkitRequestFullscreen);
      if(!standalone){document.body.classList.add('browser-shell');if(nativeFullscreenSupported)document.body.classList.add('browser-fullscreen-capable');const sync=()=>{const active=!!getFullscreenElement(),fit=document.body.classList.contains('browser-fit-mode');document.body.classList.toggle('is-fullscreen',active);fullscreenToggle.textContent=active||fit?'↙ EXIT':(nativeFullscreenSupported?'⛶ FULLSCREEN':'⛶ FIT SCREEN');fullscreenToggle.setAttribute('aria-label',active||fit?'Exit fullscreen view':'Enter fullscreen view')};fullscreenToggle.addEventListener('click',async()=>{try{if(nativeFullscreenSupported){if(getFullscreenElement())await exitFullscreen();else{await requestFullscreen();try{await screen.orientation?.lock?.('landscape')}catch(_){}}}else{document.body.classList.toggle('browser-fit-mode');window.scrollTo?.(0,0)}}catch(err){document.body.classList.toggle('browser-fit-mode');window.scrollTo?.(0,0);console.warn('[WRECKMARCH] Fullscreen request failed; using fit mode',err)}sync()});document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);window.addEventListener('resize',()=>requestAnimationFrame(sync));sync()}
      if(debug){document.body.classList.add('debug-enabled');copyDebug.hidden=false;Object.assign(copyDebug.style,{position:'fixed',right:'22px',bottom:'76px',zIndex:'10020',padding:'10px 14px',border:'1px solid #4bd777',borderRadius:'12px',background:'#07100b',color:'#7dff9f',font:'700 12px monospace'});toggle.addEventListener('click',()=>{const c=panel.classList.toggle('collapsed');toggle.textContent=c?'DEBUG ▲':'DEBUG ▼';toggle.setAttribute('aria-expanded',String(!c))});copyDebug.addEventListener('click',async()=>{const text=lines.slice(-240).join('\n');try{await navigator.clipboard.writeText(text);copyDebug.textContent='COPIED ✓'}catch(_){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();copyDebug.textContent='COPIED ✓'}setTimeout(()=>copyDebug.textContent='COPY DEBUG',1200)});if(lines.length){panel.textContent=lines.slice(-40).join('\n');panel.classList.add('show')}}
      const log=msg=>{const line=`[${new Date().toLocaleTimeString()}] ${msg}`;lines.push(line);if(lines.length>300)lines=lines.slice(-300);try{localStorage.setItem(DEBUG_STORE,JSON.stringify(lines))}catch(_){}if(debug){panel.textContent=lines.slice(-40).join('\n');panel.classList.add('show')}console.log('[WRECKMARCH]',msg)};
      const fail=msg=>{log('ERROR: '+msg);status.textContent='LOAD FAILED — OPEN ?debug=1';status.classList.add('error');document.body.classList.add('boot-error')};
      window.__WM_LOG__=log;window.addEventListener('error',e=>fail(`${e.message||'Script error'} @ ${e.filename||'unknown'}:${e.lineno||0}`));window.addEventListener('unhandledrejection',e=>fail(`Promise: ${e.reason?.message||e.reason||'unknown'}`));
      const sources=['./vendor/phaser.min.js?v=3.90.0','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js'];
      const loadEngine=(i=0)=>{if(i>=sources.length)return fail('Could not load Phaser from local bundle or CDNs.');status.textContent=`LOADING ENGINE ${i+1}/${sources.length}…`;log(`Loading Phaser: ${sources[i]}`);const script=document.createElement('script');script.src=sources[i];script.async=true;let finished=false;const timer=setTimeout(()=>{if(finished)return;finished=true;log(`Engine source ${i+1} timed out`);script.remove();loadEngine(i+1)},8000);
        script.onload=async()=>{if(finished)return;finished=true;clearTimeout(timer);if(!window.Phaser){log(`Source ${i+1} loaded without Phaser global`);script.remove();return loadEngine(i+1)}log(`Phaser ${window.Phaser.VERSION||'loaded'}`);status.textContent='STARTING HERO CORE…';try{if(!window.__WM_GAME_CAPTURE__){const GameCtor=window.Phaser.Game;window.Phaser.Game=new Proxy(GameCtor,{construct(Target,args,NewTarget){const game=Reflect.construct(Target,args,NewTarget===window.Phaser.Game?Target:NewTarget);window.__WM_GAME__=game;window.Phaser.GAMES=window.Phaser.GAMES||[];if(!window.Phaser.GAMES.includes(game))window.Phaser.GAMES.push(game);return game}});window.__WM_GAME_CAPTURE__=true;log('Installed Phaser game capture')}const graphicsProto=window.Phaser?.GameObjects?.Graphics?.prototype;if(graphicsProto&&typeof graphicsProto.quadraticBezierTo!=='function'){graphicsProto.quadraticBezierTo=function(_cx,_cy,x,y){this.lineTo(x,y);return this};log('Applied Phaser Graphics compatibility shim')}
          await import('./src/game.js?v=7');log('Phase A hero core imported');status.textContent='APPLYING ART PACK…';const art=await import('./src/art-runtime.js?v=2');await art.applyProductionArt();log('Production art pack active');status.textContent='EXPANDING WORLD…';const phaseB=await import('./src/phase-b-runtime.js?v=1');await phaseB.applyPhaseB();log('Phase B large world active');status.textContent='POLISHING WEAPON + WORLD…';const phaseB1=await import('./src/phase-b1-polish.js?v=2');await phaseB1.applyPhaseB1Polish();log('Phase B.1 visual polish active');status.textContent='BUILDING CORE LOOP…';const phaseC=await import('./src/phase-c-runtime.js?v=2');await phaseC.applyPhaseC();log('Phase C core loop active');status.textContent='REBUILDING LANDSCAPE UX…';const phaseC1=await import('./src/phase-c1-runtime.js?v=1');await phaseC1.applyPhaseC1();log('Phase C.1 landscape UX active');status.textContent='APPLYING VISUAL FOUNDATION…';const phaseC2=await import('./src/phase-c2-runtime.js?v=1');await phaseC2.applyPhaseC2();log('Phase C.2 responsive visual foundation active');status.textContent='APPLYING EXCLUSIVE ART + MOTION POLISH…';const phaseC3=await import('./src/phase-c3-runtime.js?v=4');await phaseC3.applyPhaseC3();log('Phase C.3 exclusive art and motion polish active');status.textContent='FIXING ART FRAMES…';const phaseC31=await import('./src/phase-c3-frame-fix.js?v=1');await phaseC31.applyPhaseC31();log('Phase C.3.1 visual frame fix active');status.textContent='LOCKING WEAPON SOCKETS + TERRAIN…';const phaseC4=await import('./src/phase-c4-runtime.js?v=2');await phaseC4.applyPhaseC4();log('Phase C.4 sockets, Rig spring and PNG terrain active');status.textContent='ALIGNING HERO + HD CARDS + ROAD NETWORK…';const phaseC5=await import('./src/phase-c5-runtime.js?v=3');await phaseC5.applyPhaseC5();log('Phase C.5 directional hero, HD cards and road network active');status.textContent='APPLYING PHASE D.1…';const phaseD1=await import('./src/phase-d1-runtime.js?v=1');await phaseD1.applyPhaseD1();log('Phase D.1 world, Runner and mechanical-arm rebuild active');status.textContent='CLEANING ROAD LAYERS…';const phaseE1=await import('./src/phase-e1-runtime.js?v=2');await phaseE1.applyPhaseE1();log('Phase E.1 clean road renderer active');status.textContent='READY'}catch(err){fail(`Game module: ${err?.stack||err}`)}};
        script.onerror=()=>{if(finished)return;finished=true;clearTimeout(timer);log(`Engine source ${i+1} failed`);script.remove();loadEngine(i+1)};document.head.appendChild(script)};
      log(`Boot phase-e1b-road-persistence-v2 ${debug?'DEBUG':'NORMAL'} • ${navigator.userAgent}`);loadEngine();
    })();
  </script>
</body>
</html>
