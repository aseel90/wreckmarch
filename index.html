<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#080b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WRECKMARCH" />
  <link rel="manifest" href="./manifest.webmanifest?v=1" />
  <title>WRECKMARCH</title>
  <link rel="stylesheet" href="./style.css?v=frontend-shell-20260903-responsive-v6" />
</head>
<body>
  <div id="game-shell">
    <div id="game-wrap"></div>
    <div id="loading-screen" class="wm-loading-screen">
      <div class="wm-loading-mark">WRECKMARCH</div>
      <div id="loading-status" class="wm-loading-status">BOOTING</div>
      <div id="loading-log" class="wm-loading-log"></div>
    </div>
  </div>

  <script src="./vendor/phaser.min.js?v=3.90.0"></script>
  <script type="module">
    const status = document.getElementById('loading-status');
    const logBox = document.getElementById('loading-log');
    const log = (message) => {
      const line = document.createElement('div');
      line.textContent = String(message);
      logBox?.appendChild(line);
      console.log('[WRECKMARCH]', message);
    };
    const fail = (message) => {
      status.textContent = 'FAILED';
      log(message);
      console.error('[WRECKMARCH]', message);
    };
    window.__WM_LOG__ = log;

    async function boot() {
      try {
        status.textContent = 'BASE GAME';
        const { bootWreckmarch } = await import('./src/game.js?v=12&u4=3&wrecker=5');
        const game = bootWreckmarch();
        window.__WM_GAME__ = game;
        log('Base game booted');

        status.textContent = 'ART';
        const art = await import('./src/art-runtime.js?v=4');
        await art.applyArtRuntime();
        log('Art runtime active');

        status.textContent = 'PHASE B';
        const phaseB = await import('./src/phase-b-runtime.js?v=7');
        await phaseB.applyPhaseB();
        log('Phase B active');

        status.textContent = 'PHASE B1';
        const phaseB1 = await import('./src/phase-b1-polish.js?v=2');
        await phaseB1.applyPhaseB1();
        log('Phase B1 active');

        status.textContent = 'PHASE C';
        const phaseC = await import('./src/phase-c-runtime.js?v=10&u7=1');
        await phaseC.applyPhaseC();
        log('Phase C active');

        status.textContent = 'PHASE C1';
        const phaseC1 = await import('./src/phase-c1-runtime.js?v=18&u7=2');
        await phaseC1.applyPhaseC1();
        log('Phase C1 active');

        status.textContent = 'PHASE C2';
        const phaseC2 = await import('./src/phase-c2-runtime.js?v=10');
        await phaseC2.applyPhaseC2();
        log('Phase C2 active');

        status.textContent = 'PHASE C3';
        const phaseC3 = await import('./src/phase-c3-runtime.js?v=13');
        await phaseC3.applyPhaseC3();
        log('Phase C3 active');

        status.textContent = 'PHASE C3 FIX';
        const phaseC3Fix = await import('./src/phase-c3-frame-fix.js?v=2');
        await phaseC3Fix.applyPhaseC3FrameFix();
        log('Phase C3 frame fix active');

        status.textContent = 'PHASE C4';
        const phaseC4 = await import('./src/phase-c4-runtime.js?v=8');
        await phaseC4.applyPhaseC4();
        log('Phase C4 active');

        status.textContent = 'PHASE C5';
        const phaseC5 = await import('./src/phase-c5-runtime.js?v=13&wrecker=11');
        await phaseC5.applyPhaseC5();
        log('Phase C5 active');

        status.textContent = 'PHASE D1';
        const phaseD1 = await import('./src/phase-d1-runtime.js?v=30&u5=3&wrecker=11');
        await phaseD1.applyPhaseD1();
        log('Phase D1 active');

        status.textContent = 'PHASE E0';
        const phaseE0 = await import('./src/phase-e0-fast-terrain.js?v=3');
        await phaseE0.applyPhaseE0FastTerrain();
        log('Phase E0 terrain active');

        status.textContent = 'PHASE E1';
        const phaseE1 = await import('./src/phase-e1-runtime.js?v=20');
        await phaseE1.applyPhaseE1();
        log('Phase E1 active');

        status.textContent = 'SELECTED CHARACTER';
        const selectedCharacter = await import('./src/characters/selected-character-runtime.js?v=3&wrecker=1');
        await selectedCharacter.installSelectedCharacterRuntime(game);
        log('Selected character runtime active');

        status.textContent = 'RUNTIME BRIDGE';
        const bridge = await import('./src/runtime-game-handle-bridge.js?v=1');
        bridge.installRuntimeGameHandleBridge(game);
        log('Runtime game bridge active');

        status.textContent = 'TELEMETRY';
        const telemetry = await import('./src/telemetry/telemetry-runtime.js?v=9&wreckerHealth=1&wreckerIdentity=1');
        telemetry.installTelemetryRuntime(game);
        log('Telemetry runtime active');

        status.textContent = 'ENEMIES';
        const enemySystem = await import('./src/enemies/enemy-system.js?v=29&wreckerHealth=1');
        await enemySystem.installEnemyFoundation();
        log('Enemy foundation active');

        status.textContent = 'INPUT';
        const inputManager = await import('./src/input/input-manager.js?v=1');
        inputManager.installInputManager(game);
        log('Input manager active');

        status.textContent = 'GAME SHELL';
        const shell = await import('./src/ui/game-shell.js?v=15&wrecker=2');
        shell.installGameShell(game);
        log('Game shell active');

        status.textContent = 'MOBILE HUD';
        const hudLoader = await import('./src/mobile-hud-loader-canonical-v2.js');
        await hudLoader.installCanonicalMobileHud();
        log('Canonical mobile HUD active');

        status.textContent = 'RAT VISUALS';
        const ratVisuals = await import('./src/enemies/scrap-rat-visuals.js?v=7');
        await ratVisuals.installScrapRatVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));
        log('Production Scrap Rat locked after final runtime');

        status.textContent = 'FINAL POLISH…';
        const finalPolish = await import('./src/final-polish-runtime.js?v=2');
        await finalPolish.applyFinalPolish(window.__WM_GAME__.scene.getScene('Wreckmarch'));
        log('Final presentation polish active');

        const settingsRuntime = await import('./src/ui/settings-runtime.js?v=1');
        settingsRuntime.installSettingsRuntime(window.__WM_GAME__);
        log('Canonical settings runtime active');

        const pauseRuntime = await import('./src/ui/pause-runtime.js?v=4');
        pauseRuntime.installPauseRuntime(window.__WM_GAME__);
        log('Canonical pause runtime active');

        status.textContent = 'READY';
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        document.documentElement.dataset.wreckmarchVisualReady = 'current';
        document.body.classList.add('visual-ready');
        log('Current visual stack revealed');
      } catch (err) {
        fail(`Game module: ${err?.stack || err}`);
      }
    }

    boot();
  </script>
</body>
</html>
