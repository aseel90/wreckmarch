<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#11161f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wreckmarch" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/ui/hunter-portrait.png" />
  <title>WRECKMARCH</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11161f;font-family:monospace;color:#dbe2ea}body{display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none;opacity:0;transition:opacity .12s ease}body.visual-ready canvas{opacity:1}#boot{position:fixed;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#11161f;color:#dbe2ea;letter-spacing:2px}#boot strong{font-size:32px}#boot span{font-size:11px;color:#8c98a8}#boot small{font-size:10px;color:#6b7685}body.visual-ready #boot{display:none}#debug{display:none;position:fixed;z-index:50;left:8px;right:8px;bottom:8px;max-height:45vh;overflow:auto;background:rgba(0,0,0,.9);border:1px solid #5c6673;color:#cfd8e3;padding:8px;font-size:11px;white-space:pre-wrap}body.debug-enabled #debug{display:block}#boot-status.error{color:#ff8d8d}#boot.failed{display:flex;background:#1a1012}
  </style>
</head>
<body>
  <div id="boot"><strong>WRECKMARCH</strong><span>BUILD • ROLL • SURVIVE</span><small id="boot-status">LOADING VISUAL SLICE…</small></div>
  <details id="debug"><summary>DEBUG LOG</summary><pre id="log"></pre></details>
  <script type="module">
    const params=new URLSearchParams(location.search);if(params.get('debug')==='1')document.body.classList.add('debug-enabled');
    const bootEl=document.getElementById('boot'), status=document.getElementById('boot-status'), logEl=document.getElementById('log');
    const log=(m)=>{const line=`[${new Date().toLocaleTimeString()}] ${m}`;console.log(line);logEl.textContent+=line+'\n';};window.__WM_LOG__=log;
    const fail=(m)=>{log(m);status.textContent='LOAD FAILED — OPEN DEBUG';status.classList.add('error');bootEl.classList.add('failed');document.body.classList.add('boot-error');document.body.classList.add('debug-enabled');document.getElementById('debug').open=true};
    addEventListener('error',e=>fail(`Window error: ${e.message}`));addEventListener('unhandledrejection',e=>fail(`Unhandled promise: ${e.reason?.stack||e.reason}`));
    const boot=async()=>{try{status.textContent='LOADING PHASER…';await import('https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.esm.js').then(m=>window.Phaser=m.default||m);log(`Phaser ${window.Phaser.VERSION}`);status.textContent='STARTING GAME…';await import('./src/game.js?v=9');log('Phase A hero core imported');const gameBridge=await import('./src/runtime-game-handle-bridge.js?v=2');gameBridge.syncRuntimeGameHandle();const telemetryRuntime=await import('./src/telemetry/telemetry-runtime.js?v=15');telemetryRuntime.installTelemetryRuntime(window.__WM_GAME__);log('Run telemetry runtime active');status.textContent='INSTALLING ENEMY FOUNDATION…';const enemyFoundation=await import('./src/enemies/enemy-system.js?v=27');await enemyFoundation.installEnemyFoundation();log('Enemy Foundation active');status.textContent='BUILDING TERRAIN…';const phaseE0=await import('./src/phase-e0-fast-terrain.js?v=3');await phaseE0.applyFastTerrain();log('Fast terrain bootstrap active');status.textContent='APPLYING ART PACK…';const art=await import('./src/art-runtime.js?v=7');await art.applyProductionArt();log('Production art pack active');status.textContent='EXPANDING WORLD…';const phaseB=await import('./src/phase-b-runtime.js?v=6');await phaseB.applyPhaseB();log('Phase B large world active');status.textContent='POLISHING WEAPON + WORLD…';const phaseB1=await import('./src/phase-b1-polish.js?v=5');await phaseB1.applyPhaseB1Polish();log('Phase B.1 visual polish active');status.textContent='BUILDING CORE LOOP…';const phaseC=await import('./src/phase-c-runtime.js?v=22');await phaseC.applyPhaseC();log('Phase C core loop active');status.textContent='REBUILDING LANDSCAPE UX…';const phaseC1=await import('./src/phase-c1-runtime.js?v=18');await phaseC1.applyPhaseC1();log('Phase C.1 landscape UX active');status.textContent='APPLYING VISUAL FOUNDATION…';const phaseC2=await import('./src/phase-c2-runtime.js?v=3');await phaseC2.applyPhaseC2();log('Phase C.2 responsive visual foundation active');status.textContent='APPLYING EXCLUSIVE ART + MOTION POLISH…';const phaseC3=await import('./src/phase-c3-runtime.js?v=8');await phaseC3.applyPhaseC3();log('Phase C.3 exclusive art and motion polish active');status.textContent='FIXING ART FRAMES…';const phaseC31=await import('./src/phase-c3-frame-fix.js?v=6');await phaseC31.applyPhaseC31();log('Phase C.3.1 visual frame fix active');status.textContent='LOCKING WEAPON SOCKETS + TERRAIN…';const phaseC4=await import('./src/phase-c4-runtime.js?v=5');await phaseC4.applyPhaseC4();log('Phase C.4 sockets, Rig spring and PNG terrain active');status.textContent='ALIGNING HERO + HD CARDS + ROAD NETWORK…';const phaseC5=await import('./src/phase-c5-runtime.js?v=7');await phaseC5.applyPhaseC5();log('Phase C.5 directional hero, HD cards and road network active');status.textContent='APPLYING PHASE D.1…';const phaseD1=await import('./src/phase-d1-runtime.js?v=27');await phaseD1.applyPhaseD1();log('Phase D.1 Hunter runner, mechanical-arm rebuild and canonical upgrade card art active');const mobileHud=await import('./src/mobile-hud-loader-telemetry-v1.js');mobileHud.installMobileHudPolish(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Canonical mobile HUD + end-run owner active');status.textContent='CLEANING ROAD LAYERS…';const phaseE1=await import('./src/phase-e1-runtime.js?v=17');await phaseE1.applyPhaseE1();log('Phase E.1 clean road renderer active');const sawbugVisualHotfix=await import('./src/enemies/sawbug-visuals.js?v=4');await sawbugVisualHotfix.installSawbugVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Sawbug safe windup visual hotfix active');const companionV3=await import('./src/companion-runtime-v3.js?v=3');companionV3.applyCompanionV3(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Companion hand socket aligned');const ratVisuals=await import('./src/enemies/scrap-rat-visuals.js?v=7');await ratVisuals.installScrapRatVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Production Scrap Rat locked after final runtime');status.textContent='FINAL POLISH…';const finalPolish=await import('./src/final-polish-runtime.js?v=2');await finalPolish.applyFinalPolish(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Final presentation polish active');status.textContent='READY';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));document.documentElement.dataset.wreckmarchVisualReady='current';document.body.classList.add('visual-ready');log('Current visual stack revealed')}catch(err){fail(`Game module: ${err?.stack||err}`)}};
    boot();
  </script>
</body>
</html>
