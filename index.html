<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171d26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WRECKMARCH — Prototype</title>
  <link rel="stylesheet" href="./style.css?v=3" />
</head>
<body>
  <main id="game-shell" aria-label="Wreckmarch prototype">
    <div id="boot">
      <strong>WRECKMARCH</strong>
      <span>BUILD • ROLL • SURVIVE</span>
      <small id="boot-status">LOADING ENGINE…</small>
    </div>
    <div id="game"></div>
    <pre id="debug-panel" aria-live="polite"></pre>
  </main>
  <script>
    (() => {
      const debug = new URLSearchParams(location.search).has('debug');
      window.__WM_DEBUG__ = debug;
      const panel = document.getElementById('debug-panel');
      const status = document.getElementById('boot-status');
      const lines = [];

      const log = (msg) => {
        const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
        lines.push(line);
        if (debug) {
          panel.textContent = lines.slice(-18).join('\n');
          panel.classList.add('show');
        }
        console.log('[WRECKMARCH]', msg);
      };

      const fail = (msg) => {
        log('ERROR: ' + msg);
        status.textContent = 'LOAD FAILED — OPEN ?debug=1';
        status.classList.add('error');
        document.body.classList.add('boot-error');
      };

      window.__WM_LOG__ = log;
      window.addEventListener('error', e => fail(`${e.message || 'Script error'} @ ${e.filename || 'unknown'}:${e.lineno || 0}`));
      window.addEventListener('unhandledrejection', e => fail(`Promise: ${e.reason?.message || e.reason || 'unknown'}`));

      const sources = [
        './vendor/phaser.min.js?v=3.90.0',
        'https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js',
        'https://unpkg.com/phaser@3.90.0/dist/phaser.min.js'
      ];

      const loadEngine = (i = 0) => {
        if (i >= sources.length) return fail('Could not load Phaser from local bundle or CDNs.');
        status.textContent = `LOADING ENGINE ${i + 1}/${sources.length}…`;
        log(`Loading Phaser: ${sources[i]}`);
        const script = document.createElement('script');
        script.src = sources[i];
        script.async = true;
        let finished = false;
        const timer = setTimeout(() => {
          if (finished) return;
          finished = true;
          log(`Engine source ${i + 1} timed out`);
          script.remove();
          loadEngine(i + 1);
        }, 8000);
        script.onload = async () => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          if (!window.Phaser) {
            log(`Source ${i + 1} loaded without Phaser global`);
            script.remove();
            return loadEngine(i + 1);
          }
          log(`Phaser ${window.Phaser.VERSION || 'loaded'}`);
          status.textContent = 'STARTING RUN…';
          try {
            await import('./src/game.js?v=3');
            log('Game module imported');
          } catch (err) {
            fail(`Game module: ${err?.stack || err}`);
          }
        };
        script.onerror = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          log(`Engine source ${i + 1} failed`);
          script.remove();
          loadEngine(i + 1);
        };
        document.head.appendChild(script);
      };

      log(`Boot ${debug ? 'DEBUG' : 'NORMAL'} • ${navigator.userAgent}`);
      loadEngine();
    })();
  </script>
</body>
</html>
