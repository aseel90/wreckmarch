<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1317" />
  <title>Wreckmarch</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1317;font-family:Arial,sans-serif;touch-action:none}#game{width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100%;max-height:100%}#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#1d252a,#0d1013 72%);z-index:100;color:#d8e4e8;letter-spacing:.12em}#boot .p{width:min(82vw,520px)}#boot .brand{font:900 clamp(28px,7vw,60px)/1 Arial Black,Arial;color:#d98446;text-shadow:0 3px 0 #5f3827;margin-bottom:16px}#boot .status{font:700 12px/1.5 monospace;color:#86d5df;white-space:pre-wrap}.visual-ready #boot{display:none}
  </style>
</head>
<body>
  <div id="game"></div><div id="boot"><div class="p"><div class="brand">WRECKMARCH</div><div id="status" class="status">BOOTING…</div></div></div>
  <script type="module">
    const status=document.getElementById('status');
    const log=m=>{status.textContent=m;console.log('[WM]',m)};
    window.__WM_LOG__=log;
    const fail=e=>{status.textContent='ERROR\n'+e;console.error(e)};
    const boot=async()=>{try{status.textContent='LOADING PHASER…';await import('https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.esm.js').then(m=>window.Phaser=m.default||m);log(`Phaser ${window.Phaser.VERSION}`);status.textContent='STARTING GAME…';await import('./src/game.js?v=9');log('Phase A hero core imported');const gameBridge=await import('./src/runtime-game-handle-bridge.js?v=2');gameBridge.syncRuntimeGameHandle();status.textContent='INSTALLING ENEMY FOUNDATION…';const enemyFoundation=await import('./src/enemies/enemy-system.js?v=10');await enemyFoundation.installEnemyFoundation();log('Enemy Foundation active');status.textContent='BUILDING TERRAIN…';const phaseE0=await import('./src/phase-e0-fast-terrain.js?v=3');await phaseE0.applyFastTerrain();log('Fast terrain bootstrap active');status.textContent='APPLYING ART PACK…';const art=await import('./src/art-runtime.js?v=7');await art.applyProductionArt();log('Production art pack active');status.textContent='EXPANDING WORLD…';const phaseB=await import('./src/phase-b-runtime.js?v=4');await phaseB.applyPhaseB();log('Phase B large world active');status.textContent='POLISHING WEAPON + WORLD…';const phaseB1=await import('./src/phase-b1-polish.js?v=5');await phaseB1.applyPhaseB1Polish();log('Phase B.1 visual polish active');status.textContent='BUILDING CORE LOOP…';const phaseC=await import('./src/phase-c-runtime.js?v=6');await phaseC.applyPhaseC();log('Phase C core loop active');status.textContent='REBUILDING LANDSCAPE UX…';const phaseC1=await import('./src/phase-c1-runtime.js?v=3');await phaseC1.applyPhaseC1();log('Phase C.1 landscape UX active');status.textContent='APPLYING VISUAL FOUNDATION…';const phaseC2=await import('./src/phase-c2-runtime.js?v=3');await phaseC2.applyPhaseC2();log('Phase C.2 responsive visual foundation active');status.textContent='APPLYING EXCLUSIVE ART + MOTION POLISH…';const phaseC3=await import('./src/phase-c3-runtime.js?v=6');await phaseC3.applyPhaseC3();log('Phase C.3 exclusive art and motion polish active');status.textContent='FIXING ART FRAMES…';const phaseC31=await import('./src/phase-c3-frame-fix.js?v=4');await phaseC31.applyPhaseC31();log('Phase C.3.1 visual frame fix active');status.textContent='LOCKING WEAPON SOCKETS + TERRAIN…';const phaseC4=await import('./src/phase-c4-runtime.js?v=4');await phaseC4.applyPhaseC4();log('Phase C.4 sockets, Rig spring and PNG terrain active');status.textContent='ALIGNING HERO + HD CARDS + ROAD NETWORK…';const phaseC5=await import('./src/phase-c5-runtime.js?v=6');await phaseC5.applyPhaseC5();log('Phase C.5 directional hero, HD cards and road network active');status.textContent='APPLYING PHASE D.1…';const phaseD1=await import('./src/phase-d1-runtime.js?v=7');await phaseD1.applyPhaseD1();log('Phase D.1 world, Runner and mechanical-arm rebuild active');status.textContent='CLEANING ROAD LAYERS…';const phaseE1=await import('./src/phase-e1-runtime.js?v=15');await phaseE1.applyPhaseE1();log('Phase E.1 clean road renderer active');const sawbugVisualHotfix=await import('./src/enemies/sawbug-visuals.js?v=4');await sawbugVisualHotfix.installSawbugVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Sawbug safe windup visual hotfix active');const companionV3=await import('./src/companion-runtime-v3.js?v=2');companionV3.applyCompanionV3(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Companion hand socket aligned');const ratVisuals=await import('./src/enemies/scrap-rat-visuals.js?v=7');await ratVisuals.installScrapRatVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Production Scrap Rat locked after final runtime');status.textContent='FINAL POLISH…';const finalPolish=await import('./src/final-polish-runtime.js?v=1');await finalPolish.applyFinalPolish(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Final presentation polish active');status.textContent='READY';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));document.documentElement.dataset.wreckmarchVisualReady='current';document.body.classList.add('visual-ready');log('Current visual stack revealed')}catch(err){fail(`Game module: ${err?.stack||err}`)}};
    boot();
  </script>
</body>
</html>
