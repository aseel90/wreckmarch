<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#171d26" />
  <title>Wreckmarch</title>
  <link rel="stylesheet" href="./style.css?v=8" />
</head>
<body>
  <div id="boot-cover"><div class="loader-ring"></div><div id="boot-status">LOADING ENGINE…</div></div>
  <div id="rotate-gate"><div class="rotate-icon">↻</div><div>ROTATE DEVICE</div><small>WRECKMARCH plays in landscape</small></div>
  <div id="game"></div>
  <div id="debug-panel" aria-live="polite"><button id="debug-toggle" type="button">DEBUG ▾</button><pre id="debug-log"></pre></div>
  <script>
    (()=>{
      const debug=new URLSearchParams(location.search).get('debug')==='1';
      const panel=document.getElementById('debug-panel'),logEl=document.getElementById('debug-log'),toggle=document.getElementById('debug-toggle'),status=document.getElementById('boot-status');
      if(debug)panel.style.display='block';
      let collapsed=false;
      toggle?.addEventListener('click',()=>{collapsed=!collapsed;panel.classList.toggle('collapsed',collapsed);toggle.textContent=collapsed?'DEBUG ▸':'DEBUG ▾'});
      const log=m=>{const line=`[${new Date().toLocaleTimeString()}] ${m}`;console.log(line);if(debug)logEl.textContent+=line+'\n';};window.__WM_LOG__=log;
      const fail=m=>{status.textContent='BOOT FAILED';document.body.classList.add('boot-failed');log(m)};
      const sources=['./vendor/phaser.min.js?v=3.90.0','https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js'];
      const loadEngine=(i=0)=>{if(i>=sources.length)return fail('Could not load Phaser from local bundle or CDNs.');status.textContent=`LOADING ENGINE ${i+1}/${sources.length}…`;log(`Loading Phaser: ${sources[i]}`);const script=document.createElement('script');script.src=sources[i];script.async=true;let finished=false;const timer=setTimeout(()=>{if(finished)return;finished=true;log(`Engine source ${i+1} timed out`);script.remove();loadEngine(i+1)},8000);
        script.onload=async()=>{if(finished)return;finished=true;clearTimeout(timer);if(!window.Phaser){log(`Source ${i+1} loaded without Phaser global`);script.remove();return loadEngine(i+1)}log(`Phaser ${window.Phaser.VERSION||'loaded'}`);status.textContent='STARTING HERO CORE…';try{if(!window.__WM_GAME_CAPTURE__){const GameCtor=window.Phaser.Game;window.Phaser.Game=new Proxy(GameCtor,{construct(Target,args,NewTarget){const game=Reflect.construct(Target,args,NewTarget===window.Phaser.Game?Target:NewTarget);window.__WM_GAME__=game;window.Phaser.GAMES=window.Phaser.GAMES||[];if(!window.Phaser.GAMES.includes(game))window.Phaser.GAMES.push(game);return game}});window.__WM_GAME_CAPTURE__=true;log('Installed Phaser game capture')}const graphicsProto=window.Phaser?.GameObjects?.Graphics?.prototype;if(graphicsProto&&typeof graphicsProto.quadraticBezierTo!=='function'){graphicsProto.quadraticBezierTo=function(_cx,_cy,x,y){this.lineTo(x,y);return this};log('Applied Phaser Graphics compatibility shim')}
          await import('./src/game.js?v=8');log('Phase A hero core imported');status.textContent='INSTALLING ENEMY FOUNDATION…';const enemyFoundation=await import('./src/enemies/enemy-system.js?v=5');await enemyFoundation.installEnemyFoundation();log('Enemy Foundation active');status.textContent='BUILDING TERRAIN…';const phaseE0=await import('./src/phase-e0-fast-terrain.js?v=2');await phaseE0.applyFastTerrain();log('Fast terrain bootstrap active');status.textContent='APPLYING ART PACK…';const art=await import('./src/art-runtime.js?v=5');await art.applyProductionArt();log('Production art pack active');status.textContent='EXPANDING WORLD…';const phaseB=await import('./src/phase-b-runtime.js?v=3');await phaseB.applyPhaseB();log('Phase B large world active');status.textContent='POLISHING WEAPON + WORLD…';const phaseB1=await import('./src/phase-b1-polish.js?v=4');await phaseB1.applyPhaseB1Polish();log('Phase B.1 visual polish active');status.textContent='BUILDING CORE LOOP…';const phaseC=await import('./src/phase-c-runtime.js?v=4');await phaseC.applyPhaseC();log('Phase C core loop active');status.textContent='REBUILDING LANDSCAPE UX…';const phaseC1=await import('./src/phase-c1-runtime.js?v=2');await phaseC1.applyPhaseC1();log('Phase C.1 landscape UX active');status.textContent='APPLYING VISUAL FOUNDATION…';const phaseC2=await import('./src/phase-c2-runtime.js?v=2');await phaseC2.applyPhaseC2();log('Phase C.2 responsive visual foundation active');status.textContent='APPLYING EXCLUSIVE ART + MOTION POLISH…';const phaseC3=await import('./src/phase-c3-runtime.js?v=5');await phaseC3.applyPhaseC3();log('Phase C.3 exclusive art and motion polish active');status.textContent='FIXING ART FRAMES…';const phaseC31=await import('./src/phase-c3-frame-fix.js?v=1');await phaseC31.applyPhaseC31();log('Phase C.3.1 visual frame fix active');status.textContent='LOCKING WEAPON SOCKETS + TERRAIN…';const phaseC4=await import('./src/phase-c4-runtime.js?v=3');await phaseC4.applyPhaseC4();log('Phase C.4 sockets, Rig spring and PNG terrain active');status.textContent='ALIGNING HERO + HD CARDS + ROAD NETWORK…';const phaseC5=await import('./src/phase-c5-runtime.js?v=5');await phaseC5.applyPhaseC5();log('Phase C.5 directional hero, HD cards and road network active');status.textContent='APPLYING PHASE D.1…';const phaseD1=await import('./src/phase-d1-runtime.js?v=3');await phaseD1.applyPhaseD1();log('Phase D.1 world, Runner and mechanical-arm rebuild active');status.textContent='CLEANING ROAD LAYERS…';const phaseE1=await import('./src/phase-e1-runtime.js?v=3');await phaseE1.applyPhaseE1();log('Phase E.1 clean road renderer active');const ratVisuals=await import('./src/enemies/scrap-rat-visuals.js?v=5');await ratVisuals.installScrapRatVisuals(window.__WM_GAME__.scene.getScene('Wreckmarch'));log('Production Scrap Rat locked after final runtime');status.textContent='READY';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));document.documentElement.dataset.wreckmarchVisualReady='current';document.body.classList.add('visual-ready');log('Current visual stack revealed')}catch(err){fail(`Game module: ${err?.stack||err}`)}};
        script.onerror=()=>{if(finished)return;finished=true;clearTimeout(timer);log(`Engine source ${i+1} failed`);script.remove();loadEngine(i+1)};document.head.appendChild(script)};
      log(`Boot f0-weapon-projectile-ownership-v1 ${debug?'DEBUG':'NORMAL'} • ${navigator.userAgent}`);loadEngine();
    })();
  </script>
</body>
</html>
