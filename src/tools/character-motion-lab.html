<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Wrecker 4-direction Motion Lab</title>
<style>
  :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  *{box-sizing:border-box} body{margin:0;background:#0b0f14;color:#eef4ff;min-height:100vh;overflow:hidden}
  .wrap{min-height:100vh;display:flex;flex-direction:column;gap:10px;padding:10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.08em} .hint{font-size:12px;opacity:.72}
  .arena{position:relative;flex:1;min-height:420px;border:1px solid #273141;border-radius:16px;overflow:hidden;background:
    radial-gradient(circle at 50% 50%,rgba(91,118,154,.08),transparent 45%),
    linear-gradient(#111823,#0d131c)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
  .actor{position:absolute;left:50%;top:50%;width:160px;height:190px;transform:translate(-50%,-50%);will-change:left,top,transform;filter:drop-shadow(0 14px 10px rgba(0,0,0,.45))}
  .body{position:absolute;left:16px;top:6px;width:128px;height:148px;transform-origin:64px 126px;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .weapon{position:absolute;left:71px;top:72px;width:86px;transform-origin:18px 16px;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .shadow{position:absolute;left:41px;top:143px;width:80px;height:25px;border-radius:50%;background:rgba(0,0,0,.42);filter:blur(2px);transform-origin:center}
  .label{position:absolute;left:50%;top:164px;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:.14em;color:#86d7ff;text-shadow:0 2px 4px #000;white-space:nowrap}
  .pad{position:absolute;left:16px;bottom:16px;width:174px;height:174px;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);touch-action:none}
  .pad button{border:1px solid #42536c;background:rgba(19,29,42,.88);color:white;font-size:23px;border-radius:12px;margin:3px;touch-action:none}.pad button:active,.pad button.on{background:#315b7c}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
  .status{position:absolute;right:16px;bottom:16px;padding:10px 12px;border-radius:12px;background:rgba(9,14,21,.82);border:1px solid #2d3b50;font-size:12px;line-height:1.5;min-width:145px}
  .status b{color:#86d7ff}.banner{position:absolute;left:50%;top:15px;transform:translateX(-50%);padding:7px 10px;border-radius:999px;background:rgba(7,11,17,.72);border:1px solid #2b3d53;font-size:11px;letter-spacing:.1em}
  @media(max-width:600px){.wrap{padding:6px}.arena{min-height:500px}.pad{left:8px;bottom:8px;transform:scale(.92);transform-origin:bottom left}.status{right:8px;bottom:8px}.actor{width:145px;height:180px}.body{left:9px}.weapon{left:64px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>WRECKER — TRUE 4-DIRECTION MOVEMENT LAB</h1><div class="hint">Arrow keys / WASD / touch pad · AUTO demo starts immediately</div></div>
  <div class="arena" id="arena">
    <div class="grid"></div><div class="banner">AUTO: RIGHT → DOWN → LEFT → UP</div>
    <div class="actor" id="actor">
      <div class="shadow" id="shadow"></div>
      <img class="body" id="body" src="../../assets/hero/shotgun/idle-0.svg" alt="Wrecker" />
      <img class="weapon" id="weapon" src="../../assets/weapons/shotgun.svg" alt="shotgun" />
      <div class="label" id="label">RIGHT</div>
    </div>
    <div class="pad">
      <button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button>
    </div>
    <div class="status">Direction: <b id="dirText">RIGHT</b><br>Mode: <b id="modeText">AUTO</b><br>Movement: <b>REAL X/Y</b></div>
  </div>
</div>
<script>
(() => {
  const arena = document.getElementById('arena');
  const actor = document.getElementById('actor');
  const body = document.getElementById('body');
  const weapon = document.getElementById('weapon');
  const shadow = document.getElementById('shadow');
  const label = document.getElementById('label');
  const dirText = document.getElementById('dirText');
  const modeText = document.getElementById('modeText');
  const key = {left:false,right:false,up:false,down:false};
  let x = .5, y = .5, last = 'right', manualUntil = 0, lastTs = performance.now(), gait = 0;
  const speed = 0.22;

  function setKey(dir,on){ key[dir]=on; if(on){last=dir;manualUntil=performance.now()+3500;modeText.textContent='MANUAL';} }
  const map = {ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
  addEventListener('keydown',e=>{const d=map[e.key];if(d){e.preventDefault();setKey(d,true)}});
  addEventListener('keyup',e=>{const d=map[e.key];if(d){e.preventDefault();setKey(d,false)}});
  document.querySelectorAll('[data-dir]').forEach(btn=>{
    const d=btn.dataset.dir;
    const on=e=>{e.preventDefault();btn.classList.add('on');setKey(d,true);try{btn.setPointerCapture(e.pointerId)}catch{}};
    const off=e=>{e.preventDefault();btn.classList.remove('on');key[d]=false};
    btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',e=>{if(e.buttons===0)off(e)});
  });

  function autoVector(t){
    const phase = Math.floor((t/1800)%4);
    if(phase===0)return {dx:1,dy:0,dir:'right'};
    if(phase===1)return {dx:0,dy:1,dir:'down'};
    if(phase===2)return {dx:-1,dy:0,dir:'left'};
    return {dx:0,dy:-1,dir:'up'};
  }

  function renderDirection(dir,moving,t){
    const bob = moving ? Math.sin(gait*Math.PI*2)*2.2 : Math.sin(t/650)*.7;
    const step = moving ? Math.sin(gait*Math.PI*2) : 0;
    let sx=1, lean=0, bodyY=bob, bodyX=0, weaponRot=0, weaponX=0, weaponY=0, squish=1;
    if(dir==='left'){sx=-1;lean=-2.2;bodyX=-2;weaponRot=-2;label.textContent='LEFT';}
    if(dir==='right'){sx=1;lean=2.2;bodyX=2;weaponRot=2;label.textContent='RIGHT';}
    if(dir==='up'){sx=1;lean=-1;bodyY=bob-2;weaponY=-4;weaponRot=-4;label.textContent='UP';squish=.965;}
    if(dir==='down'){sx=1;lean=1;bodyY=bob+2;weaponY=4;weaponRot=4;label.textContent='DOWN';squish=1.025;}
    body.style.transform=`translate(${bodyX}px,${bodyY}px) scaleX(${sx}) scaleY(${squish}) rotate(${lean + step*0.7}deg)`;
    weapon.style.transform=`translate(${weaponX}px,${weaponY + bob*.65}px) scaleX(${sx}) rotate(${weaponRot + step*.9}deg)`;
    shadow.style.transform=`scale(${1.02-Math.abs(step)*.035},${.92+Math.abs(step)*.03})`;
    dirText.textContent=dir.toUpperCase();
  }

  function frame(ts){
    const dt=Math.min(.033,(ts-lastTs)/1000);lastTs=ts;
    let dx=(key.right?1:0)-(key.left?1:0), dy=(key.down?1:0)-(key.up?1:0), dir=last;
    const manual = performance.now()<manualUntil || dx||dy;
    if(!manual){const a=autoVector(ts);dx=a.dx;dy=a.dy;dir=a.dir;last=dir;modeText.textContent='AUTO';}
    else if(dx||dy){ if(Math.abs(dx)>Math.abs(dy))dir=dx>0?'right':'left'; else dir=dy>0?'down':'up'; last=dir; }
    const moving=!!(dx||dy);
    if(moving){const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;x+=dx*speed*dt;y+=dy*speed*dt;gait=(gait+dt*2.55)%1;}
    x=Math.max(.09,Math.min(.91,x));y=Math.max(.13,Math.min(.82,y));
    actor.style.left=`${x*100}%`;actor.style.top=`${y*100}%`;
    renderDirection(dir,moving,ts);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
